name: Bubbleverse Q007 ACT Observable Attribution V2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: q007-act-observable-attribution-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-q006:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Find latest completed Q006 attribution run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --workflow q006-likelihood-attribution-v1.yml \
            --status completed \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")] | first | .databaseId')"
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download exact Q006 final artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p q007_parent
          gh run download "${{ steps.find.outputs.run_id }}" \
            --name q006-likelihood-attribution-v1-final \
            --dir q007_parent
          test -f q007_parent/q006_likelihood_attribution_v1_result.json
          python - <<'PY'
          import json
          p="q007_parent/q006_likelihood_attribution_v1_result.json"
          d=json.load(open(p))
          assert d["q"]=="Q-006", "PARENT_Q_IDENTITY_GATE=FAIL"
          assert d.get("status")=="PASS", "Q006_PARENT_FINAL_GATE=FAIL"
          print("Q006_PARENT_FINAL_GATE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q007-q006-parent
          path: q007_parent/q006_likelihood_attribution_v1_result.json
          retention-days: 30

  point:
    needs: acquire-q006
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: ede_n3, h0: 70.853292, tag: ede-baseline}
          - {model: ede_n3, h0: 71.5, tag: ede-71p5}
          - {model: ede_n3, h0: 72.5, tag: ede-72p5}
          - {model: ede_n3, h0: 73.5, tag: ede-73p5}
          - {model: me_common, h0: 70.157184, tag: me-baseline}
          - {model: me_common, h0: 71.5, tag: me-71p5}
          - {model: me_common, h0: 72.5, tag: me-72p5}
          - {model: me_common, h0: 73.5, tag: me-73p5}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
    steps:
      - uses: actions/checkout@v4
      - name: Q007 source gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("q007_act_observable_attribution_v2.py")
          text = p.read_text(encoding="utf-8")
          required = [
              'Q007_CODE_VERSION = "2.0-h0-fixed"',
              'needed_from_bestfit = set(needed) - {"H0"}',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f"Q007_SOURCE_GATE=FAIL missing={missing}")
          print("Q007_SOURCE_GATE=PASS version=2.0-h0-fixed")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Build frozen Q005/Q006 common backend
        run: bash q005_setup_v14.sh
      - uses: actions/download-artifact@v4
        with:
          name: q007-q006-parent
          path: q007_parent
      - name: Context and exact-point preflight
        run: |
          python q007_act_observable_attribution_v2.py preflight \
            --q006 q007_parent/q006_likelihood_attribution_v1_result.json
      - name: Fixed-point ACT attribution
        run: |
          mkdir -p q007_results
          python q007_act_observable_attribution_v2.py run \
            --q006 q007_parent/q006_likelihood_attribution_v1_result.json \
            --model "${{ matrix.model }}" \
            --target-h0 "${{ matrix.h0 }}" \
            --derivatives \
            --output "q007_results/q007_point_${{ matrix.tag }}.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: q007-point-${{ matrix.tag }}
          path: q007_results/q007_point_${{ matrix.tag }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: ${{ always() }}
    needs: [acquire-q006, point]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2 numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: q007-point-*
          path: q007_aggregate/input
      - name: Aggregate exact covariance-aware attribution
        run: |
          python q007_act_observable_attribution_v2.py aggregate \
            --input q007_aggregate/input \
            --output q007_aggregate/q007_act_observable_attribution_v1_result.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: q007-act-observable-attribution-v1-final
          path: q007_aggregate/q007_act_observable_attribution_v1_result.json
          retention-days: 90
