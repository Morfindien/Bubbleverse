name: "🔧 INSTALL Q048 PHASE-TURN V8"

on:
  workflow_dispatch:

concurrency:
  group: q048-install-phase-turn-v8
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed registry and README reconciliation
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain)"
          test -z "$before"
          python q048_v8_repository_patch.py
          python q048_phase_turn_package_check_v8.py
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]:-}"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "INSTALL_GATE=PASS_ALREADY_INSTALLED"
            exit 0
          fi
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' README.md bubbleverse_program_registry.json | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          echo "INSTALL_DIFF_GATE=PASS"
      - name: Commit canonical registry and README only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "INSTALL_COMMIT_GATE=PASS_ALREADY_INSTALLED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md bubbleverse_program_registry.json
          test -z "$(git diff --cached --name-only | grep -Ev '^(README\.md|bubbleverse_program_registry\.json)$' || true)"
          git commit -m "Install Q048 phase-turn V8 registry and README"
          git push origin HEAD:main
          echo "INSTALL_COMMIT_GATE=PASS"
