name: Bubbleverse Q030 audit finalization validator repair R1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CURRENT_Q: Q030
  RUN_ID: Q030-ORIGINAL-GATE-PRECISION-AUDIT-V1
  RESULT_ID: R-Q030-ORIGINAL-GATE-PRECISION-AUDIT-001
  ORIGINAL_AUDIT_RUN_ID: '33962896373'
  Q028_RUN_ID: '33957937309'

jobs:
  finalize:
    name: Q030 audit validator repair and finalization
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Static validator-repair gates
        run: |
          python -m pip install --disable-pip-version-check PyYAML numpy
          python -m py_compile \
            q030_original_gate_precision_audit_v1.py \
            q030_original_gate_precision_audit_tests_v1r1.py
          python - <<'PY'
          import pathlib
          p=pathlib.Path('q030_original_gate_precision_audit_tests_v1r1.py').read_text()
          assert '"T_MM_model_quadratic" in d.get("terms", {})' in p
          assert '"T_MM" in d.get("terms", {})' not in p
          print('VALIDATOR_REPAIR_STATIC_GATE=PASS')
          PY

      - name: Download immutable original audit mask 3
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Morfindien/Bubbleverse
          run-id: ${{ env.ORIGINAL_AUDIT_RUN_ID }}
          name: q030-original-gate-audit-m3
          path: audit_masks

      - name: Download immutable original audit mask 6
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Morfindien/Bubbleverse
          run-id: ${{ env.ORIGINAL_AUDIT_RUN_ID }}
          name: q030-original-gate-audit-m6
          path: audit_masks

      - name: Download immutable original audit mask 7
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Morfindien/Bubbleverse
          run-id: ${{ env.ORIGINAL_AUDIT_RUN_ID }}
          name: q030-original-gate-audit-m7
          path: audit_masks

      - name: Download authoritative Q028 V8 final
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Morfindien/Bubbleverse
          run-id: ${{ env.Q028_RUN_ID }}
          name: q028-final-v8
          path: q028_parent

      - name: Deterministically reconstruct merged audit from original shards
        run: |
          python q030_original_gate_precision_audit_v1.py \
            --config q030_original_gate_precision_audit_v1_config.yml \
            merge \
            --mask-dir audit_masks \
            --q028-final q028_parent/q028_final_v8.json \
            --output q030_original_gate_precision_audit_merged_v1.json

      - name: Run repaired audit-integrity validator
        run: |
          python q030_original_gate_precision_audit_tests_v1r1.py \
            --config q030_original_gate_precision_audit_v1_config.yml \
            --result q030_original_gate_precision_audit_merged_v1.json \
            --output q030_original_gate_precision_audit_tests_v1r1.json

      - name: Construct final immutable audit result
        run: |
          python - <<'PY'
          import json
          r=json.load(open('q030_original_gate_precision_audit_merged_v1.json'))
          t=json.load(open('q030_original_gate_precision_audit_tests_v1r1.json'))
          if t['AUDIT_EXECUTION_GATE'] != 'PASS':
              raise SystemExit('AUDIT_EXECUTION_GATE=FAIL')
          if r['ORIGINAL_Q030_GATE'] != 'PASS':
              raise SystemExit('ORIGINAL_Q030_GATE='+str(r['ORIGINAL_Q030_GATE']))

          r['AUDIT_EXECUTION_GATE']='PASS'
          r['tests']=t
          r['validator_repair']={
              'repair_id':'Q030-AUDIT-VALIDATOR-REPAIR-R1',
              'original_audit_run_id':33962896373,
              'failure_class':'VALIDATOR_SCHEMA_KEY_LOOKUP_BUG',
              'failed_test':'T006_STABLE_METHOD_NOT_ALGEBRAIC_RESCUE',
              'incorrect_lookup':'literal T_MM key',
              'correct_schema_key':'T_MM_model_quadratic',
              'scientific_audit_reexecuted':False,
              'mask_shards_changed':False,
              'numerical_values_changed':False,
              'tolerances_changed':False,
              'original_q030_gate_changed':False,
          }
          with open('q030_original_gate_precision_audit_final_v1.json','w') as f:
              json.dump(r,f,indent=2,sort_keys=True)
              f.write('\n')
          print('AUDIT_EXECUTION_GATE=PASS ORIGINAL_Q030_GATE=PASS')
          PY

      - name: Upload final Q030 original-gate audit
        uses: actions/upload-artifact@v4
        with:
          name: q030-original-gate-precision-audit-final-v1
          path: |
            q030_original_gate_precision_audit_merged_v1.json
            q030_original_gate_precision_audit_tests_v1r1.json
            q030_original_gate_precision_audit_final_v1.json
          if-no-files-found: error
          retention-days: 90
