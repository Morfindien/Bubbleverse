name: Bubbleverse Q014 n=3 EDE External Viability V8

on:
  workflow_dispatch:
    inputs:
      depth:
        description: "V8 continuation depth; V7 numerical design preserved; standard and expanded both execute the frozen 15-job certification matrix"
        required: true
        default: "standard"
        type: choice
        options: [standard, expanded]

permissions:
  contents: read
  actions: read

concurrency:
  group: q014-external-viability-v8-${{ github.ref }}
  cancel-in-progress: false

env:
  CURRENT_Q: Q014
  RUN_ID: Q014-EXTERNAL-VIABILITY-V8
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages

jobs:
  prepare:
    name: Q014 V8 frozen science + Q011/V6 parent gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      depth: ${{ steps.plan.outputs.depth }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - name: Frozen V5 scientific surface Git-blob gate
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local file="$1" expected="$2" repository_blob worktree_blob
            test -f "$file" || { echo "Q014_V5_SCIENCE_SURFACE_REUSE_GATE=FAIL missing=$file" >&2; exit 31; }
            repository_blob="$(git rev-parse "HEAD:$file")"
            worktree_blob="$(git hash-object "$file")"
            echo "Q014_V5_BLOB_CHECK file=$file expected=$expected repository=$repository_blob worktree=$worktree_blob"
            test "$repository_blob" = "$expected" || { echo "Q014_V5_SCIENCE_SURFACE_REUSE_GATE=FAIL repository_blob file=$file" >&2; exit 32; }
            test "$worktree_blob" = "$expected" || { echo "Q014_V5_SCIENCE_SURFACE_REUSE_GATE=FAIL worktree_blob file=$file" >&2; exit 33; }
          }
          check_blob q014_external_viability_v5.py f5fa9cc237b2fc8a28bf8561b1471d885072dc01
          check_blob q014_external_viability_v5_config.yml 0f2c9caef194bcee3ee8f7895f8ef2ea9ab8b71b
          check_blob q014_setup_v5.sh e67e713de478e00340fbbc5b3b4e1e00e0406ef1
          for f in \
            q014_external_viability_v8.py \
            q014_external_viability_v8_config.yml \
            q014_setup_v8.sh \
            q014_aggregate_v8.py \
            q014_tests_v8.py \
            q014_external_viability_v8_source_lock.json \
            q014_case_state_v8.json; do
              test -f "$f" || { echo "Q014_V8_REQUIRED_FILE_GATE=FAIL missing=$f" >&2; exit 34; }
              echo "Q014_V8_REQUIRED_FILE_GATE=PASS file=$f"
          done
          echo "Q014_V5_SCIENCE_SURFACE_REUSE_GATE=PASS mode=AUTHORITATIVE_GIT_BLOB_IDENTITY"
      - name: Download exact authoritative Q011 V4 target artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p q014_parent/q011
          gh run download "33363067156" --name q011-ede-globality-certification-v4-final --dir q014_parent/q011
          test -f q014_parent/q011/q011_ede_globality_certification_v4_result.json
      - name: Download and freeze V6 numerical parent — not a scientific result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p q014_parent/v6_raw q014_parent/v6
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33483557343/artifacts?per_page=100" > /tmp/q014_v6_artifacts.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/q014_v6_artifacts.json'))
          a=[x for x in d.get('artifacts',[]) if x.get('name')=='q014-external-viability-v6-final']
          assert len(a)==1,a
          a=a[0]
          assert int(a['id'])==9795008419,a
          assert a.get('digest')=='sha256:efe77e9bd2a4550299b1488f12e5e6eb851d6af906c372f845b226c6f35a0b4c',a
          wr=a.get('workflow_run') or {}
          assert wr.get('head_sha')=='3188463e62395333fc8d06ea464a95b7e13f5500',wr
          print('Q014_V6_ARTIFACT_PROVENANCE_GATE=PASS')
          PY
          gh run download "33483557343" \
            --name q014-external-viability-v6-final \
            --dir q014_parent/v6_raw
          SRC="$(find q014_parent/v6_raw -type f -name q014_external_viability_v6_result.json -print -quit)"
          test -n "$SRC"
          cp "$SRC" q014_parent/v6/q014_external_viability_v6_result.json
          python - <<'PY'
          import json
          p='q014_parent/v6/q014_external_viability_v6_result.json'
          d=json.load(open(p))
          assert d.get('q')=='Q014'
          assert d.get('run_id')=='Q014-EXTERNAL-VIABILITY-V6'
          assert d.get('result_id')=='R-Q014-EDE-EXTERNAL-VIABILITY-003'
          assert d.get('validation_status')=='NUMERICALLY UNRESOLVED'
          assert d.get('scientifically_usable_result') is False
          j=d.get('job_manifest',{})
          assert j.get('expected')==27 and j.get('returned')==27
          assert not j.get('missing') and not j.get('duplicates')
          print('Q014_V6_NUMERICAL_PARENT_GATE=PASS')
          PY

      - name: V8 static guardrails and parent preflight
        run: |
          mkdir -p q014_v8_gates
          python q014_tests_v8.py static --output q014_v8_gates/q014_static_test_manifest_v8.json
          python q014_external_viability_v8.py preflight \
            --q011 q014_parent/q011/q011_ede_globality_certification_v4_result.json \
            --v6-result q014_parent/v6/q014_external_viability_v6_result.json \
            --output q014_v8_gates/q014_parent_preflight_v8.json
      - name: Build task matrix
        id: plan
        env:
          REQUESTED_DEPTH: ${{ inputs.depth }}
        run: |
          DEPTH="${REQUESTED_DEPTH:-standard}"
          python q014_external_viability_v8.py plan --depth "$DEPTH" --output q014_v8_gates/q014_task_matrix_v8.json >/tmp/matrix
          echo "matrix=$(tail -n 1 /tmp/matrix)" >> "$GITHUB_OUTPUT"
          echo "depth=$DEPTH" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          d=json.load(open('q014_v8_gates/q014_task_matrix_v8.json'))
          assert len(d['include'])==15,len(d['include'])
          print('Q014_V8_TASK_COUNT_GATE=PASS',len(d['include']))
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: q014-v8-parent-and-plan
          path: |
            q014_parent
            q014_v8_gates
            q014_case_state_v8.json
          retention-days: 30

  spt-assets:
    name: Q014 reuse frozen V6 SPT MUSE source
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact V6 MUSE artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9790864493" > /tmp/q014_v6_muse_artifact.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/q014_v6_muse_artifact.json'))
          assert int(a['id'])==9790864493,a
          assert a.get('name')=='q014-v6-spt-muse-source',a
          assert a.get('digest')=='sha256:03446830394786015fc512f76c6c298719487816eb93c77554d31c16f1d862ca',a
          wr=a.get('workflow_run') or {}
          assert int(wr.get('id'))==33483557343,wr
          assert wr.get('head_sha')=='3188463e62395333fc8d06ea464a95b7e13f5500',wr
          print('Q014_V6_MUSE_ARTIFACT_PROVENANCE_GATE=PASS')
          PY
      - name: Download exact V6 MUSE source artifact
        uses: actions/download-artifact@v5
        with:
          name: q014-v6-spt-muse-source
          path: q014_v8_spt_assets_raw
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33483557343
      - name: Re-verify MUSE source bytes
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=4933ceb993ceb92e48b2191b8ccb1595d182bc4bc3862c1fbad61d5f82136e9b
          SRC="$(find q014_v8_spt_assets_raw -type f -name muse_3g_like_march_2025.zip -print -quit)"
          test -n "$SRC"
          ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED" || { echo "Q014_MUSE_SOURCE_FREEZE_GATE=FAIL expected=$EXPECTED actual=$ACTUAL" >&2; exit 41; }
          mkdir -p q014_v8_spt_assets
          cp "$SRC" q014_v8_spt_assets/muse_3g_like_march_2025.zip
          echo "$EXPECTED  q014_v8_spt_assets/muse_3g_like_march_2025.zip" > q014_v8_spt_assets/muse_3g_like_march_2025.sha256
          echo "Q014_V6_MUSE_BYTE_REUSE_GATE=PASS $EXPECTED"
      - uses: actions/upload-artifact@v5
        with:
          name: q014-v8-spt-muse-source
          path: q014_v8_spt_assets
          retention-days: 30

  smoke:
    name: Q014 smoke ${{ matrix.chain }}
    needs: [prepare, spt-assets]
    strategy:
      fail-fast: false
      matrix:
        chain: [planck_npipe_k039_approx, spt_d1_only, spt_d1_plus_desi]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Reuse frozen MUSE bytes for SPT
        if: ${{ startsWith(matrix.chain, 'spt_') }}
        uses: actions/download-artifact@v5
        with:
          name: q014-v8-spt-muse-source
          path: external/q014_v6_spt_assets
      - name: Build chain environment through V8 repair wrapper
        run: bash q014_setup_v8.sh "${{ matrix.chain }}"
      - uses: actions/download-artifact@v5
        with:
          name: q014-v8-parent-and-plan
          path: q014_context
      - name: Runtime environment preflight
        run: |
          python q014_external_viability_v8.py preflight --environment --chain "${{ matrix.chain }}" \
            --q011 q014_context/q014_parent/q011/q011_ede_globality_certification_v4_result.json \
            --v6-result q014_context/q014_parent/v6/q014_external_viability_v6_result.json \
            --output q014_environment_preflight_${{ matrix.chain }}.json
      - name: Finite technical smoke
        run: |
          python q014_external_viability_v8.py smoke --chain "${{ matrix.chain }}" \
            --q011 q014_context/q014_parent/q011/q011_ede_globality_certification_v4_result.json \
            --output q014_smoke_${{ matrix.chain }}.json
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: q014-v8-smoke-${{ matrix.chain }}
          path: |
            q014_environment_preflight_${{ matrix.chain }}.json
            q014_smoke_${{ matrix.chain }}.json
            q014_v8_source_runtime
          if-no-files-found: warn
          retention-days: 30

  profile:
    name: Q014 ${{ matrix.chain }} / ${{ matrix.mode }} / ${{ matrix.start_family }}
    needs: [prepare, spt-assets, smoke]
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Reuse frozen MUSE bytes for SPT
        if: ${{ startsWith(matrix.chain, 'spt_') }}
        uses: actions/download-artifact@v5
        with:
          name: q014-v8-spt-muse-source
          path: external/q014_v6_spt_assets
      - name: Build chain environment through V8 repair wrapper
        run: bash q014_setup_v8.sh "${{ matrix.chain }}"
      - uses: actions/download-artifact@v5
        with:
          name: q014-v8-parent-and-plan
          path: q014_context
      - name: Run one atomic profile task
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q014_v8_results
          OUT="q014_v8_results/q014_${{ matrix.tag }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 255m python q014_external_viability_v8.py run \
            --chain "${{ matrix.chain }}" --mode "${{ matrix.mode }}" \
            --start-family "${{ matrix.start_family }}" --restart-index "${{ matrix.restart_index }}" \
            --q011 q014_context/q014_parent/q011/q011_ede_globality_certification_v4_result.json \
            --v6-result q014_context/q014_parent/v6/q014_external_viability_v6_result.json \
            --output "$OUT"
          RC=$?
          set -e
          if [[ ! -f "$OUT" ]]; then
            python - "$OUT" "$RC" <<'PY'
          import json,sys
          out,rc=sys.argv[1],int(sys.argv[2])
          json.dump({"case_id":"NOT DOCUMENTED","q":"Q014","run_id":"Q014-EXTERNAL-VIABILITY-V8",
            "chain":"${{ matrix.chain }}","mode":"${{ matrix.mode }}","start_family":"${{ matrix.start_family }}",
            "restart_index":int("${{ matrix.restart_index }}"),"status":"TECHNICAL_FAILURE",
            "failure_type":"PROCESS_TERMINATED_BEFORE_RESULT_SERIALIZATION","process_exit":rc},open(out,"w"),indent=2)
          PY
          fi
          python - "$OUT" "$RC" <<'PY'
          import json,sys
          p,rc=sys.argv[1],int(sys.argv[2]); d=json.load(open(p)); d['workflow_process_exit']=rc
          json.dump(d,open(p,'w'),indent=2,sort_keys=True); print('Q014_TASK_STATUS=',d.get('status'),'PROCESS_EXIT=',rc)
          PY
          exit 0
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: q014-v8-profile-${{ matrix.tag }}
          path: |
            q014_v8_results/q014_${{ matrix.tag }}.json
            q014_v8_source_runtime
          if-no-files-found: warn
          retention-days: 30

  aggregate-and-test:
    name: Q014 aggregate + mandatory scientific tests
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, spt-assets, smoke, profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v5
        with:
          pattern: q014-v8-profile-*
          path: q014_v8_aggregate/jobs
      - uses: actions/download-artifact@v5
        with:
          pattern: q014-v8-smoke-*
          path: q014_v8_aggregate/smoke
      - uses: actions/download-artifact@v5
        with:
          name: q014-v8-parent-and-plan
          path: q014_v8_aggregate/context
      - name: Aggregate within chains only
        env:
          DEPTH: ${{ needs.prepare.outputs.depth }}
        run: |
          mkdir -p q014_v8_aggregate/final
          python q014_aggregate_v8.py --depth "$DEPTH" --inputs q014_v8_aggregate/jobs \
            --output q014_v8_aggregate/final/q014_external_viability_v8_result.json \
            --manifest-output q014_v8_aggregate/final/q014_job_manifest_v8.json
      - name: Mandatory result validation
        shell: bash
        run: |
          set +e
          python q014_tests_v8.py result --result q014_v8_aggregate/final/q014_external_viability_v8_result.json \
            --output q014_v8_aggregate/final/q014_test_manifest_v8.json
          TEST_RC=$?
          set -e
          python - <<'PY'
          import json
          p='q014_v8_aggregate/final/q014_external_viability_v8_result.json'; d=json.load(open(p))
          handoff={"case_id":d["case_id"],"bubbleverse_q":"Q014","original_case_question":d["original_case_question"],
            "status":"COMPLETE" if d.get("scientifically_usable_result") else "PARTIAL","validation_status":d.get("validation_status"),
            "scientific_target":"External n=3 EDE likelihood penalty at H0=71.5, by chain",
            "objective_basis":d.get("objective_basis"),
            "tests":"q014_test_manifest_v8.json",
            "sources":["K-029","K-036","K-038","K-039","K-040","INTERNAL-Q005","R-Q011-EDE-GLOBALITY-CERTIFICATION-004","R-Q012-EDE-LIKELIHOOD-ATTRIBUTION-001","R-Q014-EDE-EXTERNAL-VIABILITY-003-NUMERICAL-PARENT-ONLY"],
            "primary_results":{k:{"fixed_h0_profile_delta_chi2":v.get("penalties",{}).get("fixed_h0_profile_delta_chi2"),
            "q011_shared_physics_delta_chi2":v.get("penalties",{}).get("q011_shared_physics_delta_chi2"),"status":v.get("status")} for k,v in d.get("chains",{}).items()},
            "next_action_required":d.get("next_action_required",True),"claim_boundary":d.get("claim_boundary",{})}
          json.dump(handoff,open('q014_v8_aggregate/final/q014_result_ingestion_handoff_v8.json','w'),indent=2,sort_keys=True)
          PY
          exit "$TEST_RC"
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: q014-external-viability-v8-final
          path: |
            q014_v8_aggregate/final
            q014_v8_aggregate/smoke
            q014_v8_aggregate/context/q014_v8_gates
            q014_case_state_v8.json
            q014_external_viability_v8_source_lock.json
            q014_external_viability_v8_config.yml
            q014_external_viability_v5_config.yml
            q014_external_viability_v5_source_lock.json
          if-no-files-found: warn
          retention-days: 90
