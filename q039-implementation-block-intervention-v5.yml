name: Bubbleverse Q039 Implementation Block Intervention V5

on:
  workflow_dispatch:
    inputs:
      program_id:
        description: Registered Bubbleverse PROGRAM_ID
        required: false
        default: Q039-IMPLBLOCK-V5
        type: string

permissions:
  contents: read
  actions: read

env:
  CURRENT_Q: Q-039
  PROGRAM_ID: Q039-IMPLBLOCK-V5
  RUN_ID: Q039-IMPLEMENTATION-BLOCK-INTERVENTION-V5
  RESULT_ID: R-Q039-EDE-IMPLEMENTATION-BLOCK-INTERVENTION-001
  Q032_GITHUB_RUN_ID: '33994305721'
  Q032_EXECUTION_COMMIT: 4dc873a5e880d40858d831a3b421456728f0c032

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: V5 install, registry and source-placement gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYBOOT'
          from pathlib import Path
          import hashlib, json

          PROGRAM_ID='Q039-IMPLBLOCK-V5'
          WORKFLOW_ID='q039-implementation-block-intervention-v5.yml'
          WORKFLOW_PATH=Path('.github/workflows')/WORKFLOW_ID
          V4_FAILED_LAUNCH_RUN_ID=34141873450
          V4_FAILED_LAUNCH_JOB_ID=101805432562

          def sha(p: Path) -> str:
              return hashlib.sha256(p.read_bytes()).hexdigest()

          if not WORKFLOW_PATH.is_file():
              raise SystemExit(f'V5_WORKFLOW_PLACEMENT_GATE=FAIL missing={WORKFLOW_PATH}')
          wft=WORKFLOW_PATH.read_text(encoding='utf-8')
          if 'workflow_dispatch:' not in wft or 'Q039-IMPLBLOCK-V5' not in wft:
              raise SystemExit('V5_WORKFLOW_CONTENT_GATE=FAIL')

          registry_files=[]
          master=Path('bubbleverse_program_registry.json')
          if master.is_file(): registry_files.append(master)
          registry_files += [p for p in sorted(Path('.').glob('bubbleverse_program_registry_*.json')) if p != master]
          matches=[]
          for p in registry_files:
              d=json.loads(p.read_text(encoding='utf-8'))
              e=d.get('programs',{}).get(PROGRAM_ID)
              if e is not None: matches.append((p,e))
          if len(matches)!=1:
              raise SystemExit(f'V5_REGISTRY_UNIQUENESS_GATE=FAIL matches={[str(x[0]) for x in matches]}')
          rp,e=matches[0]
          if e.get('status')!='ACTIVE' or e.get('workflow_id')!=WORKFLOW_ID or e.get('workflow_path')!=str(WORKFLOW_PATH):
              raise SystemExit(f'V5_REGISTRY_CONTRACT_GATE=FAIL source={rp}')

          def choose(label, candidates):
              hits=[Path(x) for x in candidates if Path(x).is_file()]
              if not hits:
                  raise SystemExit(f'V5_SOURCE_PLACEMENT_GATE=FAIL missing={label}')
              hashes={sha(p) for p in hits}
              if len(hashes)>1:
                  raise SystemExit(f'V5_SOURCE_AMBIGUITY_GATE=FAIL {label} hits={[str(x) for x in hits]}')
              root_hits=[p for p in hits if p.parent == Path('.')]
              return root_hits[0] if root_hits else hits[0]

          program_src=choose('program_v4',[
              'q039_implementation_block_intervention_v4.py',
              '.github/workflows/q039_implementation_block_intervention_v4.py',
          ])
          tests_src=choose('tests_v4',[
              'q039_implementation_block_intervention_tests_v4.py',
              '.github/workflows/q039_implementation_block_intervention_tests_v4.py',
          ])
          helper_src=choose('helper_v4',[
              'q039_prepare_frozen_env_v4.sh',
              '.github/workflows/q039_prepare_frozen_env_v4.sh',
          ])
          for required in ['q039_implementation_block_intervention_preregister_v1.json','q039_implementation_block_intervention_source_lock_v1.json']:
              if not Path(required).is_file():
                  raise SystemExit(f'V5_IMMUTABLE_INPUT_GATE=FAIL missing={required}')

          out=Path('q039_runtime_v5'); out.mkdir()
          ptext=program_src.read_text(encoding='utf-8')
          required_program_repls={
              'PROGRAM_ID = "Q039-IMPLBLOCK-V4"':'PROGRAM_ID = "Q039-IMPLBLOCK-V5"',
              'RUN_ID = "Q039-IMPLEMENTATION-BLOCK-INTERVENTION-V4"':'RUN_ID = "Q039-IMPLEMENTATION-BLOCK-INTERVENTION-V5"',
              'TECHNICAL_RECOVERY_VERSION = "V4"':'TECHNICAL_RECOVERY_VERSION = "V5"',
              '"stage": "Q039_RUNTIME_PREFLIGHT_V4"':'"stage": "Q039_RUNTIME_PREFLIGHT_V5"',
          }
          for a,b in required_program_repls.items():
              if a not in ptext: raise SystemExit(f'V5_PROGRAM_PROMOTION_GATE=FAIL missing={a}')
              ptext=ptext.replace(a,b)
          anchor='V3_FAILURE_CLASS = "TECHNICAL_PREFLIGHT_SCHEMA_RESOLUTION_FAILURE_NO_SCIENTIFIC_RESULT"\n'
          if anchor not in ptext: raise SystemExit('V5_V3_PROVENANCE_ANCHOR_GATE=FAIL')
          ptext=ptext.replace(anchor,anchor+
              f'V4_FAILED_LAUNCH_RUN_ID = {V4_FAILED_LAUNCH_RUN_ID}\n'
              f'V4_FAILED_LAUNCH_JOB_ID = {V4_FAILED_LAUNCH_JOB_ID}\n'
              'V4_FAILURE_CLASS = "TECHNICAL_INSTALL_WORKFLOW_NOT_FOUND_NO_SCIENTIFIC_RESULT"\n',1)
          p5=out/'q039_implementation_block_intervention_v5.py'; p5.write_text(ptext,encoding='utf-8')

          ttext=tests_src.read_text(encoding='utf-8')
          for a,b in [
              ('q039_v4_static_module','q039_v5_static_module'),
              ('Q039-IMPLBLOCK-V4','Q039-IMPLBLOCK-V5'),
              ('Q039-IMPLEMENTATION-BLOCK-INTERVENTION-V4','Q039-IMPLEMENTATION-BLOCK-INTERVENTION-V5'),
              ('Q039_STATIC_TESTS_V4','Q039_STATIC_TESTS_V5'),
              ('Q039_RESULT_TESTS_V4','Q039_RESULT_TESTS_V5'),
              ('q039_implementation_block_intervention_v4.py','q039_implementation_block_intervention_v5.py'),
          ]:
              if a not in ttext: raise SystemExit(f'V5_TEST_PROMOTION_GATE=FAIL missing={a}')
              ttext=ttext.replace(a,b)
          t5=out/'q039_implementation_block_intervention_tests_v5.py'; t5.write_text(ttext,encoding='utf-8')

          htext=helper_src.read_text(encoding='utf-8').replace('q039_prepare_frozen_env_v4.sh','q039_prepare_frozen_env_v5.sh')
          h5=out/'q039_prepare_frozen_env_v5.sh'; h5.write_text(htext,encoding='utf-8')

          manifest={
              'q':'Q-039','program_id':PROGRAM_ID,'status':'PASS',
              'stage':'Q039_V5_INSTALL_BOOTSTRAP',
              'workflow_path':str(WORKFLOW_PATH),'registry_source':str(rp),
              'source_program_path':str(program_src),'source_tests_path':str(tests_src),'source_helper_path':str(helper_src),
              'source_program_sha256':sha(program_src),'source_tests_sha256':sha(tests_src),'source_helper_sha256':sha(helper_src),
              'runtime_program_sha256':sha(p5),'runtime_tests_sha256':sha(t5),'runtime_helper_sha256':sha(h5),
              'v4_failed_launcher_run_id':V4_FAILED_LAUNCH_RUN_ID,'v4_failed_launcher_job_id':V4_FAILED_LAUNCH_JOB_ID,
              'v4_failure_class':'WORKFLOW_NOT_INSTALLED_HTTP_404_NO_CHILD_RUN_NO_SCIENTIFIC_RESULT',
              'scientific_change':False,
          }
          (out/'q039_v5_bootstrap_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('Q039_V5_WORKFLOW_PLACEMENT_GATE=PASS')
          print('Q039_V5_REGISTRY_GATE=PASS',rp)
          print('Q039_V5_SOURCE_PLACEMENT_GATE=PASS',program_src,tests_src,helper_src)
          print('Q039_V5_RUNTIME_PROMOTION_GATE=PASS')
          PYBOOT
          python -m py_compile q039_runtime_v5/q039_implementation_block_intervention_v5.py q039_runtime_v5/q039_implementation_block_intervention_tests_v5.py
          echo 'Q039_V5_BOOTSTRAP_COMPILE_GATE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: q039-v5-runtime-bootstrap
          path: q039_runtime_v5/
          if-no-files-found: error

  static:
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download V5 runtime bootstrap
        uses: actions/download-artifact@v4
        with:
          name: q039-v5-runtime-bootstrap
          path: q039_runtime_v5
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: V5 identity and immutable prereg gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.program_id || 'Q039-IMPLBLOCK-V5' }}" = "$PROGRAM_ID"
          test "$CURRENT_Q" = 'Q-039'
          test "$RUN_ID" = 'Q039-IMPLEMENTATION-BLOCK-INTERVENTION-V5'
          test -f q039_implementation_block_intervention_preregister_v1.json
          test -f q039_implementation_block_intervention_source_lock_v1.json
          echo 'Q039_V5_IDENTITY_GATE=PASS'
      - name: Static Q039 V5 regression tests
        run: |
          python -m py_compile q039_runtime_v5/q039_implementation_block_intervention_v5.py q039_runtime_v5/q039_implementation_block_intervention_tests_v5.py
          python q039_runtime_v5/q039_implementation_block_intervention_tests_v5.py static \
            --program q039_runtime_v5/q039_implementation_block_intervention_v5.py \
            --preregister q039_implementation_block_intervention_preregister_v1.json \
            --source-lock q039_implementation_block_intervention_source_lock_v1.json \
            --output q039_static_tests_v5.json
      - uses: actions/upload-artifact@v4
        with:
          name: q039-static-v5
          path: |
            q039_static_tests_v5.json
            q039_implementation_block_intervention_preregister_v1.json
            q039_implementation_block_intervention_source_lock_v1.json
          if-no-files-found: error

  parent_input_gate:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download V5 runtime bootstrap
        uses: actions/download-artifact@v4
        with:
          name: q039-v5-runtime-bootstrap
          path: q039_runtime_v5
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Download all authoritative Q032 refinement endpoints
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          pattern: q032-refine-*
          merge-multiple: true
          path: q032_parent_profiles
      - name: Reproduce locked Q037 geometry from Q032 parents
        run: |
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py validate-parent \
            --parent-dir q032_parent_profiles \
            --output q039_parent_input_gate_v5.json
      - uses: actions/upload-artifact@v4
        with:
          name: q039-parent-input-gate-v5
          path: q039_parent_input_gate_v5.json
          if-no-files-found: error

  environment_gate:
    needs: [static, parent_input_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download V5 runtime bootstrap
        uses: actions/download-artifact@v4
        with:
          name: q039-v5-runtime-bootstrap
          path: q039_runtime_v5
      - name: Create detached frozen Q032 execution worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$Q032_EXECUTION_COMMIT^{commit}"
          git worktree add --detach q032_parent "$Q032_EXECUTION_COMMIT"
          test "$(git -C q032_parent rev-parse HEAD)" = "$Q032_EXECUTION_COMMIT"
      - name: Restore authoritative Q032 scientific environment cache
        id: q032cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
          key: q032-v2-${{ runner.os }}-py311-classede-5a131c91-hillipop-a09ddde3
          fail-on-cache-miss: true
      - name: Require exact authoritative cache hit
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.q032cache.outputs.cache-hit }}' = 'true'
          echo 'Q039_Q032_CACHE_HIT_GATE=PASS'
      - name: Download Q032 sealed exact-support preflight
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-preflight-sealed-v2
          path: q032_preflight
      - name: Download representative CamSpec parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-refine-camspec-m3-s0
          path: q032_parent_profile_camspec
      - name: Download representative HiLLiPoP parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-refine-hillipop-m3-s0
          path: q032_parent_profile_hillipop
      - name: Download Q032 restricted HiLLiPoP precision
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-hillipop-covariance-v2
          path: q032_hlp_cov
      - name: Recreate frozen Q032 runtime from authoritative cache
        shell: bash
        run: bash q039_runtime_v5/q039_prepare_frozen_env_v5.sh both
      - name: Four path runtime preflight without optimizer
        shell: bash
        env:
          COBAYA_PACKAGES_PATH: ${{ github.workspace }}/q032_parent/external/cobaya_packages
        run: |
          set -euo pipefail
          mkdir -p q039_runtime_preflight_v5
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py runtime-preflight \
            --q032-parent-root q032_parent \
            --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-profile-dir q032_parent_profile_camspec \
            --implementation camspec --arm RELATIVE_CALIBRATION_NEUTRAL \
            --mask 3 --seed 0 \
            --output q039_runtime_preflight_v5/camspec_calibration.json
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py runtime-preflight \
            --q032-parent-root q032_parent \
            --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-profile-dir q032_parent_profile_camspec \
            --implementation camspec --arm OFFDIAGONAL_PRECISION_COUPLING_OFF \
            --mask 3 --seed 0 \
            --output q039_runtime_preflight_v5/camspec_precision.json
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py runtime-preflight \
            --q032-parent-root q032_parent \
            --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-profile-dir q032_parent_profile_hillipop \
            --implementation hillipop --arm RELATIVE_CALIBRATION_NEUTRAL \
            --mask 3 --seed 0 \
            --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy \
            --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json \
            --output q039_runtime_preflight_v5/hillipop_calibration.json
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py runtime-preflight \
            --q032-parent-root q032_parent \
            --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-profile-dir q032_parent_profile_hillipop \
            --implementation hillipop --arm OFFDIAGONAL_PRECISION_COUPLING_OFF \
            --mask 3 --seed 0 \
            --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy \
            --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json \
            --output q039_runtime_preflight_v5/hillipop_precision.json
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('q039_runtime_preflight_v5')
          files=sorted(root.glob('*.json'))
          assert len(files)==4,files
          for p in files:
              d=json.loads(p.read_text())
              assert d['status']=='PASS',(p,d)
              assert d['optimizer_started'] is False
              assert d['actual_computed_result'] is False
              assert d['model_initialized_without_optimizer'] is True
              if d['arm'] == 'OFFDIAGONAL_PRECISION_COUPLING_OFF':
                  pr=d['intervention']['precision_runtime_after_model_initialization']
                  assert pr['applied'] is True,(p,pr)
                  assert int(pr['dimension']) > 0,(p,pr)
          (root/'environment_gate.json').write_text(json.dumps({
              'q':'Q-039','program_id':'Q039-IMPLBLOCK-V5','status':'PASS',
              'Q032_AUTHORITATIVE_CACHE_GATE':'PASS',
              'runtime_preflight_count':4,'model_initialization_gate':'PASS','scientific_result':False
          },indent=2,sort_keys=True)+'\n')
          print('Q039_RUNTIME_PREFLIGHT_GATE=PASS count=4')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q039-runtime-preflight-v5
          path: q039_runtime_preflight_v5/*.json
          if-no-files-found: error

  singles:
    needs: [static, parent_input_gate, environment_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        arm: [RELATIVE_CALIBRATION_NEUTRAL, OFFDIAGONAL_PRECISION_COUPLING_OFF]
        implementation: [camspec, hillipop]
        mask: [3, 6, 7]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download V5 runtime bootstrap
        uses: actions/download-artifact@v4
        with:
          name: q039-v5-runtime-bootstrap
          path: q039_runtime_v5
      - name: Create detached frozen Q032 execution worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach q032_parent "$Q032_EXECUTION_COMMIT"
          test "$(git -C q032_parent rev-parse HEAD)" = "$Q032_EXECUTION_COMMIT"
      - name: Restore authoritative Q032 cache only
        id: q032cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
          key: q032-v2-${{ runner.os }}-py311-classede-5a131c91-hillipop-a09ddde3
          fail-on-cache-miss: true
      - name: Exact cache hit gate
        run: test '${{ steps.q032cache.outputs.cache-hit }}' = 'true'
      - name: Download Q032 sealed exact-support preflight
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-preflight-sealed-v2
          path: q032_preflight
      - name: Download exact Q032 parent endpoint
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-refine-${{ matrix.implementation }}-m${{ matrix.mask }}-s${{ matrix.seed }}
          path: q032_parent_profile
      - name: Download Q032 restricted HiLLiPoP precision
        if: matrix.implementation == 'hillipop'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-hillipop-covariance-v2
          path: q032_hlp_cov
      - name: Recreate implementation runtime from authoritative cache
        shell: bash
        run: bash q039_runtime_v5/q039_prepare_frozen_env_v5.sh '${{ matrix.implementation }}'
      - name: Run preregistered Q039 V5 single shard
        shell: bash
        env:
          COBAYA_PACKAGES_PATH: ${{ github.workspace }}/q032_parent/external/cobaya_packages
        run: |
          set -euo pipefail
          mkdir -p q039_single_v5
          args=(
            --q032-parent-root q032_parent
            --preflight q032_preflight/q032_preflight_sealed_v2.json
            --parent-profile-dir q032_parent_profile
            --implementation '${{ matrix.implementation }}'
            --arm '${{ matrix.arm }}'
            --mask '${{ matrix.mask }}'
            --seed '${{ matrix.seed }}'
            --soft-stop-minutes 300
            --output "q039_single_v5/${{ matrix.arm }}_${{ matrix.implementation }}_m${{ matrix.mask }}_s${{ matrix.seed }}.json"
          )
          if [[ '${{ matrix.implementation }}' == 'hillipop' ]]; then
            args+=(
              --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy
              --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json
            )
          fi
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py profile "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q039-v5-single-${{ matrix.arm }}-${{ matrix.implementation }}-m${{ matrix.mask }}-s${{ matrix.seed }}
          path: q039_single_v5/*.json
          if-no-files-found: warn

  assess_singles:
    needs: singles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      run_coupled: ${{ steps.assess.outputs.run_coupled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download V5 runtime bootstrap
        uses: actions/download-artifact@v4
        with:
          name: q039-v5-runtime-bootstrap
          path: q039_runtime_v5
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: q039-v5-single-*
          merge-multiple: true
          path: q039_single_all_v5
      - id: assess
        shell: bash
        run: |
          set -euo pipefail
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py assess-singles \
            --input-dir q039_single_all_v5 \
            --output q039_single_block_assessment_v5.json | tee q039_assess_v5.log
          coupled=$(grep '^RUN_COUPLED=' q039_assess_v5.log | tail -1 | cut -d= -f2-)
          test "$coupled" = 'true' -o "$coupled" = 'false'
          echo "run_coupled=$coupled" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: q039-single-assessment-v5
          path: |
            q039_single_block_assessment_v5.json
            q039_assess_v5.log
          if-no-files-found: error

  coupled:
    needs: assess_singles
    if: needs.assess_singles.outputs.run_coupled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        implementation: [camspec, hillipop]
        mask: [3, 6, 7]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download V5 runtime bootstrap
        uses: actions/download-artifact@v4
        with:
          name: q039-v5-runtime-bootstrap
          path: q039_runtime_v5
      - name: Create detached frozen Q032 execution worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach q032_parent "$Q032_EXECUTION_COMMIT"
          test "$(git -C q032_parent rev-parse HEAD)" = "$Q032_EXECUTION_COMMIT"
      - name: Restore authoritative Q032 cache only
        id: q032cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
          key: q032-v2-${{ runner.os }}-py311-classede-5a131c91-hillipop-a09ddde3
          fail-on-cache-miss: true
      - name: Exact cache hit gate
        run: test '${{ steps.q032cache.outputs.cache-hit }}' = 'true'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-preflight-sealed-v2
          path: q032_preflight
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-refine-${{ matrix.implementation }}-m${{ matrix.mask }}-s${{ matrix.seed }}
          path: q032_parent_profile
      - name: Download Q032 restricted HiLLiPoP precision
        if: matrix.implementation == 'hillipop'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-hillipop-covariance-v2
          path: q032_hlp_cov
      - name: Recreate implementation runtime from authoritative cache
        shell: bash
        run: bash q039_runtime_v5/q039_prepare_frozen_env_v5.sh '${{ matrix.implementation }}'
      - name: Run conditional coupled Q039 V5 shard
        shell: bash
        env:
          COBAYA_PACKAGES_PATH: ${{ github.workspace }}/q032_parent/external/cobaya_packages
        run: |
          set -euo pipefail
          mkdir -p q039_coupled_v5
          args=(
            --q032-parent-root q032_parent
            --preflight q032_preflight/q032_preflight_sealed_v2.json
            --parent-profile-dir q032_parent_profile
            --implementation '${{ matrix.implementation }}'
            --arm CALIBRATION_PLUS_PRECISION
            --mask '${{ matrix.mask }}'
            --seed '${{ matrix.seed }}'
            --soft-stop-minutes 300
            --output "q039_coupled_v5/CALIBRATION_PLUS_PRECISION_${{ matrix.implementation }}_m${{ matrix.mask }}_s${{ matrix.seed }}.json"
          )
          if [[ '${{ matrix.implementation }}' == 'hillipop' ]]; then
            args+=(
              --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy
              --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json
            )
          fi
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py profile "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q039-v5-coupled-${{ matrix.implementation }}-m${{ matrix.mask }}-s${{ matrix.seed }}
          path: q039_coupled_v5/*.json
          if-no-files-found: warn

  final:
    needs: [assess_singles, coupled]
    if: >-
      always() &&
      needs.assess_singles.result == 'success' &&
      (needs.coupled.result == 'success' || needs.coupled.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download V5 runtime bootstrap
        uses: actions/download-artifact@v4
        with:
          name: q039-v5-runtime-bootstrap
          path: q039_runtime_v5
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: q039-single-assessment-v5
          path: q039_assessment_v5
      - name: Download coupled shards if required
        if: needs.coupled.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: q039-v5-coupled-*
          merge-multiple: true
          path: q039_coupled_all_v5
      - name: Build provisional terminal classification
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --single-assessment q039_assessment_v5/q039_single_block_assessment_v5.json
            --output q039_provisional_final_v5.json
          )
          if [[ -d q039_coupled_all_v5 ]]; then args+=(--coupled-dir q039_coupled_all_v5); fi
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py final "${args[@]}"
      - name: Mandatory V5 result tests
        run: |
          python q039_runtime_v5/q039_implementation_block_intervention_tests_v5.py result \
            --final q039_provisional_final_v5.json \
            --output q039_result_tests_v5.json
      - name: Seal final result only after result tests pass
        run: |
          python q039_runtime_v5/q039_implementation_block_intervention_v5.py seal \
            --provisional q039_provisional_final_v5.json \
            --tests q039_result_tests_v5.json \
            --output q039_final_v5.json \
            --handoff q039_return_handoff_v5.json
      - name: Write V5 run manifest
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          d={
            'q':'Q-039',
            'program_id':'Q039-IMPLBLOCK-V5',
            'run_id':'Q039-IMPLEMENTATION-BLOCK-INTERVENTION-V5',
            'result_id':'R-Q039-EDE-IMPLEMENTATION-BLOCK-INTERVENTION-001',
            'scientific_preregister_program_id':'Q039-IMPLBLOCK-V1',
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'github_sha':os.environ.get('GITHUB_SHA'),
            'q032_parent_run':33994305721,
            'q032_parent_commit':'4dc873a5e880d40858d831a3b421456728f0c032',
            'q032_authoritative_cache_key':'q032-v2-Linux-py311-classede-5a131c91-hillipop-a09ddde3',
            'technical_recovery_from_runs':[34127882243,34130274459,34140566884,34141873450],
            'v2_failure_classes':['Q032_CONFIG_DOUBLE_PARENT_PATH','HILLIPOP_NERSC_PER_SHARD_DOWNLOAD_TIMEOUT'],
            'v3_failure_class':'CAMSPEC_RAW_INFO_COMPONENT_DEFAULT_RESOLUTION_PREFLIGHT',
            'v4_failure_class':'WORKFLOW_NOT_INSTALLED_LAUNCHER_HTTP_404_NO_CHILD_RUN',
            'v4_failed_launcher_job_id':101805432562,
            'single_optimizer_jobs':36,
            'coupled_optimizer_jobs_executed':18 if '${{ needs.coupled.result }}'=='success' else 0,
            'status':'COMPLETE'
          }
          open('q039_run_manifest_v5.json','w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q039-final-v5
          path: |
            q039_provisional_final_v5.json
            q039_result_tests_v5.json
            q039_final_v5.json
            q039_return_handoff_v5.json
            q039_run_manifest_v5.json
            q039_implementation_block_intervention_preregister_v1.json
            q039_implementation_block_intervention_source_lock_v1.json
          if-no-files-found: error
