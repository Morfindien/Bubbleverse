  rqmc_m16:
    needs: plan_m16
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan_m16.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Create detached frozen Q032 worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$Q032_EXECUTION_COMMIT^{commit}"
          git worktree add --detach q032_parent "$Q032_EXECUTION_COMMIT"
          test "$(git -C q032_parent rev-parse HEAD)" = "$Q032_EXECUTION_COMMIT"
      - name: Restore exact authoritative Q032 cache
        id: q032cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
          key: q032-v2-${{ runner.os }}-py311-classede-5a131c91-hillipop-a09ddde3
          fail-on-cache-miss: true
      - name: Require exact cache hit
        run: test '${{ steps.q032cache.outputs.cache-hit }}' = 'true'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          pattern: q032-refine-*
          merge-multiple: true
          path: q032_parent_profiles
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-preflight-sealed-v2
          path: q032_preflight
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-hillipop-covariance-v2
          path: q032_hlp_cov
      - name: Recreate frozen Q032 runtime
        shell: bash
        run: bash q039_prepare_frozen_env_v4.sh '${{ matrix.implementation }}'
      - id: q040dl028_a1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
      - if: steps.q040dl028_a1.outcome != 'success'
        shell: bash
        run: |
          rm -rf "q040_prepare"
          sleep 5
      - id: q040dl028_a2
        if: steps.q040dl028_a1.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
      - if: steps.q040dl028_a1.outcome != 'success' && steps.q040dl028_a2.outcome != 'success'
        shell: bash
        run: |
          rm -rf "q040_prepare"
          sleep 15
      - id: q040dl028_a3
        if: steps.q040dl028_a1.outcome != 'success' && steps.q040dl028_a2.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
      - name: Same-run artifact transport gate q040dl028
        if: always()
        shell: bash
        env:
          A1: ${{ steps.q040dl028_a1.outcome }}
          A2: ${{ steps.q040dl028_a2.outcome }}
          A3: ${{ steps.q040dl028_a3.outcome }}
        run: |
          set -euo pipefail
          if [[ "$A1" != success && "$A2" != success && "$A3" != success ]]; then
            echo "Q040_SAME_RUN_ARTIFACT_TRANSPORT_GATE=FAIL dependency=q040dl028" >&2
            exit 1
          fi
          test -d "q040_prepare"
          if ! find "q040_prepare" -mindepth 1 -print -quit | grep -q .; then
            echo "Q040_SAME_RUN_ARTIFACT_CONTENT_GATE=FAIL path=q040_prepare" >&2
            exit 1
          fi
          echo "Q040_SAME_RUN_ARTIFACT_TRANSPORT_GATE=PASS dependency=q040dl028"
      - name: Run atomic RQMC shell shard m=16
        shell: bash
        env:
          COBAYA_PACKAGES_PATH: ${{ github.workspace }}/q032_parent/external/cobaya_packages
        run: |
          set -euo pipefail
          mkdir -p q040_shard
          python q040_defensive_rqmc_v4.py rqmc-shard \
            --q032-parent-root q032_parent \
            --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-dir q032_parent_profiles \
            --preregister q040_defensive_rqmc_preregister_v4.json \
            --source-lock q040_defensive_rqmc_source_lock_v4.json \
            --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy \
            --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json \
            --prepare-meta q040_prepare/q040_rqmc_prepare_v4.json \
            --prepare-dir q040_prepare \
            --implementation '${{ matrix.implementation }}' \
            --m 16 --shard '${{ matrix.shard }}' --shard-count '${{ matrix.shard_count }}' \
            --soft-stop-minutes 300 --scratch q040_rqmc_runtime \
            --output 'q040_shard/rqmc_m16_${{ matrix.implementation }}_${{ matrix.shard }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q040-rqmc-m16-${{ matrix.implementation }}-${{ matrix.shard }}
          path: q040_shard/*.json
          if-no-files-found: warn

