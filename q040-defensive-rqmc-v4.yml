    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      selected_m: ${{ steps.gate.outputs.selected_m }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - name: Reject incomplete execution chain as technical, never numerical science failure
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY3'
          import json, os
          d=json.loads(os.environ['NEEDS_JSON'])
          bad={k:v.get('result') for k,v in d.items() if v.get('result') in ('failure','cancelled')}
          if bad:
              raise SystemExit('RQMC_UPSTREAM_EXECUTION_GATE=FAIL '+json.dumps(bad,sort_keys=True))
          print('RQMC_UPSTREAM_EXECUTION_GATE=PASS')
          PY3
