name: Bubbleverse Q040 Defensive RQMC CMB Marginal V4

on:
  workflow_dispatch:
    inputs:
      program_id:
        description: Registered Bubbleverse PROGRAM_ID
        required: false
        default: Q040-RQMC-V4
        type: string

permissions:
  contents: read
  actions: read

env:
  CURRENT_Q: Q-040
  PROGRAM_ID: Q040-RQMC-V4
  RUN_ID: Q040-DEFENSIVE-RQMC-CMB-MARGINAL-V4
  RESULT_ID: R-Q040-EDE-DEFENSIVE-RQMC-CMB-MARGINAL-004
  Q032_GITHUB_RUN_ID: '33994305721'
  Q032_EXECUTION_COMMIT: 4dc873a5e880d40858d831a3b421456728f0c032
  Q032_SUPPORT_HASH: f6d7b3195789e7149942c63543bdd8e9a44490ea3f3645fb964e936ec69cca2b
  V4_GITHUB_RUN_ID: '34211073134'

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Identity, registry and launcher gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.program_id || 'Q040-RQMC-V4' }}" = "$PROGRAM_ID"
          test "$CURRENT_Q" = 'Q-040'
          test -f q040_defensive_rqmc_v4.py
          test -f q040_defensive_rqmc_tests_v4.py
          test -f q040_defensive_rqmc_preregister_v4.json
          test -f q040_defensive_rqmc_source_lock_v4.json
          test -f q040_cmbspace_coupled_bridge_v2.py
          test -f q039_prepare_frozen_env_v4.sh
          test -f .github/workflows/q040-defensive-rqmc-v4.yml
          test -f .github/workflows/00-bubbleverse-start.yml
          test -f .github/workflows/00-bubbleverse-start-segmented-v5.yml
          python - <<'PY2'
          import json
          from pathlib import Path
          d=json.loads(Path('bubbleverse_program_registry.json').read_text())
          e=d.get('programs',{}).get('Q040-RQMC-V4')
          assert e and e.get('status')=='ACTIVE',e
          assert e.get('q')=='Q-040',e
          assert e.get('workflow_id')=='q040-defensive-rqmc-v4.yml',e
          assert e.get('workflow_path')=='.github/workflows/q040-defensive-rqmc-v4.yml',e
          launcher=Path('.github/workflows/00-bubbleverse-start.yml').read_text()
          segmented=Path('.github/workflows/00-bubbleverse-start-segmented-v5.yml').read_text()
          assert 'exact registry match not found' in launcher
          assert 'gh workflow run "$WORKFLOW_ID"' in launcher
          assert 'eval' not in launcher.lower()
          assert 'exact registry match not found' in segmented
          assert 'expected_artifacts_json' in segmented
          assert 'gh workflow run "$WORKFLOW_ID"' in segmented
          assert e.get('result_artifacts') == ['q040-rqmc-final-v4'], e
          print('Q040_RQMC_REGISTRY_LAUNCHER_GATE=PASS')
          PY2
      - name: Install static dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - name: Static scientific and numerical tests
        run: |
          python -m py_compile q040_defensive_rqmc_v4.py q040_defensive_rqmc_tests_v4.py
          python q040_defensive_rqmc_tests_v4.py static \
            --program q040_defensive_rqmc_v4.py \
            --preregister q040_defensive_rqmc_preregister_v4.json \
            --source-lock q040_defensive_rqmc_source_lock_v4.json \
            --workflow .github/workflows/q040-defensive-rqmc-v4.yml \
            --output q040_rqmc_static_tests_v4.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-static-v4
          path: |
            q040_rqmc_static_tests_v4.json
            q040_defensive_rqmc_preregister_v4.json
            q040_defensive_rqmc_source_lock_v4.json
          if-no-files-found: error

  parent_input_gate:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          pattern: q032-refine-*
          merge-multiple: true
          path: q032_parent_profiles
      - name: Reproduce frozen Q037 baseline
        run: python q040_defensive_rqmc_v4.py validate-parent --parent-dir q032_parent_profiles --output q040_rqmc_parent_gate_v4.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-parent-v4
          path: q040_rqmc_parent_gate_v4.json
          if-no-files-found: error

  environment_gate:
    needs: [static, parent_input_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Create detached frozen Q032 worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$Q032_EXECUTION_COMMIT^{commit}"
          git worktree add --detach q032_parent "$Q032_EXECUTION_COMMIT"
          test "$(git -C q032_parent rev-parse HEAD)" = "$Q032_EXECUTION_COMMIT"
      - name: Restore exact authoritative Q032 cache
        id: q032cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
          key: q032-v2-${{ runner.os }}-py311-classede-5a131c91-hillipop-a09ddde3
          fail-on-cache-miss: true
      - name: Require exact cache hit
        run: test '${{ steps.q032cache.outputs.cache-hit }}' = 'true'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          pattern: q032-refine-*
          merge-multiple: true
          path: q032_parent_profiles
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-preflight-sealed-v2
          path: q032_preflight
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-hillipop-covariance-v2
          path: q032_hlp_cov
      - name: Recreate frozen Q032 runtime
        shell: bash
        run: bash q039_prepare_frozen_env_v4.sh 'both'
      - name: Verify authoritative frozen Q032 artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f q032_preflight/q032_preflight_sealed_v2.json
          test -f q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy
          test -f q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json
          python - <<'PY2'
          import json
          p=json.load(open('q032_preflight/q032_preflight_sealed_v2.json'))
          assert p['q']=='Q-032' and p['status']=='PASS'
          assert p['support_sha256']=='f6d7b3195789e7149942c63543bdd8e9a44490ea3f3645fb964e936ec69cca2b'
          m=json.load(open('q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json'))
          assert m['status']=='PASS' and m['restricted_precision_sha256']
          print('Q040_RQMC_ENVIRONMENT_GATE=PASS')
          PY2

  prepare:
    needs: environment_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Create detached frozen Q032 worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$Q032_EXECUTION_COMMIT^{commit}"
          git worktree add --detach q032_parent "$Q032_EXECUTION_COMMIT"
          test "$(git -C q032_parent rev-parse HEAD)" = "$Q032_EXECUTION_COMMIT"
      - name: Restore exact authoritative Q032 cache
        id: q032cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
          key: q032-v2-${{ runner.os }}-py311-classede-5a131c91-hillipop-a09ddde3
          fail-on-cache-miss: true
      - name: Require exact cache hit
        run: test '${{ steps.q032cache.outputs.cache-hit }}' = 'true'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          pattern: q032-refine-*
          merge-multiple: true
          path: q032_parent_profiles
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-preflight-sealed-v2
          path: q032_preflight
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-hillipop-covariance-v2
          path: q032_hlp_cov
      - name: Recreate frozen Q032 runtime
        shell: bash
        run: bash q039_prepare_frozen_env_v4.sh 'both'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V4_GITHUB_RUN_ID }}
          pattern: q040-map-*
          merge-multiple: true
          path: q040_v4_maps
      - name: Build frozen probes, V4 proposal centers and calibration basis
        shell: bash
        env:
          COBAYA_PACKAGES_PATH: ${{ github.workspace }}/q032_parent/external/cobaya_packages
        run: |
          set -euo pipefail
          mkdir -p q040_prepare
          python q040_defensive_rqmc_v4.py prepare \
            --q032-parent-root q032_parent \
            --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-dir q032_parent_profiles \
            --preregister q040_defensive_rqmc_preregister_v4.json \
            --source-lock q040_defensive_rqmc_source_lock_v4.json \
            --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy \
            --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json \
            --v4-map-dir q040_v4_maps \
            --scratch q040_rqmc_runtime \
            --output-dir q040_prepare \
            --output q040_prepare/q040_rqmc_prepare_v4.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
          if-no-files-found: error

  plan_m9:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - id: plan
        run: python q040_defensive_rqmc_v4.py plan-level --m 9 --output q040_rqmc_plan_m9_v4.json

  rqmc_m9:
    needs: plan_m9
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan_m9.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Create detached frozen Q032 worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$Q032_EXECUTION_COMMIT^{commit}"
          git worktree add --detach q032_parent "$Q032_EXECUTION_COMMIT"
          test "$(git -C q032_parent rev-parse HEAD)" = "$Q032_EXECUTION_COMMIT"
      - name: Restore exact authoritative Q032 cache
        id: q032cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
          key: q032-v2-${{ runner.os }}-py311-classede-5a131c91-hillipop-a09ddde3
          fail-on-cache-miss: true
      - name: Require exact cache hit
        run: test '${{ steps.q032cache.outputs.cache-hit }}' = 'true'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          pattern: q032-refine-*
          merge-multiple: true
          path: q032_parent_profiles
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-preflight-sealed-v2
          path: q032_preflight
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-hillipop-covariance-v2
          path: q032_hlp_cov
      - name: Recreate frozen Q032 runtime
        shell: bash
        run: bash q039_prepare_frozen_env_v4.sh '${{ matrix.implementation }}'
      - id: q040dl001_a1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
      - if: steps.q040dl001_a1.outcome != 'success'
        shell: bash
        run: |
          rm -rf "q040_prepare"
          sleep 5
      - id: q040dl001_a2
        if: steps.q040dl001_a1.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
      - if: steps.q040dl001_a1.outcome != 'success' && steps.q040dl001_a2.outcome != 'success'
        shell: bash
        run: |
          rm -rf "q040_prepare"
          sleep 15
      - id: q040dl001_a3
        if: steps.q040dl001_a1.outcome != 'success' && steps.q040dl001_a2.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
      - name: Same-run artifact transport gate q040dl001
        if: always()
        shell: bash
        env:
          A1: ${{ steps.q040dl001_a1.outcome }}
          A2: ${{ steps.q040dl001_a2.outcome }}
          A3: ${{ steps.q040dl001_a3.outcome }}
        run: |
          set -euo pipefail
          if [[ "$A1" != success && "$A2" != success && "$A3" != success ]]; then
            echo "Q040_SAME_RUN_ARTIFACT_TRANSPORT_GATE=FAIL dependency=q040dl001" >&2
            exit 1
          fi
          test -d "q040_prepare"
          if ! find "q040_prepare" -mindepth 1 -print -quit | grep -q .; then
            echo "Q040_SAME_RUN_ARTIFACT_CONTENT_GATE=FAIL path=q040_prepare" >&2
            exit 1
          fi
          echo "Q040_SAME_RUN_ARTIFACT_TRANSPORT_GATE=PASS dependency=q040dl001"
      - name: Run atomic RQMC shell shard m=9
        shell: bash
        env:
          COBAYA_PACKAGES_PATH: ${{ github.workspace }}/q032_parent/external/cobaya_packages
        run: |
          set -euo pipefail
          mkdir -p q040_shard
          python q040_defensive_rqmc_v4.py rqmc-shard \
            --q032-parent-root q032_parent \
            --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-dir q032_parent_profiles \
            --preregister q040_defensive_rqmc_preregister_v4.json \
            --source-lock q040_defensive_rqmc_source_lock_v4.json \
            --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy \
            --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json \
            --prepare-meta q040_prepare/q040_rqmc_prepare_v4.json \
            --prepare-dir q040_prepare \
            --implementation '${{ matrix.implementation }}' \
            --m 9 --shard '${{ matrix.shard }}' --shard-count '${{ matrix.shard_count }}' \
            --soft-stop-minutes 300 --scratch q040_rqmc_runtime \
            --output 'q040_shard/rqmc_m9_${{ matrix.implementation }}_${{ matrix.shard }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q040-rqmc-m9-${{ matrix.implementation }}-${{ matrix.shard }}
          path: q040_shard/*.json
          if-no-files-found: warn

  merge_m9:
    needs: rqmc_m9
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      converged: ${{ steps.merge.outputs.converged }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - id: q040dl002_a1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: q040-rqmc-m9-*
          merge-multiple: true
          path: q040_shards
      - if: steps.q040dl002_a1.outcome != 'success'
        shell: bash
        run: |
          rm -rf "q040_shards"
          sleep 5
      - id: q040dl002_a2
        if: steps.q040dl002_a1.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: q040-rqmc-m9-*
          merge-multiple: true
          path: q040_shards
      - if: steps.q040dl002_a1.outcome != 'success' && steps.q040dl002_a2.outcome != 'success'
        shell: bash
        run: |
          rm -rf "q040_shards"
          sleep 15
      - id: q040dl002_a3
        if: steps.q040dl002_a1.outcome != 'success' && steps.q040dl002_a2.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: q040-rqmc-m9-*
          merge-multiple: true
          path: q040_shards
      - name: Same-run artifact transport gate q040dl002
        if: always()
        shell: bash
        env:
          A1: ${{ steps.q040dl002_a1.outcome }}
          A2: ${{ steps.q040dl002_a2.outcome }}
          A3: ${{ steps.q040dl002_a3.outcome }}
        run: |
          set -euo pipefail
          if [[ "$A1" != success && "$A2" != success && "$A3" != success ]]; then
            echo "Q040_SAME_RUN_ARTIFACT_TRANSPORT_GATE=FAIL dependency=q040dl002" >&2
            exit 1
          fi
          test -d "q040_shards"
          if ! find "q040_shards" -mindepth 1 -print -quit | grep -q .; then
            echo "Q040_SAME_RUN_ARTIFACT_CONTENT_GATE=FAIL path=q040_shards" >&2
            exit 1
          fi
          echo "Q040_SAME_RUN_ARTIFACT_TRANSPORT_GATE=PASS dependency=q040dl002"
      - id: q040dl003_a1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
      - if: steps.q040dl003_a1.outcome != 'success'
        shell: bash
        run: |
          rm -rf "q040_prepare"
          sleep 5
      - id: q040dl003_a2
        if: steps.q040dl003_a1.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
      - if: steps.q040dl003_a1.outcome != 'success' && steps.q040dl003_a2.outcome != 'success'
        shell: bash
        run: |
          rm -rf "q040_prepare"
          sleep 15
      - id: q040dl003_a3
        if: steps.q040dl003_a1.outcome != 'success' && steps.q040dl003_a2.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-prepare-v4
          path: q040_prepare
      - name: Same-run artifact transport gate q040dl003
        if: always()
        shell: bash
        env:
          A1: ${{ steps.q040dl003_a1.outcome }}
          A2: ${{ steps.q040dl003_a2.outcome }}
          A3: ${{ steps.q040dl003_a3.outcome }}
        run: |
          set -euo pipefail
          if [[ "$A1" != success && "$A2" != success && "$A3" != success ]]; then
            echo "Q040_SAME_RUN_ARTIFACT_TRANSPORT_GATE=FAIL dependency=q040dl003" >&2
            exit 1
          fi
          test -d "q040_prepare"
          if ! find "q040_prepare" -mindepth 1 -print -quit | grep -q .; then
            echo "Q040_SAME_RUN_ARTIFACT_CONTENT_GATE=FAIL path=q040_prepare" >&2
            exit 1
          fi
          echo "Q040_SAME_RUN_ARTIFACT_TRANSPORT_GATE=PASS dependency=q040dl003"
      - id: merge
        name: Merge cumulative RQMC state m=9
        run: >-
          python q040_defensive_rqmc_v4.py merge-level --m 9 --shard-dir q040_shards
          --prepare-meta q040_prepare/q040_rqmc_prepare_v4.json --prepare-dir q040_prepare
          --output q040_rqmc_state_m9_v4.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-state-m9-v4
          path: q040_rqmc_state_m9_v4.json
          if-no-files-found: error

  plan_m10:
    needs: merge_m9
    if: needs.merge_m9.outputs.converged != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - id: plan
        run: python q040_defensive_rqmc_v4.py plan-level --m 10 --output q040_rqmc_plan_m10_v4.json

  rqmc_m10:
    needs: plan_m10
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan_m10.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Create detached frozen Q032 worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$Q032_EXECUTION_COMMIT^{commit}"
          git worktree add --detach q032_parent "$Q032_EXECUTION_COMMIT"
          test "$(git -C q032_parent rev-parse HEAD)" = "$Q032_EXECUTION_COMMIT"
      - name: Restore exact authoritative Q032 cache
        id: q032cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
