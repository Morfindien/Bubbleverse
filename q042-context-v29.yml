name: Bubbleverse Q042 V29 — original context and interval prerequisite
'on':
  workflow_dispatch:
    inputs:
      program_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: q042-context-v29
  cancel-in-progress: false
env:
  CURRENT_Q: Q-042
  PROGRAM_ID: Q042-CONTEXT-V29
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Exact registered ID and package gates
        env:
          REQUESTED_PROGRAM_ID: ${{ inputs.program_id }}
        run: |
          set -euo pipefail
          test "$REQUESTED_PROGRAM_ID" = "$PROGRAM_ID"
          python q042_context_v29.py static
          python -m unittest discover -s . -p 'q042_interval_tests_v29.py' -v
  capture-and-qualify:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Preserve expected-job record before cache restore
        run: |
          python - <<'PY'
          import q042_context_v29 as m
          m.write('context_v29/job_manifest.json',dict(**m.base(),expected_jobs=['capture_and_qualify'],completed_jobs=[],pending_jobs=['capture_and_qualify'],failed_jobs=[],status='CACHE_PENDING'))
          PY
      - name: Original cache only; no rebuild and no cache save
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
            external/act_dr6_cmbonly
            external/act_dr6_lenslike
            external/cobaya_desi_dr2_source
            external/bao_data_v2_6
            external/PolyChordLite
          key: q042-prod-v1-${{ runner.os }}-py311-cobaya356-q032-4dc873a-pc1222-pybobyqa150-pantheonplus
          fail-on-cache-miss: true
      - name: One original initialization; finite interval checks; no history
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: python q042_context_v29.py run --out context_v29
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q042-v29-${{ github.run_id }}-context-and-checks
          path: context_v29/**
          if-no-files-found: error
          retention-days: 30
  collect:
    needs: [static, capture-and-qualify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: q042-v29-${{ github.run_id }}-context-and-checks
          path: collected
      - name: Complete prerequisite or explicit failure; never a science pass
        run: python q042_context_v29.py collect --directory collected --out q042_context_final_v29.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q042-v29-${{ github.run_id }}-final
          path: |
            q042_context_final_v29.json
            q042_context_contract_v29.json
            q042_context_manifest_v29.json
            q042_context_full_handoff_v29.md
          if-no-files-found: error
          retention-days: 30
