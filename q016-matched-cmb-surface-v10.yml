name: Bubbleverse Q016 Matched CMB Surface V10

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: q016-matched-cmb-surface-v10-${{ github.ref }}
  cancel-in-progress: false

env:
  CURRENT_Q: Q016
  RUN_ID: Q016-MATCHED-CMB-SURFACE-V10
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Git-blob reuse gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:q014_external_viability_v10.py)" = "9085bdea8e5732b5e4c7095068d284918157948d"
          test "$(git hash-object q014_external_viability_v10.py)" = "9085bdea8e5732b5e4c7095068d284918157948d"
          test "$(git rev-parse HEAD:q014_external_viability_v12.py)" = "d2c8ba19aed63d8e1b17a0ef4e18e2dd6981a599"
          test "$(git hash-object q014_external_viability_v12.py)" = "d2c8ba19aed63d8e1b17a0ef4e18e2dd6981a599"
          echo "Q016_V10_Q014_REUSE_BLOB_GATE=PASS"
      - name: Static V10 tests
        run: |
          set -euo pipefail
          bash -n q016_setup_v10.sh
          bash -n q016_act_asset_v10.sh
          python -m py_compile q016_objective_reprofile_v10.py q016_aggregate_v10.py q016_tests_v10.py
          python q016_tests_v10.py static --output q016_static_tests_v10.json
      - name: Cobaya exact-objective runtime toy test
        run: python q016_tests_v10.py runtime --output q016_runtime_objective_test_v10.json
      - name: Verify V6 numerical seed parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33732688762" > /tmp/q016_v6_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33732688762/artifacts?per_page=100" > /tmp/q016_v6_artifacts.json
          mkdir -p q016_parent_v6
          gh run download "33732688762" --name q016-primary-merged-v6 --dir q016_parent_v6
          python - <<'PY'
          import json
          run=json.load(open('/tmp/q016_v6_run.json'))
          assert run['head_sha']=='d14880138ebb537173e49417b537a68454d53602'
          arts=json.load(open('/tmp/q016_v6_artifacts.json'))['artifacts']
          a=[x for x in arts if x['name']=='q016-primary-merged-v6']
          assert len(a)==1 and int(a[0]['id'])==9888806606
          assert a[0]['digest']=='sha256:6fb8ff7693c955516bf3a1a0e0c066876aa39c1f377d720b8b7bf6ed8a0f6aab'
          print('Q016_V10_V6_SEED_PARENT_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: q016-v10-prepare
          path: |
            q016_static_tests_v10.json
            q016_runtime_objective_test_v10.json
            q016_v6_objective_seed_lock_v10.json
            q016_v9_phase1_parent_lock_v10.json
          retention-days: 30

  import_v9_phase1:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - name: Verify V9 run and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33749345635" > /tmp/q016_v9_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33749345635/artifacts?per_page=100" > /tmp/q016_v9_artifacts.json
          python - <<'PY'
          import json
          lock=json.load(open('q016_v9_phase1_parent_lock_v10.json'))
          run=json.load(open('/tmp/q016_v9_run.json'))
          assert int(run['id'])==33749345635
          assert run['head_sha']=='35fa2038456e8c2e40885b37d5ea27e595eac4b2'
          assert run['name']=='Bubbleverse Q016 Matched CMB Surface V9'
          assert run['conclusion']=='failure'
          arts={x['name']:x for x in json.load(open('/tmp/q016_v9_artifacts.json'))['artifacts']}
          expected=lock['artifacts']
          assert len(expected)==12
          for e in expected:
              a=arts[e['name']]
              assert not a['expired']
              assert int(a['id'])==int(e['id'])
              assert a['digest']==e['digest']
              assert a['workflow_run']['id']==33749345635
              assert a['workflow_run']['head_sha']=='35fa2038456e8c2e40885b37d5ea27e595eac4b2'
          print('Q016_V10_V9_PHASE1_ARTIFACT_PROVENANCE_GATE=PASS')
          PY
      - name: Download authoritative V9 Phase-1 artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: q016-v9-p1-*
          path: q016_v9_phase1_parent
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33749345635
      - name: Recover and validate V9 fixed profiles
        shell: bash
        run: |
          set -euo pipefail
          test "$(find q016_v9_phase1_parent -type f -name '*_fixed_h0_71p5_*.json' | wc -l)" -eq 12
          python q016_aggregate_v10.py fixed-summary \
            --input-dir q016_v9_phase1_parent \
            --output q016_phase1_fixed_summary_v10.json
      - uses: actions/upload-artifact@v5
        with:
          name: q016-v10-phase1-fixed-summary
          path: |
            q016_phase1_fixed_summary_v10.json
            q016_v9_phase1_parent_lock_v10.json
          if-no-files-found: error
          retention-days: 30

  act_assets:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: bash q016_act_asset_v10.sh q016_act_asset_v10
      - uses: actions/upload-artifact@v5
        with:
          name: q016-v10-act-dr6-data
          path: q016_act_asset_v10
          if-no-files-found: error
          retention-days: 30

  phase2:
    needs: [import_v9_phase1, act_assets]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {branch: planck, family: phase1_fixed_embed, restart: 10}
          - {branch: planck, family: phase1_fixed_embed_jitter_plus, restart: 11}
          - {branch: planck, family: phase1_fixed_embed_jitter_minus, restart: 12}
          - {branch: planck, family: parent_free_best, restart: 13}
          - {branch: spt, family: phase1_fixed_embed, restart: 10}
          - {branch: spt, family: phase1_fixed_embed_jitter_plus, restart: 11}
          - {branch: spt, family: phase1_fixed_embed_jitter_minus, restart: 12}
          - {branch: spt, family: parent_free_best, restart: 13}
          - {branch: act, family: phase1_fixed_embed, restart: 10}
          - {branch: act, family: phase1_fixed_embed_jitter_plus, restart: 11}
          - {branch: act, family: phase1_fixed_embed_jitter_minus, restart: 12}
          - {branch: act, family: parent_free_best, restart: 13}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: q016-v10-phase1-fixed-summary
          path: q016_phase1_context
      - uses: actions/download-artifact@v5
        if: ${{ matrix.branch == 'act' }}
        with:
          name: q016-v10-act-dr6-data
          path: q016_act_asset_download
      - name: Preseed ACT data
        if: ${{ matrix.branch == 'act' }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find q016_act_asset_download -type f -name dr6_data_cmbonly.fits -print -quit)"
          test -n "$SRC"
          DST="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0/dr6_data_cmbonly.fits"
          mkdir -p "$(dirname "$DST")"; cp "$SRC" "$DST"
      - name: Build branch environment
        run: bash q016_setup_v10.sh "${{ matrix.branch }}"
      - name: Run exact-objective free profile
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q016_v10_phase2
          OUT="q016_v10_phase2/${{ matrix.branch }}_reference_free_h0_${{ matrix.family }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 315m python q016_objective_reprofile_v10.py \
            --branch "${{ matrix.branch }}" --mode reference_free_h0 \
            --start-family "${{ matrix.family }}" --restart "${{ matrix.restart }}" \
            --phase1-summary q016_phase1_context/q016_phase1_fixed_summary_v10.json \
            --output "$OUT"
          RC=$?
          set -e
          exit "$RC"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-v10-p2-${{ matrix.branch }}-${{ matrix.family }}
          path: |
            q016_v10_phase2/*.json
            q016_v10_source_runtime/*.json
          if-no-files-found: warn
          retention-days: 30

  merge_primary:
    needs: [import_v9_phase1, phase2]
    if: ${{ always() && needs.import_v9_phase1.result == 'success' && needs.phase2.result != 'skipped' && needs.phase2.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v5
        with:
          name: q016-v10-phase1-fixed-summary
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: q016-v10-p2-*
          path: q016_v10_phase2_all
          merge-multiple: true
      - name: Final exact-objective endpoint certification
        run: |
          python q016_aggregate_v10.py final \
            --input-dir q016_v10_phase2_all \
            --phase1-summary q016_phase1_fixed_summary_v10.json \
            --output q016_primary_merged_v10.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-primary-merged-v10
          path: q016_primary_merged_v10.json
          if-no-files-found: warn
          retention-days: 30

  primary_endpoint_gates:
    needs: merge_primary
    if: ${{ needs.merge_primary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v5
        with:
          name: q016-primary-merged-v10
      - name: Validate V10 primary result
        run: python q016_tests_v10.py final --result q016_primary_merged_v10.json --output q016_primary_result_tests_v10.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-primary-gates-v10
          path: q016_primary_result_tests_v10.json
          if-no-files-found: error
          retention-days: 30
