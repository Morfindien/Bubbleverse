name: Bubbleverse Q052 — native paired helium realization V1

'on':
  workflow_dispatch:
    inputs:
      program_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: q052-native-pair-v1
  cancel-in-progress: false

env:
  CURRENT_Q: Q052
  PROGRAM_ID: Q052-NATIVEPAIR-V1
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  LC_ALL: C

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Exact target and static gates
        env:
          REQUESTED_PROGRAM_ID: ${{ inputs.program_id }}
        run: |
          test "$REQUESTED_PROGRAM_ID" = "Q052-NATIVEPAIR-V1"
          python q052_native_pair_v1.py static
          python -m unittest -v q052_native_pair_tests_v1

  native:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arm: [L, R]
        mode: [nominal, refined]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Restore exact original native environment; never build a replacement core on cache miss
        id: cache
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
            external/act_dr6_cmbonly
            external/act_dr6_lenslike
            external/cobaya_desi_dr2_source
            external/bao_data_v2_6
            external/PolyChordLite
          key: q042-prod-v1-${{ runner.os }}-py311-cobaya356-q032-4dc873a-pc1222-pybobyqa150-pantheonplus
          fail-on-cache-miss: true
      - name: One pinned native branch
        env:
          Q052_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          ARM: ${{ matrix.arm }}
          MODE: ${{ matrix.mode }}
        run: |
          test "$Q052_CACHE_HIT" = "true"
          python q052_native_pair_v1.py worker --arm "$ARM" --mode "$MODE" --directory "q052_native/$ARM-$MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q052-nativepair-v1-${{ github.run_id }}-${{ matrix.arm }}-${{ matrix.mode }}
          path: q052_native/
          if-no-files-found: error
          retention-days: 30

  collect:
    needs: [static, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: q052-nativepair-v1-${{ github.run_id }}-*
          merge-multiple: true
          path: collected
      - name: Independent serialized readback and pair comparison
        run: |
          python q052_native_pair_v1.py collect --directory collected --output Q052_NATIVEPAIR_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q052-nativepair-v1-${{ github.run_id }}-final
          path: |
            Q052_NATIVEPAIR_RESULT_V1.json
            Q052_NATIVEPAIR_CONTRACT_V1.json
          if-no-files-found: error
          retention-days: 30
