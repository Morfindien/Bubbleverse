frozen_software:
  python: '3.10'
  cobaya: 3.5.6
  pyyaml: 6.0.2
  scipy: 1.15.3
  numpy: 2.2.6
  py_bobyqa: 1.5.0
  cython: 3.1.3
  mAxiCLASS:
    repository: https://github.com/marcobeIIa/mAxiCLASS.git
    commit: b5a3af9818d04d2fe696e54972545e8c6805f4ea
    path: external/mAxiCLASS
    reported_class_version: v3.3.0
    cobaya_ignore_obsolete: true
    compatibility_note: 'This is a deliberately frozen modified CLASS implementation.
      Cobaya 3.5.6 expects CLASS >= v3.3.3, so ignore_obsolete is enabled explicitly
      rather than silently replacing the frozen scientific code.

      '
  act_dr6_lite:
    repository: https://github.com/ACTCollaboration/DR6-ACT-lite.git
    commit: 0e0cd2c703c62a0e980470b572602233b27750e1
    path: external/DR6-ACT-lite
  act_dr6_data:
    primary_official_url: https://lambda.gsfc.nasa.gov/data/act/pspipe/sacc_files/dr6_data_cmbonly.tar.gz
