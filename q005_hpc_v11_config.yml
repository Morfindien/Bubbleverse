      latex: A_s
    Omega_m:
      latex: \Omega_m
models:
  lcdm:
    description: Frozen baseline using the same mAxiCLASS binary with no EDE sector
      enabled.
    ede: false
    local_h0_prior: false
  ede:
    description: One-field axion-like EDE, n=3, theta_i fixed at 2.8.
    ede: true
    local_h0_prior: false
    extra_args:
      scf_potential: axion
      n_axion: 3
      scf_parameters: 2.8,0.0
      scf_evolve_as_fluid: 'no'
      scf_evolve_like_axionCAMB: 'no'
      do_shooting: 'yes'
      do_shooting_scf: 'yes'
      N_mscf: 0
      attractor_ic_scf: 'no'
    params:
      log10_axion_ac:
        prior:
          min: -4.5
          max: -3.0
        ref:
          dist: norm
          loc: -3.55
          scale: 0.2
        proposal: 0.05
        latex: \log_{10} a_c
      fraction_axion_ac:
        prior:
          min: 0.0
          max: 0.3
        ref:
          dist: norm
          loc: 0.09
          scale: 0.03
        proposal: 0.015
        latex: f_{EDE}
  ede_local:
    description: 'Same EDE model and likelihood stack, with the H0DN Gaussian constraint
      added explicitly. This run is diagnostic only and must never be called CMB+BAO-only.

      '
    ede: true
    local_h0_prior: true
    inherit_model: ede
sampler:
  minimize:
    method: bobyqa
    ignore_prior: true
    max_evals: 50000
    best_of: 1
    seed: 1701
    override_bobyqa:
      rhoend: 0.02
gates:
  act_reference:
    enabled: true
    lnL_reference: -395.48
    absolute_tolerance: 0.1
    note: 'Validation reference inherited from the established Bubbleverse ACT DR6-lite
      gate. Main scientific runs must not start if a compatible reference evaluation
      cannot reproduce this within tolerance.

      '
  theory_precision:
    delta_chi2_floor: 0.1
  nesting:
    epsilon_fraction_axion_ac: 1.0e-08
    max_abs_delta_chi2: 0.2
  high_h0_without_local_prior:
    threshold: 70.0
  source_conflict_target:
    description: 'Quantify whether a no-local-prior EDE best fit reaches the H0~71
      region associated with K-033 or remains strongly constrained toward small f_EDE.

      '
blocked_candidates:
  varying_me:
    status: NOT INCLUDED IN DIRECT V1 MODEL COMPARISON
    reason: 'A scientifically safe common-theory implementation with the frozen mAxiCLASS
      EDE binary has not been established in this package. Do not compare Delta-chi2
      across different Boltzmann/recombination binaries and call it a model preference.

      '
  free_recombination:
    status: NOT INCLUDED IN DIRECT V1 MODEL COMPARISON
    reason: 'K-035/K-036 require a documented recombination implementation/parameterization.
      No arbitrary ionization-history freedom is invented here.

      '
