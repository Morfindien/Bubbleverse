  title: Bubbleverse Q-005 split-restart pre-recombination numerical gate
  created_local: '2026-08-27T21:45:00+02:00'
  purpose: Preserve the V10 scientific objective while splitting each non-convex minimization
    into independent restart jobs so no single GitHub-hosted job contains best_of=2.
    Aggregation selects the lowest valid minimum per model.
  scientific_status: PROGRAM GENERATED — NOT YET EXECUTED
  execution_mode: GITHUB_MATRIX_MODEL_X_RESTART_SERIAL_WITHIN_RESTART
