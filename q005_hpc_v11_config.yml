      '
packages_path: external/cobaya_packages
rendered_dir: q005_rendered
results_dir: q005_results
logs_dir: q005_logs
likelihoods:
  common:
    planck_2018_lowl.EE_sroll2: null
    act_dr6_cmbonly.ACTDR6CMBonly:
      input_file: dr6_data_cmbonly.fits
      lmax_theory: 9000
      ell_cuts:
        TT:
        - 600
        - 8500
        TE:
        - 600
        - 8500
        EE:
        - 600
        - 8500
      stop_at_error: true
      params:
        A_act:
          prior:
            min: 0.5
            max: 1.5
          ref:
            dist: norm
            loc: 1.0
            scale: 0.01
          proposal: 0.003
          latex: A_{\rm ACT}
        P_act:
          prior:
            min: 0.9
            max: 1.1
          ref:
            dist: norm
            loc: 1.0
            scale: 0.01
          proposal: 0.01
          latex: p_{\rm ACT}
    bao.desi_dr2: null
