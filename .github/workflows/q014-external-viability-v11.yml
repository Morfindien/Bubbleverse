name: Bubbleverse Q014 n=3 EDE External Viability V11

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: q014-external-viability-v11-${{ github.ref }}
  cancel-in-progress: false

env:
  CURRENT_Q: Q014
  RUN_ID: Q014-EXTERNAL-VIABILITY-V11
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages

jobs:
  prepare:
    name: Q014 V11 frozen science + Q011/V10 parent gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2

      - name: Frozen V5 scientific surface Git-blob gate
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local file="$1" expected="$2" repository_blob worktree_blob
            test -f "$file" || { echo "Q014_V5_SCIENCE_SURFACE_REUSE_GATE=FAIL missing=$file" >&2; exit 31; }
            repository_blob="$(git rev-parse "HEAD:$file")"
            worktree_blob="$(git hash-object "$file")"
            echo "Q014_V5_BLOB_CHECK file=$file expected=$expected repository=$repository_blob worktree=$worktree_blob"
            test "$repository_blob" = "$expected" || { echo "Q014_V5_SCIENCE_SURFACE_REUSE_GATE=FAIL repository_blob file=$file" >&2; exit 32; }
            test "$worktree_blob" = "$expected" || { echo "Q014_V5_SCIENCE_SURFACE_REUSE_GATE=FAIL worktree_blob file=$file" >&2; exit 33; }
          }
          check_blob q014_external_viability_v5.py f5fa9cc237b2fc8a28bf8561b1471d885072dc01
          check_blob q014_external_viability_v5_config.yml 0f2c9caef194bcee3ee8f7895f8ef2ea9ab8b71b
          check_blob q014_setup_v5.sh e67e713de478e00340fbbc5b3b4e1e00e0406ef1

          for f in \
            q014_external_viability_v11.py \
            q014_external_viability_v11_config.yml \
            q014_setup_v11.sh \
            q014_aggregate_v11.py \
            q014_tests_v11.py \
            q014_external_viability_v11_source_lock.json \
            q014_case_state_v11.json \
            q014_external_viability_v10.py \
            q014_setup_v10.sh; do
              test -f "$f" || { echo "Q014_V11_REQUIRED_FILE_GATE=FAIL missing=$f" >&2; exit 34; }
              echo "Q014_V11_REQUIRED_FILE_GATE=PASS file=$f"
          done
          echo "Q014_V5_SCIENCE_SURFACE_REUSE_GATE=PASS mode=AUTHORITATIVE_GIT_BLOB_IDENTITY"

      - name: Download exact authoritative Q011 V4 target artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p q014_parent/q011
          gh run download "33363067156" --name q011-ede-globality-certification-v4-final --dir q014_parent/q011
          test -f q014_parent/q011/q011_ede_globality_certification_v4_result.json

      - name: Download and freeze V10 numerical parent — not a scientific result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p q014_parent/v10_raw q014_parent/v10
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33533089788/artifacts?per_page=100" > /tmp/q014_v10_artifacts.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/q014_v10_artifacts.json'))
          a=[x for x in d.get('artifacts',[]) if x.get('name')=='q014-external-viability-v10-final']
          assert len(a)==1,a
          a=a[0]
          assert int(a['id'])==9813716460,a
          assert a.get('digest')=='sha256:823b13455a7810f30c8c0e0bb4836ca7968facb13acc49adec71eeece8c3c499',a
          wr=a.get('workflow_run') or {}
          assert int(wr.get('id'))==33533089788,wr
          assert wr.get('head_sha')=='2ab15429daa9b33a35acef8360c41b1c387a3117',wr
          print('Q014_V10_ARTIFACT_PROVENANCE_GATE=PASS')
          PY
          gh run download "33533089788" --name q014-external-viability-v10-final --dir q014_parent/v10_raw
          SRC="$(find q014_parent/v10_raw -type f -name q014_external_viability_v10_result.json -print -quit)"
          test -n "$SRC"
          cp "$SRC" q014_parent/v10/q014_external_viability_v10_result.json
          python - <<'PY'
          import json
          p='q014_parent/v10/q014_external_viability_v10_result.json'
          d=json.load(open(p))
          assert d.get('q')=='Q014'
          assert d.get('run_id')=='Q014-EXTERNAL-VIABILITY-V10'
          assert d.get('result_id')=='R-Q014-EDE-EXTERNAL-VIABILITY-007'
          assert d.get('validation_status')=='NUMERICALLY UNRESOLVED'
          assert d.get('scientifically_usable_result') is False
          assert d.get('objective_basis')=='SCALAR_TOTAL_LIKELIHOOD_CHI2_PLUS_NORMALIZATION_FREE_GAUSSIAN_CONSTRAINT_SHAPES'
          j=d.get('job_manifest',{})
          assert j.get('expected')==27 and j.get('returned')==27
          assert not j.get('missing') and not j.get('duplicates') and j.get('runtime_source_compatible') is True
          assert d['chains']['planck_npipe_k039_approx']['profiles']['reference_free_h0']['best_two_delta_chi2'] > 1.0
          assert d['chains']['spt_d1_only']['penalties']['fixed_profile_monotonicity_pass'] is False
          print('Q014_V10_NUMERICAL_PARENT_GATE=PASS')
          PY

      - name: V11 static guardrails and parent preflight
        run: |
          mkdir -p q014_v11_gates
          python q014_tests_v11.py static --output q014_v11_gates/q014_static_test_manifest_v11.json
          python q014_external_viability_v11.py preflight \
            --q011 q014_parent/q011/q011_ede_globality_certification_v4_result.json \
            --v10-result q014_parent/v10/q014_external_viability_v10_result.json \
            --output q014_v11_gates/q014_parent_preflight_v11.json

      - name: Build Phase1 task matrix
        id: plan
        run: |
          python q014_external_viability_v11.py plan --phase phase1 \
            --output q014_v11_gates/q014_phase1_matrix_v11.json >/tmp/matrix
          echo "matrix=$(tail -n 1 /tmp/matrix)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          d=json.load(open('q014_v11_gates/q014_phase1_matrix_v11.json'))
          assert len(d['include'])==18,len(d['include'])
          assert len({(x['chain'],x['mode'],x['start_family']) for x in d['include']})==18
          print('Q014_V11_PHASE1_TASK_COUNT_GATE=PASS',len(d['include']))
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: q014-v11-parent-and-plan
          path: |
            q014_parent
            q014_v11_gates
            q014_case_state_v11.json
          retention-days: 30

  spt-assets:
    name: Q014 reuse frozen V10 SPT MUSE source
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact V10 MUSE artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9810513610" > /tmp/q014_v10_muse_artifact.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/q014_v10_muse_artifact.json'))
          assert int(a['id'])==9810513610,a
          assert a.get('name')=='q014-v10-spt-muse-source',a
          assert a.get('digest')=='sha256:a94d02a30aa4f3c1375b03cd5067d9bb09b8c863c150ca35101fcd0aa39a59fa',a
          wr=a.get('workflow_run') or {}
          assert int(wr.get('id'))==33533089788,wr
          assert wr.get('head_sha')=='2ab15429daa9b33a35acef8360c41b1c387a3117',wr
          print('Q014_V10_MUSE_ARTIFACT_PROVENANCE_GATE=PASS')
          PY
      - uses: actions/download-artifact@v5
        with:
          name: q014-v10-spt-muse-source
          path: q014_v11_spt_assets_raw
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33533089788
      - name: Re-verify MUSE source bytes
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=4933ceb993ceb92e48b2191b8ccb1595d182bc4bc3862c1fbad61d5f82136e9b
          SRC="$(find q014_v11_spt_assets_raw -type f -name muse_3g_like_march_2025.zip -print -quit)"
          test -n "$SRC"
          ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED" || { echo "Q014_MUSE_SOURCE_FREEZE_GATE=FAIL expected=$EXPECTED actual=$ACTUAL" >&2; exit 41; }
          mkdir -p q014_v11_spt_assets
          cp "$SRC" q014_v11_spt_assets/muse_3g_like_march_2025.zip
          echo "$EXPECTED  q014_v11_spt_assets/muse_3g_like_march_2025.zip" > q014_v11_spt_assets/muse_3g_like_march_2025.sha256
          echo "Q014_V10_MUSE_BYTE_REUSE_GATE=PASS $EXPECTED"
      - uses: actions/upload-artifact@v5
        with:
          name: q014-v11-spt-muse-source
          path: q014_v11_spt_assets
          retention-days: 30

  smoke:
    name: Q014 smoke ${{ matrix.chain }}
    needs: [prepare, spt-assets]
    strategy:
      fail-fast: false
      matrix:
        chain: [planck_npipe_k039_approx, spt_d1_only, spt_d1_plus_desi]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Reuse frozen MUSE bytes for SPT
        if: ${{ startsWith(matrix.chain, 'spt_') }}
        uses: actions/download-artifact@v5
        with:
          name: q014-v11-spt-muse-source
          path: external/q014_v6_spt_assets
      - name: Build chain environment through V11 wrapper
        run: bash q014_setup_v11.sh "${{ matrix.chain }}"
      - uses: actions/download-artifact@v5
        with:
          name: q014-v11-parent-and-plan
          path: q014_context
      - name: Runtime environment preflight
        run: |
          python q014_external_viability_v11.py preflight --environment --chain "${{ matrix.chain }}" \
            --q011 q014_context/q014_parent/q011/q011_ede_globality_certification_v4_result.json \
            --v10-result q014_context/q014_parent/v10/q014_external_viability_v10_result.json \
            --output q014_environment_preflight_${{ matrix.chain }}.json
      - name: Finite technical smoke
        run: |
          python q014_external_viability_v11.py smoke --chain "${{ matrix.chain }}" \
            --q011 q014_context/q014_parent/q011/q011_ede_globality_certification_v4_result.json \
            --output q014_smoke_${{ matrix.chain }}.json
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: q014-v11-smoke-${{ matrix.chain }}
          path: |
            q014_environment_preflight_${{ matrix.chain }}.json
            q014_smoke_${{ matrix.chain }}.json
            q014_v11_source_runtime
          if-no-files-found: warn
          retention-days: 30

  phase1:
    name: Q014 Phase1 ${{ matrix.chain }} / ${{ matrix.mode }} / ${{ matrix.start_family }}
    needs: [prepare, spt-assets, smoke]
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Reuse frozen MUSE bytes for SPT
        if: ${{ startsWith(matrix.chain, 'spt_') }}
        uses: actions/download-artifact@v5
        with:
          name: q014-v11-spt-muse-source
          path: external/q014_v6_spt_assets
      - name: Build chain environment
        run: bash q014_setup_v11.sh "${{ matrix.chain }}"
      - uses: actions/download-artifact@v5
        with:
          name: q014-v11-parent-and-plan
          path: q014_context
      - name: Run Phase1 atomic profile task
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q014_v11_phase1_results
          OUT="q014_v11_phase1_results/q014_${{ matrix.tag }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 255m python q014_external_viability_v11.py run \
            --chain "${{ matrix.chain }}" --mode "${{ matrix.mode }}" \
            --start-family "${{ matrix.start_family }}" --restart-index "${{ matrix.restart_index }}" \
            --q011 q014_context/q014_parent/q011/q011_ede_globality_certification_v4_result.json \
            --v10-result q014_context/q014_parent/v10/q014_external_viability_v10_result.json \
            --output "$OUT"
          RC=$?
          set -e
          if [[ ! -f "$OUT" ]]; then
            python - "$OUT" "$RC" <<'PY'
          import json,sys
          out,rc=sys.argv[1],int(sys.argv[2])
          json.dump({"case_id":"NOT DOCUMENTED","q":"Q014","run_id":"Q014-EXTERNAL-VIABILITY-V11",
            "chain":"${{ matrix.chain }}","mode":"${{ matrix.mode }}","start_family":"${{ matrix.start_family }}",
            "restart_index":int("${{ matrix.restart_index }}"),"status":"TECHNICAL_FAILURE",
            "failure_type":"PROCESS_TERMINATED_BEFORE_RESULT_SERIALIZATION","process_exit":rc},open(out,"w"),indent=2)
          PY
          fi
          python - "$OUT" "$RC" <<'PY'
          import json,sys
          p,rc=sys.argv[1],int(sys.argv[2]); d=json.load(open(p)); d['workflow_process_exit']=rc
          json.dump(d,open(p,'w'),indent=2,sort_keys=True); print('Q014_PHASE1_TASK_STATUS=',d.get('status'),'PROCESS_EXIT=',rc)
          PY
          exit 0
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: q014-v11-phase1-${{ matrix.tag }}
          path: |
            q014_v11_phase1_results/q014_${{ matrix.tag }}.json
            q014_v11_source_runtime
          if-no-files-found: warn
          retention-days: 30

  phase1-select:
    name: Q014 Phase1 same-run seed selection
    needs: [prepare, smoke, phase1]
    if: ${{ always() && needs.prepare.result == 'success' && needs.smoke.result == 'success' && needs.phase1.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan2.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v5
        with:
          pattern: q014-v11-phase1-*
          path: q014_v11_phase1_aggregate
      - name: Select exact same-run Phase1 best free/fixed minima
        run: |
          python q014_external_viability_v11.py select-phase1 \
            --inputs q014_v11_phase1_aggregate \
            --output q014_phase1_seed_summary_v11.json
      - name: Build Phase2 task matrix
        id: plan2
        run: |
          python q014_external_viability_v11.py plan --phase phase2 \
            --output q014_phase2_matrix_v11.json >/tmp/matrix2
          echo "matrix=$(tail -n 1 /tmp/matrix2)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          d=json.load(open('q014_phase2_matrix_v11.json'))
          assert len(d['include'])==12,len(d['include'])
          assert len({(x['chain'],x['mode'],x['start_family']) for x in d['include']})==12
          print('Q014_V11_PHASE2_TASK_COUNT_GATE=PASS',len(d['include']))
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: q014-v11-phase1-summary
          path: |
            q014_phase1_seed_summary_v11.json
            q014_phase2_matrix_v11.json
          retention-days: 30

  phase2:
    name: Q014 Phase2 ${{ matrix.chain }} / ${{ matrix.mode }} / ${{ matrix.start_family }}
    needs: [prepare, spt-assets, smoke, phase1, phase1-select]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.phase1-select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Reuse frozen MUSE bytes for SPT
        if: ${{ startsWith(matrix.chain, 'spt_') }}
        uses: actions/download-artifact@v5
        with:
          name: q014-v11-spt-muse-source
          path: external/q014_v6_spt_assets
      - name: Build chain environment
        run: bash q014_setup_v11.sh "${{ matrix.chain }}"
      - uses: actions/download-artifact@v5
        with:
          name: q014-v11-parent-and-plan
          path: q014_context
      - uses: actions/download-artifact@v5
        with:
          name: q014-v11-phase1-summary
          path: q014_phase1_context
      - name: Run Phase2 same-run free-H0 certification task
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q014_v11_phase2_results
          OUT="q014_v11_phase2_results/q014_${{ matrix.tag }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 255m python q014_external_viability_v11.py run \
            --chain "${{ matrix.chain }}" --mode "${{ matrix.mode }}" \
            --start-family "${{ matrix.start_family }}" --restart-index "${{ matrix.restart_index }}" \
            --q011 q014_context/q014_parent/q011/q011_ede_globality_certification_v4_result.json \
            --v10-result q014_context/q014_parent/v10/q014_external_viability_v10_result.json \
            --phase1-summary q014_phase1_context/q014_phase1_seed_summary_v11.json \
            --output "$OUT"
          RC=$?
          set -e
          if [[ ! -f "$OUT" ]]; then
            python - "$OUT" "$RC" <<'PY'
          import json,sys
          out,rc=sys.argv[1],int(sys.argv[2])
          json.dump({"case_id":"NOT DOCUMENTED","q":"Q014","run_id":"Q014-EXTERNAL-VIABILITY-V11",
            "chain":"${{ matrix.chain }}","mode":"${{ matrix.mode }}","start_family":"${{ matrix.start_family }}",
            "restart_index":int("${{ matrix.restart_index }}"),"status":"TECHNICAL_FAILURE",
            "failure_type":"PROCESS_TERMINATED_BEFORE_RESULT_SERIALIZATION","process_exit":rc},open(out,"w"),indent=2)
          PY
          fi
          python - "$OUT" "$RC" <<'PY'
          import json,sys
          p,rc=sys.argv[1],int(sys.argv[2]); d=json.load(open(p)); d['workflow_process_exit']=rc
          json.dump(d,open(p,'w'),indent=2,sort_keys=True); print('Q014_PHASE2_TASK_STATUS=',d.get('status'),'PROCESS_EXIT=',rc)
          PY
          exit 0
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: q014-v11-phase2-${{ matrix.tag }}
          path: |
            q014_v11_phase2_results/q014_${{ matrix.tag }}.json
            q014_v11_source_runtime
          if-no-files-found: warn
          retention-days: 30

  aggregate-and-test:
    name: Q014 aggregate + mandatory scientific tests
    if: ${{ always() && needs.prepare.result == 'success' && needs.smoke.result == 'success' && needs.phase1.result == 'success' && needs.phase1-select.result == 'success' && needs.phase2.result == 'success' }}
    needs: [prepare, spt-assets, smoke, phase1, phase1-select, phase2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v5
        with:
          pattern: q014-v11-phase1-*
          path: q014_v11_aggregate/phase1
      - uses: actions/download-artifact@v5
        with:
          pattern: q014-v11-phase2-*
          path: q014_v11_aggregate/phase2
      - uses: actions/download-artifact@v5
        with:
          pattern: q014-v11-smoke-*
          path: q014_v11_aggregate/smoke
      - uses: actions/download-artifact@v5
        with:
          name: q014-v11-parent-and-plan
          path: q014_v11_aggregate/context
      - uses: actions/download-artifact@v5
        with:
          name: q014-v11-phase1-summary
          path: q014_v11_aggregate/phase1-summary

      - name: Aggregate within chains only
        run: |
          mkdir -p q014_v11_aggregate/final
          python q014_aggregate_v11.py \
            --inputs q014_v11_aggregate/phase1 q014_v11_aggregate/phase2 \
            --output q014_v11_aggregate/final/q014_external_viability_v11_result.json \
            --manifest-output q014_v11_aggregate/final/q014_job_manifest_v11.json

      - name: Mandatory result validation
        shell: bash
        run: |
          set +e
          python q014_tests_v11.py result \
            --result q014_v11_aggregate/final/q014_external_viability_v11_result.json \
            --output q014_v11_aggregate/final/q014_test_manifest_v11.json
          TEST_RC=$?
          set -e
          python - <<'PY'
          import json
          p='q014_v11_aggregate/final/q014_external_viability_v11_result.json'
          d=json.load(open(p))
          handoff={
            "case_id":d["case_id"],"bubbleverse_q":"Q014",
            "original_case_question":d["original_case_question"],
            "status":"COMPLETE" if d.get("scientifically_usable_result") else "PARTIAL",
            "validation_status":d.get("validation_status"),
            "scientific_target":"External n=3 EDE likelihood penalty at H0=71.5, by chain",
            "objective_basis":d.get("objective_basis"),
            "tests":"q014_test_manifest_v11.json",
            "sources":["K-029","K-036","K-038","K-039","K-040","INTERNAL-Q005",
              "R-Q011-EDE-GLOBALITY-CERTIFICATION-004",
              "R-Q012-EDE-LIKELIHOOD-ATTRIBUTION-001",
              "R-Q014-EDE-EXTERNAL-VIABILITY-007-NUMERICAL-PARENT-ONLY"],
            "primary_results":{k:{
              "fixed_h0_profile_delta_chi2":v.get("penalties",{}).get("fixed_h0_profile_delta_chi2"),
