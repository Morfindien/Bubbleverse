name: Bubbleverse Q005 HPC V14 Common Backend Differential

on:
  workflow_dispatch:
    inputs:
      restarts:
        description: Independent optimizer restarts per model
        required: true
        default: "2"
        type: string
      include_h0dn_reoptimization:
        description: Re-optimize all models with H0DN added after discovery fits
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: q005-hpc-v14-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Q005 V14 source lock and dynamic plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      smoke_matrix: ${{ steps.plan.outputs.smoke_matrix }}
      production_matrix: ${{ steps.plan.outputs.production_matrix }}
      h0dn_matrix: ${{ steps.plan.outputs.h0dn_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install planning dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Verify source lock and build matrices
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python q005_hpc_v14.py source-lock
          SMOKE="$(python q005_hpc_v14.py plan --kind smoke --restarts '${{ inputs.restarts }}' --json)"
          PROD="$(python q005_hpc_v14.py plan --kind production --restarts '${{ inputs.restarts }}' --json)"
          H0DN="$(python q005_hpc_v14.py plan --kind h0dn --restarts '${{ inputs.restarts }}' --json)"
          echo "smoke_matrix=$SMOKE" >> "$GITHUB_OUTPUT"
          echo "production_matrix=$PROD" >> "$GITHUB_OUTPUT"
          echo "h0dn_matrix=$H0DN" >> "$GITHUB_OUTPUT"

  smoke:
    name: Q005 V14 smoke ${{ matrix.model }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Build frozen common backend and likelihood stack
        run: bash q005_setup_v14.sh
      - name: Smoke complete theory plus likelihood
        run: python q005_hpc_v14.py run --model "${{ matrix.model }}" --smoke
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q005-v14-smoke-${{ matrix.model }}
          path: |
            q005_v14_results/
            q005_v14_logs/
            q005_v14_rendered/
          retention-days: 30

  nesting:
    name: Q005 V14 nesting gate
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Build frozen common backend and likelihood stack
        run: bash q005_setup_v14.sh
      - name: Run finite-domain EDE backend validation
        run: python q005_hpc_v14.py nesting
      - name: Upload nesting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q005-v14-nesting
          path: |
            q005_v14_results/q005_nesting_v14.json
            q005_v14_logs/
            q005_v14_rendered/
          retention-days: 30

  production:
    name: Q005 V14 ${{ matrix.model }} restart ${{ matrix.restart }}
    needs: [plan, nesting]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.production_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Build frozen common backend and likelihood stack
        run: bash q005_setup_v14.sh

      # FIX11: a single independent optimizer attempt may fail technically.
      # Preserve that failure as a machine-readable result instead of making
      # the entire matrix/aggregate disappear.
      - name: Production minimization
        id: minimize
        continue-on-error: true
        run: |
          python q005_hpc_v14.py run \
            --model "${{ matrix.model }}" \
            --restart "${{ matrix.restart }}"

      - name: Collect machine-readable result
        id: collect
        if: always()
        continue-on-error: true
        run: |
          python q005_hpc_v14.py collect \
            --model "${{ matrix.model }}" \
            --restart "${{ matrix.restart }}"

      - name: Verify restart record exists
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          model = "${{ matrix.model }}"
          restart = int("${{ matrix.restart }}")
          p = Path("q005_v14_results") / f"q005_job_result_{model}_r{restart}.json"
          if not p.exists():
              raise SystemExit(f"Missing machine-readable restart record: {p}")
          d = json.loads(p.read_text())
          if d.get("q") != "Q-005":
              raise SystemExit("Wrong Q identity in restart record")
          if d.get("project") != "Q-005-HPC-V14":
              raise SystemExit("Wrong project identity in restart record")
          if d.get("model") != model or int(d.get("restart", -1)) != restart:
              raise SystemExit("Wrong model/restart identity in restart record")
          print("RESTART_RECORD_GATE = PASS")
          print("SCIENTIFIC_STATUS =", d.get("status"))
          print("REASON =", d.get("reason"))
          PY

      - name: Upload restart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q005-v14-prod-${{ matrix.model }}-r${{ matrix.restart }}
          path: |
            q005_v14_results/
            q005_v14_logs/
            q005_v14_rendered/
          retention-days: 30

  h0dn:
    name: Q005 V14 H0DN ${{ matrix.model }} restart ${{ matrix.restart }}
    if: ${{ inputs.include_h0dn_reoptimization }}
    needs: [plan, production]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.h0dn_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Build frozen common backend and likelihood stack
        run: bash q005_setup_v14.sh

      - name: Re-optimize with H0DN external likelihood
        continue-on-error: true
        run: |
          python q005_hpc_v14.py run \
            --model "${{ matrix.model }}" \
            --restart "${{ matrix.restart }}"

      - name: Collect machine-readable H0DN result
        if: always()
        continue-on-error: true
        run: |
          python q005_hpc_v14.py collect \
            --model "${{ matrix.model }}" \
            --restart "${{ matrix.restart }}"

      - name: Verify H0DN restart record exists
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          model = "${{ matrix.model }}"
          restart = int("${{ matrix.restart }}")
          p = Path("q005_v14_results") / f"q005_job_result_{model}_r{restart}.json"
          if not p.exists():
              raise SystemExit(f"Missing H0DN restart record: {p}")
          d = json.loads(p.read_text())
          if d.get("q") != "Q-005" or d.get("project") != "Q-005-HPC-V14":
              raise SystemExit("Wrong Q/project identity in H0DN restart record")
          if d.get("model") != model or int(d.get("restart", -1)) != restart:
              raise SystemExit("Wrong H0DN model/restart identity")
          print("H0DN_RESTART_RECORD_GATE = PASS")
          print("SCIENTIFIC_STATUS =", d.get("status"))
          PY

      - name: Upload H0DN restart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q005-v14-h0dn-${{ matrix.model }}-r${{ matrix.restart }}
          path: |
            q005_v14_results/
            q005_v14_logs/
            q005_v14_rendered/
          retention-days: 30

  aggregate:
    name: Q005 V14 aggregate and final gates
    if: ${{ always() }}
    needs: [plan, production, h0dn]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Download production artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: q005-v14-prod-*
          path: q005_v14_aggregate

      - name: Download nesting artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: q005-v14-nesting
          path: q005_v14_aggregate/nesting

      - name: Download H0DN artifacts if requested
        if: ${{ inputs.include_h0dn_reoptimization }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: q005-v14-h0dn-*
          path: q005_v14_aggregate/h0dn

      - name: Aggregate and validate
        id: aggregate
        continue-on-error: true
        run: |
          python q005_validate_v14.py \
            --artifacts-root q005_v14_aggregate \
            --restarts "${{ inputs.restarts }}"

      - name: Verify final result exists
        if: always()
        run: |
          test -f q005_v14_aggregate/q005_hpc_v14_final_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("q005_v14_aggregate/q005_hpc_v14_final_result.json")
          d = json.loads(p.read_text())
          print("FINAL_RESULT_RECORD_GATE = PASS")
          print("FINAL STATUS =", d.get("status"))
          print("FINAL GATES =", d.get("gates"))
          PY

      - name: Upload final result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q005-v14-final-result
          path: q005_v14_aggregate/q005_hpc_v14_final_result.json
          retention-days: 90
