name: Bubbleverse Q042 V21 — missing-parent fix; reuse completed CLASS replay
'on':
  workflow_dispatch:
    inputs:
      program_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: q042-stock-diagnostic-v21
  cancel-in-progress: false
env:
  CURRENT_Q: Q-042
  PROGRAM_ID: Q042-STOCKDIAG-V21
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Verify target and package before compute
      env:
        REQUESTED_PROGRAM_ID: ${{ inputs.program_id }}
      run: |
        test "$REQUESTED_PROGRAM_ID" = "$PROGRAM_ID"
        python q042_install_stock_diagnostic_v21.py --check
        python -m unittest discover -s . -p 'q042_stock_diagnostic_tests_v21.py'
  class-replay:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Import exact completed V20 CLASS diagnostic; no CLASS recomputation
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python q042_stock_diagnostic_v21.py fetch --key class_result --out class_bundle
        python q042_stock_diagnostic_v21.py import-class --out diag_results
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: q042-v21-${{ github.run_id }}-class-diagnostic
        path: |
          diag_results/**
          class_bundle/**
          q042_stock_diagnostic_contract_v21.json
        if-no-files-found: error
        retention-days: 30
  stock-probe:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Record total job budget
      run: echo "DIAG_JOB_START_UNIX=$(date +%s)" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
      with:
        ref: d0f92c7f2ce53da32818244f8847f8e745e20c4f
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: diagnostic_delivery
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/pip
          external/cobaya_packages
          external/class_ede
          external/hillipop
          external/act_dr6_cmbonly
          external/act_dr6_lenslike
          external/cobaya_desi_dr2_source
          external/bao_data_v2_6
          external/PolyChordLite
        key: q042-prod-v1-${{ runner.os }}-py311-cobaya356-q032-4dc873a-pc1222-pybobyqa150-pantheonplus
        fail-on-cache-miss: true
    - name: Frozen runtime, native compiler and Q032 parent
      timeout-minutes: 60
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gfortran gcc g++ make openmpi-bin libopenmpi-dev pkg-config
        git fetch --depth 1 origin 4dc873a5e880d40858d831a3b421456728f0c032
        git worktree add --detach q032_parent 4dc873a5e880d40858d831a3b421456728f0c032
        bash q042_setup_recovery_v18.sh
    - name: Import exact hashed state and frozen environment
      timeout-minutes: 25
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python diagnostic_delivery/q042_stock_diagnostic_v21.py fetch --key ede --out diag_inputs/ede
        python diagnostic_delivery/q042_stock_diagnostic_v21.py fetch --key environment --out env_bundle
    - name: Validate inherited runtime before observer rebuild
      run: python diagnostic_delivery/q042_stock_diagnostic_v21.py verify-runtime --out diag_results
    - name: Rebuild with output-only observer; require synthetic byte identity
      timeout-minutes: 10
      run: |
        export Q042_PINNED_NESTED_SOURCE="$PWD/external/PolyChordLite/src/polychord/nested_sampling.F90"
        python -m unittest discover -s diagnostic_delivery -p 'q042_stock_diagnostic_tests_v21.py'
        python diagnostic_delivery/q042_stock_diagnostic_v21.py instrument --out diag_results
    - name: One CamSpec EDE FULL resume — no automatic continuation
      run: python diagnostic_delivery/q042_stock_diagnostic_v21.py probe --out diag_results
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: q042-v21-${{ github.run_id }}-stock-diagnostic
        path: |
          diag_results/**
          q042_runtime/*.json
          diagnostic_delivery/q042_stock_diagnostic_contract_v21.json
          diag_inputs/ede/diagnostic_import.json
          env_bundle/diagnostic_import.json
        if-no-files-found: error
        retention-days: 30
  collect:
    if: always()
    needs:
    - static
    - class-replay
    - stock-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v4
      with:
        pattern: q042-v21-${{ github.run_id }}-*-diagnostic
        path: collected
    - name: Diagnostic completeness and identity — science stays UNRESOLVED
      run: python q042_stock_diagnostic_v21.py collect --out q042_stock_diagnostic_final_v21.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: q042-v21-${{ github.run_id }}-diagnostic-final
        path: |
          q042_stock_diagnostic_final_v21.json
          q042_stock_diagnostic_contract_v21.json
          q042_execution_handoff_v21.md
        if-no-files-found: error
        retention-days: 30
