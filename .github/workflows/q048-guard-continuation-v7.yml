name: Q048 direct guard and He1f-He2 continuation V7
on:
  workflow_dispatch:
    inputs:
      program_id:
        description: Registered finite Q048 V7 proof identifier
        required: true
        type: string
        default: Q048-GUARDCONT-V7
concurrency:
  group: q048-guard-continuation-v7
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package, source, launcher and bounded-proof controls
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
        run: |
          test "$PROGRAM_ID" = Q048-GUARDCONT-V7
          python q048_v7_repository_patch.py
          python q048_guard_package_check_v7.py
          timeout --signal=TERM 900s python -m unittest q048_guard_tests_v7 q048_structural_tests_v6 -v
  ede:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [camspec-ede_n3, hillipop-ede_n3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute bounded direct guard and thermal continuation
        env:
          CASE: ${{ matrix.case }}
        run: timeout --signal=TERM 6600s python q048_guard_runner_v7.py --program-id Q048-GUARDCONT-V7 --case "$CASE" --out q048_guard_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q048-guard-v7-${{ matrix.case }}-${{ github.run_id }}
          path: q048_guard_results/*.json
          if-no-files-found: error
  collect:
    needs: [preflight, ede]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: q048-guard-v7-*-${{ github.run_id }}
          path: collected
      - name: Require both EDE reports and validate merge bindings
        env:
          EXPECTED_RUN: ${{ github.run_id }}
        run: timeout --signal=TERM 4800s python q048_guard_runner_v7.py --collect collected --expected-run "$EXPECTED_RUN" --full-verify --out q048_guard_final_v7.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q048-guard-v7-final-${{ github.run_id }}
          path: q048_guard_final_v7.json
          if-no-files-found: error
