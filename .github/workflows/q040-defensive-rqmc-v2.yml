          mkdir -p q040_endpoint
          python q040_defensive_rqmc_v2.py profile \
            --q032-parent-root q032_parent --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-dir q032_parent_profiles --preregister q040_defensive_rqmc_preregister_v2.json --source-lock q040_defensive_rqmc_source_lock_v2.json \
            --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json \
            --implementation '${{ matrix.implementation }}' --bank '${{ matrix.bank }}' --mask '${{ matrix.mask }}' --seed '${{ matrix.seed }}' \
            --coreset-meta 'q040_coreset/q040_rqmc_${{ matrix.implementation }}_coreset_v2.json' \
            --coreset-npz 'q040_coreset/q040_rqmc_${{ matrix.implementation }}_coreset_v2.npz' \
            --soft-stop-minutes 300 --scratch q040_rqmc_runtime \
            --output 'q040_endpoint/${{ matrix.bank }}_${{ matrix.implementation }}_M${{ matrix.mask }}_S${{ matrix.seed }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q040-rqmc-bank-${{ matrix.bank }}-${{ matrix.implementation }}-M${{ matrix.mask }}-S${{ matrix.seed }}
          path: q040_endpoint/*.json
          if-no-files-found: warn

  bank_stability:
    needs: [coreset_gate, bank_endpoints]
    if: always() && needs.coreset_gate.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: q040-rqmc-bank-*
          merge-multiple: true
          path: q040_bank_endpoints
      - id: gate
        run: python q040_defensive_rqmc_v2.py bank-stability --endpoint-dir q040_bank_endpoints --output q040_rqmc_bank_stability_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-bank-stability-v2
          path: q040_rqmc_bank_stability_v2.json

  bank_failure_seal:
    needs: bank_stability
    if: always() && needs.bank_stability.result != 'skipped' && needs.bank_stability.outputs.proceed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-bank-stability-v2
          path: q040_gate
      - run: |
          python q040_defensive_rqmc_v2.py seal-failure --gate q040_gate/q040_rqmc_bank_stability_v2.json \
            --preregister q040_defensive_rqmc_preregister_v2.json --source-lock q040_defensive_rqmc_source_lock_v2.json \
            --output q040_final_v2.json --handoff q040_return_handoff_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-final-v2
          path: |
            q040_final_v2.json
            q040_return_handoff_v2.json

  production_endpoints:
    needs: bank_stability
    if: needs.bank_stability.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        implementation: [camspec, hillipop]
        mask: [3, 6, 7]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Create detached frozen Q032 worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$Q032_EXECUTION_COMMIT^{commit}"
          git worktree add --detach q032_parent "$Q032_EXECUTION_COMMIT"
          test "$(git -C q032_parent rev-parse HEAD)" = "$Q032_EXECUTION_COMMIT"
      - name: Restore exact authoritative Q032 cache
        id: q032cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
          key: q032-v2-${{ runner.os }}-py311-classede-5a131c91-hillipop-a09ddde3
          fail-on-cache-miss: true
      - name: Require exact cache hit
        run: test '${{ steps.q032cache.outputs.cache-hit }}' = 'true'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          pattern: q032-refine-*
          merge-multiple: true
          path: q032_parent_profiles
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-preflight-sealed-v2
          path: q032_preflight
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q032_GITHUB_RUN_ID }}
          name: q032-hillipop-covariance-v2
          path: q032_hlp_cov
      - name: Recreate frozen Q032 runtime
        shell: bash
        run: bash q039_prepare_frozen_env_v4.sh '${{ matrix.implementation }}'
      - uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-coreset-${{ matrix.implementation }}-v2
          path: q040_coreset
      - name: Optimize final pooled defensive marginal endpoint
        shell: bash
        env:
          COBAYA_PACKAGES_PATH: ${{ github.workspace }}/q032_parent/external/cobaya_packages
        run: |
          mkdir -p q040_endpoint
          python q040_defensive_rqmc_v2.py profile \
            --q032-parent-root q032_parent --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-dir q032_parent_profiles --preregister q040_defensive_rqmc_preregister_v2.json --source-lock q040_defensive_rqmc_source_lock_v2.json \
            --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json \
            --implementation '${{ matrix.implementation }}' --bank ALL --mask '${{ matrix.mask }}' --seed '${{ matrix.seed }}' \
            --coreset-meta 'q040_coreset/q040_rqmc_${{ matrix.implementation }}_coreset_v2.json' \
            --coreset-npz 'q040_coreset/q040_rqmc_${{ matrix.implementation }}_coreset_v2.npz' \
            --soft-stop-minutes 300 --scratch q040_rqmc_runtime \
            --output 'q040_endpoint/ALL_${{ matrix.implementation }}_M${{ matrix.mask }}_S${{ matrix.seed }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q040-rqmc-production-${{ matrix.implementation }}-M${{ matrix.mask }}-S${{ matrix.seed }}
          path: q040_endpoint/*.json
          if-no-files-found: warn

  production_gate:
    needs: [bank_stability, production_endpoints]
    if: always() && needs.bank_stability.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: q040-rqmc-production-*
          merge-multiple: true
          path: q040_production
      - id: gate
        run: python q040_defensive_rqmc_v2.py production-gate --endpoint-dir q040_production --output q040_rqmc_production_gate_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-production-gate-v2
          path: q040_rqmc_production_gate_v2.json

  production_failure_seal:
    needs: production_gate
    if: always() && needs.production_gate.result != 'skipped' && needs.production_gate.outputs.proceed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-production-gate-v2
          path: q040_gate
      - run: |
          python q040_defensive_rqmc_v2.py seal-failure --gate q040_gate/q040_rqmc_production_gate_v2.json \
            --preregister q040_defensive_rqmc_preregister_v2.json --source-lock q040_defensive_rqmc_source_lock_v2.json \
            --output q040_final_v2.json --handoff q040_return_handoff_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-final-v2
          path: |
            q040_final_v2.json
            q040_return_handoff_v2.json

  assess:
    needs: production_gate
    if: needs.production_gate.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          pattern: q040-rqmc-production-*
          merge-multiple: true
          path: q040_production
      - run: python q040_defensive_rqmc_v2.py assess --endpoint-dir q040_production --output q040_rqmc_provisional_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-provisional-v2
          path: q040_rqmc_provisional_v2.json

  result_tests:
    needs: assess
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-provisional-v2
          path: q040_result
      - uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-bank-stability-v2
          path: q040_bank
      - uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-integration-final-v2
          path: q040_integration
      - uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-coreset-gate-v2
          path: q040_coreset_gate
      - name: Mandatory final result tests
        run: |
          python q040_defensive_rqmc_tests_v2.py result \
            --provisional q040_result/q040_rqmc_provisional_v2.json \
            --bank-stability q040_bank/q040_rqmc_bank_stability_v2.json \
            --integration-state q040_integration/q040_rqmc_integration_selected_v2.json \
            --coreset-gate q040_coreset_gate/q040_rqmc_coreset_gate_v2.json \
            --preregister q040_defensive_rqmc_preregister_v2.json --source-lock q040_defensive_rqmc_source_lock_v2.json \
            --output q040_rqmc_result_tests_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-tests-v2
          path: q040_rqmc_result_tests_v2.json

  seal:
    needs: result_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-provisional-v2
          path: q040_result
      - uses: actions/download-artifact@v4
        with:
          name: q040-rqmc-tests-v2
          path: q040_tests
      - run: |
          python q040_defensive_rqmc_v2.py seal \
            --provisional q040_result/q040_rqmc_provisional_v2.json --tests q040_tests/q040_rqmc_result_tests_v2.json \
            --preregister q040_defensive_rqmc_preregister_v2.json --source-lock q040_defensive_rqmc_source_lock_v2.json \
            --output q040_final_v2.json --handoff q040_return_handoff_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: q040-rqmc-final-v2
          path: |
            q040_final_v2.json
            q040_return_handoff_v2.json
            q040_defensive_rqmc_preregister_v2.json
            q040_defensive_rqmc_source_lock_v2.json
          if-no-files-found: error
