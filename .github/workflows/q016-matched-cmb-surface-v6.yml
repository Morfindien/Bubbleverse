name: Bubbleverse Q016 Matched CMB Surface V6

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CURRENT_Q: Q016
  RUN_ID: Q016-MATCHED-CMB-SURFACE-V6
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Static V6 targeted-basin gates
        run: |
          set -euo pipefail
          bash -n q016_setup_v6.sh
          bash -n q016_act_asset_v6.sh
          python -m py_compile q016_branch_runner_v6.py q016_aggregate_v6.py q016_primary_result_tests_v6.py q016_result_tests_v6.py
          python - <<'PY'
          import json,yaml
          c=yaml.safe_load(open("q016_matched_cmb_surface_v6_config.yml"))
          t=json.load(open("q016_target_basin_lock_v6.json"))
          assert c["project"]["run_id"]=="Q016-MATCHED-CMB-SURFACE-V6"
          assert c["model"]["backend_commit"]=="5a131c91d657dd9a7c6364cc45b038710f8d0d97"
          assert c["model"]["n_scf"]==3
          assert [c["surface"]["primary"]["ell_min"],c["surface"]["primary"]["ell_max"]]==[600,2000]
          assert c["surface"]["primary"]["observables"]==["TT","TE","EE"]
          assert c["surface"]["primary"]["low_z_data"]==[]
          assert t["rules"]["multistart_delta_chi2_max"]==1.0
          assert t["rules"]["no_gate_relaxation"] is True
          assert set(t["targeted_profiles"])=={
            "planck|reference_free_h0","spt|fixed_h0_71p5","act|fixed_h0_71p5"}
          print("Q016_V6_STATIC_PREFLIGHT=PASS")
          PY

  parent_provenance:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify V4 and V5 authoritative parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33693382859" > /tmp/v4.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33720410690" > /tmp/v5.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33720410690/artifacts?per_page=100" > /tmp/v5arts.json
          python - <<'PY'
          import json
          v4=json.load(open("/tmp/v4.json")); v5=json.load(open("/tmp/v5.json"))
          arts=json.load(open("/tmp/v5arts.json"))["artifacts"]
          assert v4["head_sha"]=="596ee68677784deb4c28d1eb5992faf6dcd2c5b1"
          assert v5["head_sha"]=="5148b8b3badbbe313d30e6f744d51d6fd42b584e"
          a=[x for x in arts if x["id"]==9884213098]
          assert len(a)==1
          assert a[0].get("digest")=="sha256:0ee0ec9d8b7b0f05a83f78d54efd572e702ff98b44d9fdafd9f0c3ec6be3576e"
          expected={
            "q016-v5-act-reference_free_h0-r1","q016-v5-act-reference_free_h0-r4",
            "q016-v5-act-fixed_h0_71p5-r1","q016-v5-act-fixed_h0_71p5-r4",
            "q016-v5-spt-fixed_h0_71p5-r4","q016-v5-spt-fixed_h0_71p5-r5"}
          names={x["name"] for x in arts}
          assert expected <= names, sorted(expected-names)
          print("Q016_V6_PARENT_PROVENANCE_GATE=PASS")
          PY

  act_assets:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Fetch ACT DR6 data once
        run: bash q016_act_asset_v6.sh q016_act_asset_v6
      - uses: actions/upload-artifact@v5
        with:
          name: q016-v6-act-dr6-data
          path: q016_act_asset_v6
          if-no-files-found: error
          retention-days: 30

  targeted:
    needs: [preflight, parent_provenance, act_assets]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - branch: planck
            mode: reference_free_h0
            restart: 6
          - branch: planck
            mode: reference_free_h0
            restart: 7
          - branch: planck
            mode: reference_free_h0
            restart: 8
          - branch: spt
            mode: fixed_h0_71p5
            restart: 6
          - branch: spt
            mode: fixed_h0_71p5
            restart: 7
          - branch: spt
            mode: fixed_h0_71p5
            restart: 8
          - branch: act
            mode: fixed_h0_71p5
            restart: 6
          - branch: act
            mode: fixed_h0_71p5
            restart: 7
          - branch: act
            mode: fixed_h0_71p5
            restart: 8
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Preseed ACT shared data when needed
        if: ${{ matrix.branch == 'act' }}
        uses: actions/download-artifact@v5
        with:
          name: q016-v6-act-dr6-data
          path: q016_act_asset_download
      - name: Install shared ACT data when needed
        if: ${{ matrix.branch == 'act' }}
        run: |
          set -euo pipefail
          SRC="$(find q016_act_asset_download -type f -name dr6_data_cmbonly.fits -print -quit)"
          test -n "$SRC"
          DST="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0/dr6_data_cmbonly.fits"
          mkdir -p "$(dirname "$DST")"; cp "$SRC" "$DST"
          python - <<'PY'
          import os,hashlib
          from pathlib import Path
          p=Path(os.environ["COBAYA_PACKAGES_PATH"])/"data/ACTDR6CMBonly/v1.0/dr6_data_cmbonly.fits"
          assert p.read_bytes()[:80].startswith(b"SIMPLE")
          print("Q016_V6_ACT_PRESEED_GATE=PASS",p.stat().st_size)
          PY
      - name: Build branch environment
        run: bash q016_setup_v6.sh "${{ matrix.branch }}"
      - name: Targeted basin replication
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q016_results
          OUT="q016_results/${{ matrix.branch }}_${{ matrix.mode }}_r${{ matrix.restart }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 315m python q016_branch_runner_v6.py \
            --branch "${{ matrix.branch }}" --mode "${{ matrix.mode }}" \
            --restart "${{ matrix.restart }}" --output "$OUT"
          RC=$?
          set -e
          if [[ ! -f "$OUT" ]]; then
            python - "$OUT" "$RC" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            "q":"Q016","run_id":"Q016-MATCHED-CMB-SURFACE-V6",
            "result_id":"R-Q016-EDE-MATCHED-CMB-SURFACE-006",
            "status":"TECHNICAL_FAILURE","failure_class":"HPC_OR_TIMEOUT",
            "exit_code":int(sys.argv[2]),"scientific_model_failure":False
          },indent=2,sort_keys=True)+"\n")
          PY
          fi
          exit "$RC"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-v6-${{ matrix.branch }}-${{ matrix.mode }}-r${{ matrix.restart }}
          path: |
            q016_results/*.json
            q016_v6_source_runtime/*.json
          if-no-files-found: warn
          retention-days: 30

  merge_primary:
    needs: [parent_provenance, targeted]
    if: ${{ always() && needs.parent_provenance.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - name: Download V4 shards
        uses: actions/download-artifact@v5
        with:
          pattern: q016-v4-*
          path: q016_parent_v4
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33693382859
      - name: Download V5 repair shards
        uses: actions/download-artifact@v5
        with:
          pattern: q016-v5-*
          path: q016_parent_v5
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33720410690
      - name: Download V6 targeted shards
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: q016-v6-*
          path: q016_targeted_v6
          merge-multiple: true
      - name: Assemble immutable continuation
        run: |
          set -euo pipefail
          mkdir -p q016_results
          for B in planck spt act; do
            find q016_parent_v4 -type f -name "${B}_*.json" -exec cp {} q016_results/ \;
            find q016_parent_v5 -type f -name "${B}_*.json" -exec cp {} q016_results/ \;
            find q016_targeted_v6 -type f -name "${B}_*.json" -exec cp {} q016_results/ \;
          done
          find q016_results -maxdepth 1 -type f -name '*.json' -printf '%f\n' | sort
      - name: Certify multistart basin replication
        run: python q016_aggregate_v6.py --input-dir q016_results --output q016_primary_merged_v6.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-primary-merged-v6
          path: q016_primary_merged_v6.json
          if-no-files-found: warn
          retention-days: 30

  primary_endpoint_gates:
    needs: merge_primary
    if: ${{ always() && needs.merge_primary.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: q016-primary-merged-v6
      - name: Stage-aware primary certification
        run: |
          if [[ ! -f q016_primary_merged_v6.json ]]; then
            echo "Q016_PRIMARY_ENDPOINT_GATE=FAIL"
            exit 2
          fi
          python q016_primary_result_tests_v6.py \
            --merged q016_primary_merged_v6.json \
            --output q016_primary_result_tests_v6.json
          cat q016_primary_result_tests_v6.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-primary-gates-v6
          path: q016_primary_result_tests_v6.json
          if-no-files-found: warn
          retention-days: 30
