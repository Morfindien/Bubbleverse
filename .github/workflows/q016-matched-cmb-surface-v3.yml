name: Bubbleverse Q016 Matched CMB Surface V3
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CURRENT_Q: Q016
  RUN_ID: Q016-MATCHED-CMB-SURFACE-V3
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - name: Install static dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Static Q016 V3 gates
        run: |
          set -euo pipefail
          bash -n q016_setup_v3.sh
          python -m py_compile q016_branch_runner_v3.py q016_aggregate_v3.py q016_result_tests_v3.py
          python - <<'PY'
          import yaml, importlib.metadata as md
          c=yaml.safe_load(open("q016_matched_cmb_surface_v3_config.yml"))
          assert c["project"]["q"]=="Q016"
          assert c["project"]["run_id"]=="Q016-MATCHED-CMB-SURFACE-V3"
          assert c["model"]["n_scf"]==3
          assert c["model"]["backend_commit"]=="5a131c91d657dd9a7c6364cc45b038710f8d0d97"
          assert c["surface"]["primary"]["observables"]==["TT","TE","EE"]
          assert [c["surface"]["primary"]["ell_min"],c["surface"]["primary"]["ell_max"]]==[600,2000]
          assert c["surface"]["primary"]["low_z_data"]==[]
          assert c["model"]["q011_exact_vector_as_external_endpoint"] is False
          assert md.version("numpy")=="1.26.4"
          assert md.version("Cython")=="0.29.37"
          print("Q016_V3_STATIC_PREFLIGHT=PASS")
          PY

  primary:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        branch: [planck, spt, act]
        mode: [reference_free_h0, fixed_h0_71p5]
        restart: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt

      - name: Install frozen Bubbleverse base dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt

      - name: Build Q016 branch environment
        run: bash q016_setup_v3.sh "${{ matrix.branch }}"

      - name: Execute independent reprofile
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q016_results
          OUT="q016_results/${{ matrix.branch }}_${{ matrix.mode }}_r${{ matrix.restart }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 315m python q016_branch_runner_v3.py \
            --branch "${{ matrix.branch }}" \
            --mode "${{ matrix.mode }}" \
            --restart "${{ matrix.restart }}" \
            --output "$OUT"
          RC=$?
          set -e
          if [[ ! -f "$OUT" ]]; then
            python - "$OUT" "$RC" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); rc=int(sys.argv[2]); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            "q":"Q016","run_id":"Q016-MATCHED-CMB-SURFACE-V3",
            "result_id":"R-Q016-EDE-MATCHED-CMB-SURFACE-003",
            "status":"TECHNICAL_FAILURE","failure_class":"HPC_OR_TIMEOUT",
            "exit_code":rc,"scientific_model_failure":False,
            "scientific_result":"NOT_AVAILABLE"
          },indent=2,sort_keys=True)+"\n")
          PY
          fi
          exit "$RC"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-v3-${{ matrix.branch }}-${{ matrix.mode }}-r${{ matrix.restart }}
          path: |
            q016_results/*.json
            q016_v3_source_runtime/*.json
          if-no-files-found: warn
          retention-days: 30

  merge_primary:
    needs: primary
    if: ${{ always() && needs.primary.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v5
        with:
          pattern: q016-v3-*
          path: q016_downloads
          merge-multiple: true
      - name: Gather scientific shard records only
        run: |
          mkdir -p q016_results
          find q016_downloads -type f -name 'planck_*.json' -exec cp {} q016_results/ \;
          find q016_downloads -type f -name 'spt_*.json' -exec cp {} q016_results/ \;
          find q016_downloads -type f -name 'act_*.json' -exec cp {} q016_results/ \;
      - name: Merge primary
        run: python q016_aggregate_v3.py --input-dir q016_results --output q016_primary_merged_v3.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-primary-merged-v3
          path: q016_primary_merged_v3.json
          if-no-files-found: warn

  final_gates:
    needs: merge_primary
    if: ${{ always() && needs.merge_primary.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: q016-primary-merged-v3
      - name: Scientific gates remain unresolved until attribution/secondary stage
        shell: bash
        run: |
          if [[ ! -f q016_primary_merged_v3.json ]]; then
            echo "Q016_PRIMARY_MERGE_GATE=FAIL no merged primary result"
            exit 2
          fi
          set +e
          python q016_result_tests_v3.py \
            --config q016_matched_cmb_surface_v3_config.yml \
            --merged q016_primary_merged_v3.json \
            --output q016_result_tests_v3.json
          RC=$?
          cat q016_result_tests_v3.json
          exit "$RC"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-final-gates-v3
          path: q016_result_tests_v3.json
          if-no-files-found: warn
