name: Q052 V137 - Scalar startup on GitHub
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q052-scalar-start-v137
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mwt5345/class_ede
          ref: 5a131c91d657dd9a7c6364cc45b038710f8d0d97
          path: external/class_ede
          persist-credentials: false
      - name: Authenticate the V136 package and pinned CLASS checkout
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          printf '%s\n' 'ac862efbf369fe2cb9fbc395694ca754db3144dc069771bbdefeaa8e8024c9c1  Q052_STARTOBSERVATOER_V136.zip' | sha256sum -c -
          python3 -m zipfile -e Q052_STARTOBSERVATOER_V136.zip capture-kit
          python3 capture-kit/verify136.py | tee diagnostics/verify136.log
          test "$(git -C external/class_ede rev-parse HEAD)" = 5a131c91d657dd9a7c6364cc45b038710f8d0d97
      - name: Install dependencies and verify four hardware breakpoints
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb gcc libmpfr6 libgmp10 libgomp1
          gdb --version | tee diagnostics/gdb-version.txt
          gcc --version | tee diagnostics/gcc-version.txt
          cat > capture-kit/hardware-check.c <<'C'
          volatile int visited;
          void a(void) { visited++; }
          void b(void) { visited++; }
          void c(void) { visited++; }
          void d(void) { visited++; }
          int main(void) { a(); b(); c(); d(); return visited != 4; }
          C
          gcc -g -O0 capture-kit/hardware-check.c -o capture-kit/hardware-check
          gdb -nx -batch --return-child-result -ex 'set disable-randomization off' -ex start \
            -ex 'hbreak a' -ex 'hbreak b' -ex 'hbreak c' -ex 'hbreak d' \
            -ex 'python assert len(gdb.breakpoints()) == 4' \
            -ex 'continue' -ex 'python assert gdb.selected_frame().name() == "a"; print("HIT_a")' \
            -ex 'continue' -ex 'python assert gdb.selected_frame().name() == "b"; print("HIT_b")' \
            -ex 'continue' -ex 'python assert gdb.selected_frame().name() == "c"; print("HIT_c")' \
            -ex 'continue' -ex 'python assert gdb.selected_frame().name() == "d"; print("HIT_d")' \
            -ex 'continue' \
            --args capture-kit/hardware-check 2>&1 | tee diagnostics/hardware-check.log
          test "$(grep -c '^HIT_[abcd]$' diagnostics/hardware-check.log)" -eq 4
          grep -q 'exited normally' diagnostics/hardware-check.log
      - name: Rebuild only the wrapper against the authenticated library
        run: |
          set -euo pipefail
          python3 -m zipfile -e capture-kit/evidence/Q052_SKALARSTART_V135.zip historical
          python3 - <<'PY'
          import hashlib
          import ast
          from pathlib import Path
          source = Path('external/class_ede')
          producer = Path('historical/evidence/producer36.py')
          assignments=ast.parse(producer.read_text()).body
          expected=next(ast.literal_eval(x.value) for x in assignments if isinstance(x, ast.Assign)
                        and isinstance(x.targets[0], ast.Name) and x.targets[0].id=='SOURCE_BLOBS')
          if len(expected) != 315:
              raise ValueError('Unexpected source manifest')
          for name, pin in expected.items():
              b = (source/name).read_bytes()
              blob = hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              if blob != pin:
                  raise ValueError(name)
          PY
          legacy="$GITHUB_WORKSPACE/q052_native_pair_v36_run/source"
          test "$legacy" = /home/runner/work/Bubbleverse/Bubbleverse/q052_native_pair_v36_run/source
          mkdir -p "$(dirname "$legacy")"
          ln -s "$GITHUB_WORKSPACE/external/class_ede" "$legacy"
          test -r "$legacy/external/bbn/sBBN_2017.dat"
          sha256sum "$legacy/external/bbn/sBBN_2017.dat" | tee diagnostics/bbn-sha256.txt
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          archive = json.loads(Path('historical/evidence/raw69.json').read_bytes())
          src = Path('external/class_ede').resolve()
          lib = Path('capture-kit/evidence/libq052_class_v36.so').resolve()
          wrapper_src = Path('historical/evidence/observer69.c')
          executable = Path('capture-kit/observer69')
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          if sha(lib) != archive['unchanged_native_library_sha256'] or sha(wrapper_src) != archive['observer_source_sha256']:
              raise ValueError('Authentic library or wrapper source missing')
          flags = archive['execution']['commands'][0][1:8]
          relative_includes = ('include','external/HyRec2020','external/heating','external/RecfastCLASS')
          cmd = ['gcc',*flags,*['-I'+str(src/n) for n in relative_includes],str(wrapper_src),str(lib),
                 '-Wl,-rpath,'+str(lib.parent),'-Wl,-z,now','-ldl','-lm','-o',str(executable)]
          Path('diagnostics/wrapper-command.json').write_text(json.dumps(cmd,indent=2)+'\n')
          subprocess.run(cmd,check=True)
          Path('diagnostics/wrapper-build.json').write_text(json.dumps({
              'source_sha256':sha(wrapper_src),'wrapper_sha256':sha(executable),'library_sha256':sha(lib),
              'flags':flags},indent=2)+'\n')
          PY
          ldd capture-kit/observer69 | tee diagnostics/ldd.txt
          ! grep -q 'not found' diagnostics/ldd.txt
      - name: Run one nominal L/R pair and save the separate readback
        run: |
          set -euo pipefail
          python3 capture-kit/launch.py capture-kit/evidence/libq052_class_v36.so capture-kit/observer69 measured \
            --run-id "LOCAL-Q052-V137-GITHUB-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wrapper-build-receipt diagnostics/wrapper-build.json
          python3 capture-kit/readback.py measured/L/scalar_start_receipt.json measured/R/scalar_start_receipt.json > diagnostics/independent-readback.json
      - name: Save essential outputs on success or failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if test -d measured; then
            python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          files=[]
          for p in sorted(Path('measured').rglob('*')):
              if p.is_file():
                  files.append({'path':str(p),'size':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()})
          Path('diagnostics/measured-manifest.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
            mkdir -p evidence-parts
            tar -czf - measured | split -b 18000000 -d -a 2 - evidence-parts/measured-
            test ! -e evidence-parts/measured-06
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q052-v137-github-result-${{ github.run_id }}
          path: |
            diagnostics/
            measured/execution.json
            measured/result.json
            measured/*/debugger.log
            measured/*/scalar_start_receipt.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('evidence-parts/measured-00') != ''
        with:
          name: q052-v137-github-raw-00-${{ github.run_id }}
          path: evidence-parts/measured-00
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('evidence-parts/measured-01') != ''
        with:
          name: q052-v137-github-raw-01-${{ github.run_id }}
          path: evidence-parts/measured-01
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('evidence-parts/measured-02') != ''
        with:
          name: q052-v137-github-raw-02-${{ github.run_id }}
          path: evidence-parts/measured-02
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('evidence-parts/measured-03') != ''
        with:
          name: q052-v137-github-raw-03-${{ github.run_id }}
          path: evidence-parts/measured-03
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('evidence-parts/measured-04') != ''
        with:
          name: q052-v137-github-raw-04-${{ github.run_id }}
          path: evidence-parts/measured-04
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('evidence-parts/measured-05') != ''
        with:
          name: q052-v137-github-raw-05-${{ github.run_id }}
          path: evidence-parts/measured-05
          if-no-files-found: error
          retention-days: 30
