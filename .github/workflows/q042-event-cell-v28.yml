name: Bubbleverse Q042 V28 — bounded event-aware crossing cell
'on':
  workflow_dispatch:
    inputs:
      program_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: q042-event-cell-v28
  cancel-in-progress: false
env:
  CURRENT_Q: Q-042
  PROGRAM_ID: Q042-EVENTCELL-V28
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Exact registered target and immutable package
        env:
          REQUESTED_PROGRAM_ID: ${{ inputs.program_id }}
        run: |
          set -euo pipefail
          test "$REQUESTED_PROGRAM_ID" = "$PROGRAM_ID"
          python q042_event_cell_v28.py static
          python -m unittest discover -s . -p 'q042_event_tests_v28.py' -v
  probes:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Account for preflight/cache failures
        run: |
          python - <<'PY'
          import os
          import q042_event_cell_v28 as m
          m.write('event_cell/preflight_pending.json',dict(**m.identity(m.read(m.HERE/m.CONTRACT),os.environ['GITHUB_RUN_ID']),expected_trials=m.EXPECTED,status='CACHE_AND_ORIGINAL_BINARY_PENDING'))
          PY
      - name: Restore existing original cache; no rebuild or cache write
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
            external/act_dr6_cmbonly
            external/act_dr6_lenslike
            external/cobaya_desi_dr2_source
            external/bao_data_v2_6
            external/PolyChordLite
          key: q042-prod-v1-${{ runner.os }}-py311-cobaya356-q032-4dc873a-pc1222-pybobyqa150-pantheonplus
          fail-on-cache-miss: true
      - name: One six-branch original-binary crossing-cell diagnostic
        timeout-minutes: 10
        run: python q042_event_cell_v28.py run --out event_cell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q042-v28-${{ github.run_id }}-raw-event-cell
          path: event_cell/**
          if-no-files-found: error
          retention-days: 30
  collect:
    needs: [static, probes]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: q042-v28-${{ github.run_id }}-raw-event-cell
          path: collected
      - name: Exact stage/routing/continuity gates or explicit partial result
        run: python q042_event_cell_v28.py collect --directory collected --out q042_event_final_v28.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q042-v28-${{ github.run_id }}-diagnostic-final
          path: |
            q042_event_final_v28.json
            q042_event_contract_v28.json
            q042_event_manifest_v28.json
            q042_execution_handoff_event_v28.md
            q042_event_source_evidence_v28.json
          if-no-files-found: error
          retention-days: 30
