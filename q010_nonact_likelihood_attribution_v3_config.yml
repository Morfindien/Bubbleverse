versioning:
  policy: IMMUTABLE_VERSION_CHAIN
  rule: Every technical revision creates a new program, config, workflow, point artifact,
    final result filename, and final artifact name. Previous versions are never overwritten.
  current_version: V3
  v3_reason: V2 incorrectly treated optimizer-native parent total chi2 reproduction
    from finite-precision serialized vectors as a mandatory gate. V3 separates parent
    total provenance from serialized-vector component attribution and does not invent
    a component offset.
claim_boundary: Fixed-point component attribution inside the frozen Q-005 V14 common
  backend. Q-005/Q-008 optimizer-native total chi2 values remain authoritative parent
  scalars, while component deltas are evaluated on the finite-precision serialized
  Q007/Q008 vectors. No roundtrip offset is redistributed across components. Q-008
  targets remain BEST OBSERVED, not proven global minima. Q-010 does not resolve GLOBALITY_GATE
  and does not establish n=3 EDE as a solution to the H0 tension. Signed component
  deltas are retained.
attribution_reference:
