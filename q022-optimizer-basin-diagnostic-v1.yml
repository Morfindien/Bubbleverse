name: Bubbleverse Q022 full-MF optimizer-basin diagnostic V1

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CURRENT_Q: Q022
  RUN_ID: Q022-FULL-MF-OPTIMIZER-BASIN-DIAGNOSTIC-V1
  RESULT_ID: R-Q022-EDE-FULLMF-OPTIMIZER-BASIN-001
  PARENT_Q021_RAW_RUN_ID: '33882434170'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install lightweight analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy PyYAML

      - name: Static syntax check
        run: |
          python -m py_compile \
            q021_finalize_repair_v2.py \
            q021_tests_v2.py \
            q022_basin_diagnostic_v1.py \
            q022_tests_v1.py

      - name: Download all Q021 V1 raw artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.PARENT_Q021_RAW_RUN_ID }}
          path: q021_v1_downloads

      - name: Reproduce authoritative Q021 V2 semantics from raw profiles
        run: |
          python q021_finalize_repair_v2.py \
            --input-dir q021_v1_downloads \
            --output q021_parent_reaggregated_v2.json
          python q021_tests_v2.py \
            --merged q021_parent_reaggregated_v2.json \
            --output q021_parent_tests_v2.json

      - name: Q022 read-only basin diagnostic
        run: |
          python q022_basin_diagnostic_v1.py \
            --config q022_basin_diagnostic_v1_config.yml \
            --input-dir q021_v1_downloads \
            --q021-v2 q021_parent_reaggregated_v2.json \
            --output q022_basin_diagnostic_v1.json

      - name: Mandatory Q022 tests
        run: |
          python q022_tests_v1.py \
            --result q022_basin_diagnostic_v1.json \
            --output q022_tests_v1.json

      - name: Finalize validated result
        run: |
          python - <<'PY'
          import json
          p='q022_basin_diagnostic_v1.json'
          r=json.load(open(p,encoding='utf-8'))
          t=json.load(open('q022_tests_v1.json',encoding='utf-8'))
          r['tests_status']=t['tests_status']
          r['gates']=t['gates']
          r['FINAL_RESULT_GATE']=t['FINAL_RESULT_GATE']
          r['status']='PASS' if t['FINAL_RESULT_GATE']=='PASS' else 'FAIL'
          json.dump(r,open('q022_final_v1.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          open('q022_final_v1.json','a',encoding='utf-8').write('\n')
          if t['FINAL_RESULT_GATE']!='PASS': raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q022-final-v1
          path: |
            q021_parent_reaggregated_v2.json
            q021_parent_tests_v2.json
            q022_basin_diagnostic_v1.json
            q022_tests_v1.json
            q022_final_v1.json
          if-no-files-found: warn
