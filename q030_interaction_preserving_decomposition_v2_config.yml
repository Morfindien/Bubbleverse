  precision_symmetrization: P_sym_action=0.5*(P_raw@X+P_raw.T@X)
  marginal_precision: SCHUR_COMPLEMENT_ACTION
  distribution_modes: [spectrum, ell_band]
  distribution_rule: >-
    Retain exact unordered within-group and cross-group covariance terms.
    Do not assign cross-group terms to one group.
