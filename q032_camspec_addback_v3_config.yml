scientific_decisions:
  single_restoration: >-
    One or more one-sector surfaces restore stable multibasin geometry; minimum
    restoring cardinality is one and no pairwise/control tier is scientifically required.
  pair_restoration: >-
    No single sector restores, but one or more preregistered two-sector surfaces
    restore; minimum restoring cardinality is two.
  triple_restoration: >-
    No single or pair surface restores, but full_native under identical V3
    optimization semantics restores; all three tested sectors are jointly required
    under this decomposition.
  no_clean_localization: >-
    No single, pair, or same-V3 full_native control restores stable multibasin
    geometry. Close Q032 with no clean localization at this sector resolution;
    do not open arbitrary calibration/foreground/mask/covariance searches.

stop_condition: >-
