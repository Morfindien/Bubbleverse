numerical_method:
  quadratic_factorial_formula: >-
    Delta2(xTPx)=2*x00TPc+2*aTPb+2*aTPc+2*bTPc+cTPc,
    with a=x10-x00, b=x01-x00, c=x11-x10-x01+x00.
  precision_action: EXACT_Q028_V8_SYMMETRIZED_SCHUR_ACTION
  scalar_accumulation_priority:
    - numpy.longdouble
    - math.fsum
  bilinear_symmetrization: 0.5*(xT_Py + yT_Px)
  group_pair_rule: >-
    Preserve unordered within-group and cross-group covariance terms. Evaluate
    the factorial expansion directly within each group pair instead of
    contrasting four large group quadratic scalars.

