name: Bubbleverse Q047 — original environment preflight V1

'on':
  workflow_dispatch:
    inputs:
      program_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: q047-collection-preflight-v1
  cancel-in-progress: false
env:
  CURRENT_Q: Q-047
  PROGRAM_ID: Q047-COLLECTION-PREFLIGHT-V1
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  LC_ALL: C

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Package, launcher, registry, README and continuity controls
        env:
          REQUESTED_PROGRAM_ID: ${{ inputs.program_id }}
        run: |
          python q047_execution_v1.py static --program-id "$REQUESTED_PROGRAM_ID"
          python -m unittest -v test_q047_execution_v1
  worker:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Preserve stage before cache acquisition
        run: |
          python - <<'PY'
          import pathlib, q047_execution_v1 as m
          pathlib.Path('q047_stage').mkdir()
          m.write('q047_stage/attempt.json', dict(**m.base(), stage='ORIGINAL_CACHE_PENDING', native_initializations_started=0))
          PY
      - name: Original cache paths and key; restore only
        id: cache
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
            external/act_dr6_cmbonly
            external/act_dr6_lenslike
            external/cobaya_desi_dr2_source
            external/bao_data_v2_6
            external/PolyChordLite
          key: q042-prod-v1-${{ runner.os }}-py311-cobaya356-q032-4dc873a-pc1222-pybobyqa150-pantheonplus
          fail-on-cache-miss: true
      - name: One pass; exact core, four original archives, observer-only build; zero initialization
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          Q047_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          REQUESTED_PROGRAM_ID: ${{ inputs.program_id }}
        run: python q047_execution_v1.py worker --program-id "$REQUESTED_PROGRAM_ID" --directory q047_capture
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 10
        with:
          name: q047-preflight-v1-${{ github.run_id }}-raw
          path: |
            q047_capture/**
            q047_stage/**
            !q047_capture/*.zip
          if-no-files-found: error
          retention-days: 30
  collect:
    needs: [static, worker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: q047-preflight-v1-${{ github.run_id }}-raw
          path: collected
      - name: Failure-aware four-case integrity collection; no scientific PASS
        env:
          REQUESTED_PROGRAM_ID: ${{ inputs.program_id }}
        run: python q047_execution_v1.py finalize --program-id "$REQUESTED_PROGRAM_ID" --directory collected/q047_capture --output q047_collection_preflight_final_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q047-preflight-v1-${{ github.run_id }}-final
          path: |
            q047_collection_preflight_final_v1.json
            Q047_SAMLET_JOURNAL.md
            Q047_EXECUTION_PACKAGE_V1.json
            Q047_COLLECTION_LOCK_V1.json
          if-no-files-found: error
          retention-days: 30
