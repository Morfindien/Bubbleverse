project:
  q: Q-005
  id: Q-005-HPC-V14-GLOBALITY-RECOVERY
  parent_project: Q-005-HPC-V14
  purpose: >-
    Finite deterministic globality recovery for the frozen Q-005 V14 common-backend
    discovery fits. This is a technical optimizer/globality test, not a new scientific model.
  scientific_question: >-
    Hvilke af de resterende systematiske og kosmologiske forklaringsklasser kan
    kvantitativt reducere den robuste H0-spænding, samtidig med at de forbliver
    forenelige med H0DN, CMB-SPA, DESI DR2 + BBN, den interne late-Universe
    calibration structure og de fysisk alternative H0-routes?

parent_result:
  github_run_id: 33222058407
  workflow_run_number: 21
  head_sha: a554a691b182f05ef8b28642c6de8a40ce061efe
  artifact_id: 9709873270
  artifact_name: q005-v14-final-result
  artifact_sha256: 766d0fc326150a8078760b2f770c79a9a0504cbf74c4d7bd9f5069807b34b589
  status: UNRESOLVED_GLOBALITY

frozen_claim_boundary:
  allowed:
    - common-backend apples-to-apples comparison
    - n=3 versus n=2 EDE differential test
    - common-backend varying-electron-mass control
    - optimizer/globality recovery
  forbidden:
    - exact K-036 paper-native reproduction
    - exact K-038 EDE paper-native reproduction
    - exact K-038 varying-electron-mass paper-native reproduction

base_files:
  engine: q005_hpc_v14.py
  config: q005_hpc_v14_config.yml
  setup: q005_setup_v14.sh
  requirements: q005_hpc_v14_requirements.txt
  source_lock: q005_hpc_v14_source_lock.json

optimizer_recovery:
  method: bobyqa
  max_evals: 320
  rhoend: 0.01
  ede_rhobeg: 0.25
  internal_restarts: false
  interpretation: >-
    Technical refinement only. Scientific model, priors, bounds, datasets,
    likelihoods, nuisance priors, fEDE floor, and high-H0/globality thresholds
    are unchanged. max_evals is raised from 240 to 320 and rhoend tightened from
    0.02 to 0.01 to refine deterministic basin tests while keeping each job below
    the 240-minute safe target based on prior measured V12/V14 runtimes.

gates:
  globality_delta_chi2: 1.0
  high_h0_threshold: 71.5
  minimum_replicated_best_profiles: 2
  minimum_valid_profiles_per_model: 2
  theory_precision_delta_chi2_floor: 0.1

runtime:
  github_hosted_hard_limit_minutes: 360
  safe_job_target_minutes: 240
  job_timeout_minutes: 240
  aggregate_timeout_minutes: 20
  strategy: PARALLEL_DETERMINISTIC_BASIN_STARTS
  h0dn_reoptimization: false

