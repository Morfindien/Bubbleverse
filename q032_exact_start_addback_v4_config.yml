stop_condition: First execute exact-start TT3 baseline. If it becomes stable, stop and return for Q032 parent-protocol reassessment. If it remains non-stable, proceed through the bounded one-sector, two-sector, and full-native hierarchy and stop at the first restoring tier or after the control.
