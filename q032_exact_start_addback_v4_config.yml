  triple_restoration: No single or pair surface restores, but full_native under identical V4 exact-start optimization semantics restores; all three tested sectors are jointly required under this decomposition.
  no_clean_localization: No single, pair, or same-V4 exact-start full_native control restores stable multibasin geometry. Close Q032 with no clean localization at this sector resolution; do not open arbitrary calibration/foreground/mask/covariance searches.
