        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
            external/act_dr6_cmbonly
            external/act_dr6_lenslike
            external/cobaya_desi_dr2_source
            external/bao_data_v2_6
          key: q041-v18-${{ runner.os }}-py311-q032-4dc873a-actcmb-880eacb-lens-b386ddb-desi-b7b8a36
          fail-on-cache-miss: true
      - name: Download exact segment 1 predecessor for this logical chain
        uses: actions/download-artifact@v4
        with:
          name: q041-chain-${{ matrix.implementation }}-${{ matrix.combo }}-c${{ matrix.chain }}-seg1-v18
          path: q041_chain
      - name: Require exact predecessor state
        shell: bash
        run: |
          set -euo pipefail
          test -s q041_chain/chain.1.txt
          test -s q041_chain/chain.checkpoint
          test -s q041_chain/chain.covmat
          test -s q041_chain/chain.updated.yaml
          test -s q041_chain/q041_chain_metadata_v18.json
