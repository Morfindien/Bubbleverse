          path: q032_hlp_cov
      - uses: actions/download-artifact@v4
        with:
          name: q041-environment-v18
          path: q041_environment_artifact
      - name: Recreate exact implementation runtime
        run: bash q041_prepare_frozen_core_v18.sh '${{ matrix.implementation }}'
      - name: Restore/install locked external Q041 components
        run: bash q041_setup_v18.sh
      - name: Run or resume one independent posterior chain — segment 2
        shell: bash
        run: |
          python q041_planck_portability_v18.py sample \
            --q032-parent-root q032_parent \
            --preflight q032_preflight/q032_preflight_sealed_v2.json \
            --parent-dir q032_parent_profiles \
            --hlp-matrix q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.npy \
            --hlp-meta q032_hlp_cov/q032_hillipop_tt3pair_precision_v2.json \
            --reduced-support q041_environment_artifact/q041_environment/q041_primary_nonoverlap_support_v18.json \
            --reduced-hlp-matrix q041_environment_artifact/q041_environment/q041_hillipop_nonoverlap_precision_v18.npy \
            --reduced-hlp-meta q041_environment_artifact/q041_environment/q041_hillipop_nonoverlap_precision_v18.json \
            --preregister q041_planck_portability_preregister_v18.json \
            --source-lock q041_planck_portability_source_lock_v18.json \
            --implementation '${{ matrix.implementation }}' \
            --combo '${{ matrix.combo }}' \
            --chain '${{ matrix.chain }}' \
            --segment '2' \
            --series-id '${{ github.run_id }}' \
            --soft-stop-minutes "$SEGMENT_SOFT_STOP_MINUTES" \
            --max-segments "$MAX_SEGMENTS" \
            --output-dir q041_chain
      - name: Upload exact segment 2 chain state
        if: always()
