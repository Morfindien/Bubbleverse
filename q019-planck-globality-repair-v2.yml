name: Bubbleverse Q019 Planck globality repair V2

on:
  workflow_dispatch:

env:
  CURRENT_Q: Q019
  RUN_ID: Q019-PLANCK-COSMOLOGY-GLOBALITY-V2

jobs:
  continuation:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        family: [base_basin, plus_basin]
        restart: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: bash q019_setup_v2.sh
      - name: Local continuation
        run: |
          mkdir -p q019_v2_continuation
          python q019_globality_v2.py \
            --config q019_globality_v2_config.yml \
            continuation \
            --family '${{ matrix.family }}' \
            --restart '${{ matrix.restart }}' \
            --output "q019_v2_continuation/${{ matrix.family }}_r${{ matrix.restart }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q019-v2-${{ matrix.family }}-r${{ matrix.restart }}
          path: q019_v2_continuation/*.json
          if-no-files-found: warn

  q016_endpoint_reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: bash q019_setup_v2.sh
      - name: Re-evaluate frozen Q016 endpoints on exact Q016 objective
        run: |
          mkdir -p q019_v2_reference
          python q019_globality_v2.py \
            --config q019_globality_v2_config.yml \
            q016-endpoint-check \
            --output q019_v2_reference/q019_q016_endpoint_reference_v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q019-v2-q016-endpoint-reference
          path: q019_v2_reference/*.json
          if-no-files-found: error

  final:
    needs: [continuation, q016_endpoint_reference]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: q019_v2_downloads
      - name: Aggregate V2
        run: |
          REF="$(find q019_v2_downloads -name q019_q016_endpoint_reference_v2.json -print -quit)"
          test -n "$REF"
          python q019_globality_v2.py \
            --config q019_globality_v2_config.yml \
            aggregate \
            --input-dir q019_v2_downloads \
            --endpoint-json "$REF" \
            --output q019_merged_v2.json
      - name: Mandatory V2 result tests
        if: always()
        run: |
          python q019_tests_v2.py \
            --merged q019_merged_v2.json \
            --output q019_tests_v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q019-final-v2
          path: |
            q019_merged_v2.json
            q019_tests_v2.json
          if-no-files-found: warn
