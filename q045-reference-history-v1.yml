name: Bubbleverse Q045 reference history V1 — bounded native refinement
'on':
  workflow_dispatch:
    inputs:
      program_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: q045-reference-history-v1
  cancel-in-progress: false
env:
  CURRENT_Q: Q-045
  PROGRAM_ID: Q045-REFHIST-V1
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Scope, registry, journal, launcher and package
        env:
          REQUESTED_PROGRAM_ID: ${{ inputs.program_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import os,q045_reference_history_v1 as a;a.check_id(os.environ["REQUESTED_PROGRAM_ID"]);a.static();a.no_repeat()'
  inputs:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Recover exact completed V3 histories once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python q045_reference_history_v1.py prepare --out parent_inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q045-refhist-${{ github.run_id }}-parents
          path: parent_inputs/**
          retention-days: 30
          if-no-files-found: error
  refine:
    needs: [static, inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: [camspec-lcdm, camspec-ede_n3, hillipop-lcdm, hillipop-ede_n3]
        level: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Preserve attempted job before environment acquisition
        env:
          JOB: ${{ matrix.job }}
          LEVEL: ${{ matrix.level }}
        run: |
          python - <<'PY'
          import os,q045_reference_history_v1 as a
          a.write('preflight/q045_reference_history_worker_v1.json',dict(**a.envelope(),job_id=os.environ['JOB']+'-L'+os.environ['LEVEL'],parent_key=os.environ['JOB'],level=int(os.environ['LEVEL']),status='FAILED',error='CACHE_OR_SETUP_NOT_COMPLETE',history_diagnostic_gate='FAIL',files={},theory_evaluations_started=0))
          PY
      - name: Exact original cache identity including all nine paths; no rebuild/fallback/save
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            external/cobaya_packages
            external/class_ede
            external/hillipop
            external/act_dr6_cmbonly
            external/act_dr6_lenslike
            external/cobaya_desi_dr2_source
            external/bao_data_v2_6
            external/PolyChordLite
          key: q042-prod-v1-${{ runner.os }}-py311-cobaya356-q032-4dc873a-pc1222-pybobyqa150-pantheonplus
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: q045-refhist-${{ github.run_id }}-parents
          path: parents
      - name: Pinned numerical reader and finite contract tests
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4
          python q045_reference_history_tests_v1.py --native-root external/class_ede
      - name: One original-binary history refinement; no CMB/likelihood
        timeout-minutes: 20
        env:
          JOB: ${{ matrix.job }}
          LEVEL: ${{ matrix.level }}
        run: python q045_reference_history_v1.py worker --job "$JOB" --level "$LEVEL" --inputs parents --out q045_output --class-root external/class_ede
      - name: Keep exactly one success or failure record
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import q045_reference_history_v1 as a
          output=Path('q045_output');result=output/a.RESULT
          attempt=output/'attempt.json';fallback=Path('preflight')/a.RESULT
          if not result.is_file() and attempt.is_file():
              r=a.read(attempt)
              r.update(status='FAILED',history_diagnostic_gate='FAIL',error='WORKER_INTERRUPTED_AFTER_ATTEMPT; actual started slot preserved')
              r['files']={p.name:a.sha(p) for p in output.iterdir() if p.is_file() and p.name!=a.RESULT}
              a.write(result,r)
          if result.is_file():fallback.unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q045-refhist-${{ github.run_id }}-worker-${{ matrix.job }}-L${{ matrix.level }}
          path: |
            q045_output/**
            preflight/**
          retention-days: 30
          if-no-files-found: error
  collect:
    needs: [static, inputs, refine]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Pinned numerical reader
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: q045-refhist-${{ github.run_id }}-parents
          path: collected/parents
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: q045-refhist-${{ github.run_id }}-worker-*
          path: collected/workers
      - name: Verify eight outcomes, rederive diagnostics and preserve qualification limits
        run: python q045_reference_history_v1.py collect --directory collected --out q045_reference_history_final_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q045-refhist-${{ github.run_id }}-final
          path: |
            q045_reference_history_final_v1.json
            *_common_grid.tsv
            q045_reference_history_contract_v1.json
            q045_reference_history_manifest_v1.json
            Q045_EXECUTION_HANDOFF.md
            Q045_SAMLET_JOURNAL.md
          retention-days: 30
          if-no-files-found: error
