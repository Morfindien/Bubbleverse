chains:
  planck_npipe_k039_approx:
    role: PRIMARY_EXTERNAL_CHAIN
    label: K039_PUBLIC_NPIPE_COMMON_BACKEND_APPROX
    paper_native_reproduction: false
    approximation_reason: K-039 modifies the NPIPE CamSpec construction relative to
      the public PR4-12.6 likelihood (additional A×A/B×B cross-spectra and TE extension).
      The public Cobaya NPIPE CamSpec likelihood is therefore used only as a clearly-labelled
      common-backend approximation.
    likelihoods:
    - planck_2018_lowl.TT
    - planck_2018_lowl.EE
    - planck_NPIPE_highl_CamSpec.TTTEEE
    - planck_2018_lensing.native
    - bao.sdss_dr12_consensus_final
    - bao.sixdf_2011_bao
    - bao.sdss_dr7_mgs
    - sn.pantheonplus
    overlap_with_q005:
      level: PARTIAL
      notes:
      - Planck low-l information overlaps with the internal Q005 surface.
      - NPIPE high-l is new relative to Q005 ACT high-l.
      - BOSS/6dF/MGS/Pantheon+ are not DESI DR2 and are not to be merged with Q005
        chi2.
    start_reference:
      H0: 68.4
      fEDE: 0.035
      log10z_c: 3.85
      thetai_scf: 3.01
  spt_d1_only:
    role: PRIMARY_EXTERNAL_CHAIN
    label: K040_SPT_D1_LIKELIHOOD_NATIVE_COMMON_BACKEND
    paper_native_reproduction: false
    approximation_reason: The official SPT-3G D1 likelihood products are used, but
      the cosmological backend and optimizer convention are the frozen Bubbleverse
      Q005 V14 common backend rather than an exact reproduction of the paper's full
      AxiCLASS analysis environment.
    include_desi_dr2: false
    tau_information:
      mean: 0.051
      sigma: 0.006
    primary_likelihood:
      package: candl
      package_version: 2.0.3
      dataset: spt_candl_data.SPT3G_D1_TnE
      variant: lite
      distribution: candl-like
      import_module: candl
    lensing_likelihood:
      plugin: muse3glike.cobaya.spt3g_2yr_delensed_ee_optimal_pp_muse
      components:
      - ϕϕ
      note: Use lensing-only component so the primary SPT TT/TE/EE information is
        not double counted.
    overlap_with_q005:
      level: LOWER_THAN_ACT_CHAIN
      notes:
      - No ACT high-l data.
      - No DESI DR2 in the primary SPT-only branch.
      - Tau information is an external Gaussian rather than Q005 Planck low-l EE.
    start_reference:
      H0: 67.96
      fEDE: 0.03
      log10z_c: 3.55
      thetai_scf: 2.8
