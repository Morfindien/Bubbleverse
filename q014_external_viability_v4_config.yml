  expanded_extra_start_families:
    reference_free_h0:
    - baseline
    - jitter_a
    fixed_h0_71p5:
    - baseline
    - jitter_b
    q011_shared_physics: []
  minimizer:
    method: bobyqa
    ignore_prior: false
    max_evals: 320
    best_of: 1
    override_bobyqa:
      rhoend: 0.02
      user_params:
        restarts.use_restarts: false
        restarts.use_soft_restarts: false
        restarts.auto_detect: false
        interpolation.precondition: true
        logging.save_diagnostic_info: true
  runtime:
    github_hard_limit_minutes: 360
    job_timeout_minutes: 270
    internal_soft_cutoff_minutes: 255
    shutdown_reserve_minutes: 15
    smoke_timeout_minutes: 90
    aggregate_timeout_minutes: 20
    standard_expected_optimizer_jobs: 15
    expanded_expected_optimizer_jobs: 27
    runtime_basis: Q005 V14 EDE historical successful runs ~108–162 minutes; external
      full chains add substantial uncertainty.
    expected_single_optimizer_minutes:
    - 120
    - 255
    runtime_uncertainty: HIGH
    strategy: CHAIN_X_PROFILE_MODE_X_INDEPENDENT_START
    checkpointing: false
    checkpoint_reason: Cobaya/Py-BOBYQA state is not reliably serializable in the
      frozen stack. Each start is an atomic optimizer task. The workflow uses an internal
      soft cutoff, preserves any finite minimum written before interruption, and reruns
      only the failed independent task. This is harvest/retry, not fake optimizer
      resume.
