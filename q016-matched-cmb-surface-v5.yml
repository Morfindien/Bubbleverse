name: Bubbleverse Q016 Matched CMB Surface V5

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CURRENT_Q: Q016
  RUN_ID: Q016-MATCHED-CMB-SURFACE-V5
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Static Q016 V5 continuation gates
        run: |
          set -euo pipefail
          bash -n q016_setup_v5.sh
          bash -n q016_act_asset_v5.sh
          python -m py_compile q016_branch_runner_v5.py q016_aggregate_v5.py q016_result_tests_v5.py
          python - <<'PY'
          import json,yaml
          c=yaml.safe_load(open("q016_matched_cmb_surface_v5_config.yml"))
          p=json.load(open("q016_parent_v4_lock_v5.json"))
          assert c["project"]["q"]=="Q016"
          assert c["project"]["run_id"]=="Q016-MATCHED-CMB-SURFACE-V5"
          assert c["model"]["n_scf"]==3
          assert c["model"]["backend_commit"]=="5a131c91d657dd9a7c6364cc45b038710f8d0d97"
          assert c["surface"]["primary"]["observables"]==["TT","TE","EE"]
          assert [c["surface"]["primary"]["ell_min"],c["surface"]["primary"]["ell_max"]]==[600,2000]
          assert c["surface"]["primary"]["low_z_data"]==[]
          assert c["model"]["q011_exact_vector_as_external_endpoint"] is False
          assert p["parent"]["github_run_id"]==33693382859
          assert p["parent"]["head_sha"]=="596ee68677784deb4c28d1eb5992faf6dcd2c5b1"
          assert p["reuse_rules"]["minimum_distinct_complete_restarts_per_branch_mode"]==4
          print("Q016_V5_STATIC_PREFLIGHT=PASS")
          PY

  prepare_parent:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify authoritative V4 parent run and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33693382859" > /tmp/q016_v4_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33693382859/artifacts?per_page=100" > /tmp/q016_v4_artifacts.json
          python - <<'PY'
          import json
          lock=json.load(open("q016_parent_v4_lock_v5.json"))
          run=json.load(open("/tmp/q016_v4_run.json"))
          arts=json.load(open("/tmp/q016_v4_artifacts.json"))["artifacts"]
          assert int(run["id"])==lock["parent"]["github_run_id"]
          assert run["head_sha"]==lock["parent"]["head_sha"]
          assert run["path"]==lock["parent"]["workflow_path"]
          names={a["name"] for a in arts}
          required_artifact_names={
            x[:-5].replace("_","-",1) for x in []
          }
          # Explicitly require every scientific shard artifact name expected from V4.
          expected=[]
          for branch in ("planck","spt","act"):
            for mode in ("reference_free_h0","fixed_h0_71p5"):
              for r in range(4):
                expected.append(f"q016-v4-{branch}-{mode}-r{r}")
          missing=sorted(set(expected)-names)
          assert not missing,missing
          pm=[a for a in arts if a["name"]=="q016-primary-merged-v4"]
          assert len(pm)==1
          assert int(pm[0]["id"])==9878843407
          assert pm[0].get("digest")=="sha256:739913a517977f1f60bcfed2c4999f2ce5237167e67111c2f2a6aad728cfe305"
          out={
            "q":"Q016","gate":"PARENT_V4_PROVENANCE_GATE","pass":True,
            "parent_run_id":run["id"],"parent_head_sha":run["head_sha"],
            "artifact_count":len(arts),"expected_shard_artifacts":len(expected)
          }
          open("q016_parent_v4_runtime_gate_v5.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: q016-v5-parent-provenance
          path: q016_parent_v4_runtime_gate_v5.json
          retention-days: 30

  act_assets:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Fetch ACT DR6 CMB-only data once
        run: bash q016_act_asset_v5.sh q016_act_asset_v5
      - uses: actions/upload-artifact@v5
        with:
          name: q016-v5-act-dr6-data
          path: q016_act_asset_v5
          if-no-files-found: error
          retention-days: 30

  repair_act:
    needs: [preflight, prepare_parent, act_assets]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - mode: reference_free_h0
            restart: 1
          - mode: fixed_h0_71p5
            restart: 1
          - mode: reference_free_h0
            restart: 4
          - mode: fixed_h0_71p5
            restart: 4
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: q016-v5-act-dr6-data
          path: q016_act_asset_download
      - name: Preseed exact ACT likelihood data
        run: |
          set -euo pipefail
          SRC="$(find q016_act_asset_download -type f -name dr6_data_cmbonly.fits -print -quit)"
          test -n "$SRC"
          DST="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0/dr6_data_cmbonly.fits"
          mkdir -p "$(dirname "$DST")"
          cp "$SRC" "$DST"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ["COBAYA_PACKAGES_PATH"])/"data/ACTDR6CMBonly/v1.0/dr6_data_cmbonly.fits"
          assert p.read_bytes()[:80].startswith(b"SIMPLE")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          print("Q016_ACT_SHARED_ASSET_GATE=PASS",p.stat().st_size,h)
          PY
      - name: Build ACT branch environment
        run: bash q016_setup_v5.sh act
      - name: Execute ACT repair/redundant rescue
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q016_results
          OUT="q016_results/act_${{ matrix.mode }}_r${{ matrix.restart }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 315m python q016_branch_runner_v5.py \
            --branch act --mode "${{ matrix.mode }}" --restart "${{ matrix.restart }}" --output "$OUT"
          RC=$?
          set -e
          if [[ ! -f "$OUT" ]]; then
            python - "$OUT" "$RC" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            "q":"Q016","run_id":"Q016-MATCHED-CMB-SURFACE-V5",
            "result_id":"R-Q016-EDE-MATCHED-CMB-SURFACE-005",
            "status":"TECHNICAL_FAILURE","failure_class":"HPC_OR_TIMEOUT",
            "exit_code":int(sys.argv[2]),"scientific_model_failure":False
          },indent=2,sort_keys=True)+"\n")
          PY
          fi
          exit "$RC"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-v5-act-${{ matrix.mode }}-r${{ matrix.restart }}
          path: |
            q016_results/*.json
            q016_v5_source_runtime/*.json
          if-no-files-found: warn
          retention-days: 30

  repair_spt:
    needs: [preflight, prepare_parent]
    strategy:
      fail-fast: false
      matrix:
        restart: [4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Build SPT branch environment
        run: bash q016_setup_v5.sh spt
      - name: Execute SPT independent rescue start
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q016_results
          OUT="q016_results/spt_fixed_h0_71p5_r${{ matrix.restart }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 315m python q016_branch_runner_v5.py \
            --branch spt --mode fixed_h0_71p5 --restart "${{ matrix.restart }}" --output "$OUT"
          RC=$?
          set -e
          if [[ ! -f "$OUT" ]]; then
            python - "$OUT" "$RC" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            "q":"Q016","run_id":"Q016-MATCHED-CMB-SURFACE-V5",
            "result_id":"R-Q016-EDE-MATCHED-CMB-SURFACE-005",
            "status":"TECHNICAL_FAILURE","failure_class":"HPC_OR_TIMEOUT",
            "exit_code":int(sys.argv[2]),"scientific_model_failure":False
          },indent=2,sort_keys=True)+"\n")
          PY
          fi
          exit "$RC"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-v5-spt-fixed_h0_71p5-r${{ matrix.restart }}
          path: |
            q016_results/*.json
            q016_v5_source_runtime/*.json
          if-no-files-found: warn
          retention-days: 30

  merge_primary:
    needs: [prepare_parent, repair_act, repair_spt]
    if: ${{ always() && needs.prepare_parent.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - name: Download all V4 parent shards
        uses: actions/download-artifact@v5
        with:
          pattern: q016-v4-*
          path: q016_parent_v4
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33693382859
      - name: Download V5 repair shards
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: q016-v5-*
          path: q016_repairs_v5
          merge-multiple: true
      - name: Assemble continuation records
        run: |
          set -euo pipefail
          mkdir -p q016_results
          for B in planck spt act; do
            find q016_parent_v4 -type f -name "${B}_*.json" -exec cp {} q016_results/ \;
            find q016_repairs_v5 -type f -name "${B}_*.json" -exec cp {} q016_results/ \;
          done
          echo "CONTINUATION_INPUTS:"
          find q016_results -maxdepth 1 -type f -name '*.json' -printf '%f\n' | sort
      - name: Merge V4 completed shards plus V5 repair shards
        run: python q016_aggregate_v5.py --input-dir q016_results --output q016_primary_merged_v5.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-primary-merged-v5
          path: q016_primary_merged_v5.json
          if-no-files-found: warn
          retention-days: 30

  final_gates:
    needs: merge_primary
    if: ${{ always() && needs.merge_primary.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: q016-primary-merged-v5
      - name: Run primary endpoint gates
        shell: bash
        run: |
          if [[ ! -f q016_primary_merged_v5.json ]]; then
            echo "Q016_PRIMARY_MERGE_GATE=FAIL"
            exit 2
          fi
          set +e
          python q016_result_tests_v5.py \
            --config q016_matched_cmb_surface_v5_config.yml \
            --merged q016_primary_merged_v5.json \
            --output q016_result_tests_v5.json
          RC=$?
          cat q016_result_tests_v5.json
          exit "$RC"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-final-gates-v5
          path: q016_result_tests_v5.json
          if-no-files-found: warn
          retention-days: 30
