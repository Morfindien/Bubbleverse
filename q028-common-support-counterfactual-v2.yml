name: Bubbleverse Q028 common-support counterfactual V2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CURRENT_Q: Q028
  RUN_ID: Q028-FULLMF-COMMON-SUPPORT-COUNTERFACTUAL-V2
  RESULT_ID: R-Q028-EDE-FULLMF-COMMON-SUPPORT-COUNTERFACTUAL-002
  Q021_RAW_RUN_ID: '33882434170'
  Q022_RUN_ID: '33902262660'
  Q025_RUN_ID: '33918779905'
  Q026_RUN_ID: '33921255497'

jobs:
  q028:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cobaya
            external
          key: q028-v2-${{ runner.os }}-${{ hashFiles('q019_setup_v3.sh','q025_fullmf_component_attribution_v2.py','q017_planck_direction_localization_v1.py','q028_common_support_counterfactual_v2.py') }}

      - name: Static continuity and syntax gates
        run: |
          python -m pip install --disable-pip-version-check PyYAML numpy
          python -m py_compile q028_common_support_counterfactual_v2.py q028_tests_v2.py
          python - <<'PY'
          import yaml
          c=yaml.safe_load(open('q028_common_support_counterfactual_v2_config.yml',encoding='utf-8'))
          assert c['project']['q']=='Q028'
          assert c['model']['backend_commit']=='5a131c91d657dd9a7c6364cc45b038710f8d0d97'
          assert c['likelihood']['full_mf']=='planck_NPIPE_highl_CamSpec.TTTEEE'
          assert c['execution']['total_expected_likelihood_evaluations']==36
          assert c['rules']['no_optimization'] is True
          assert c['rules']['no_q024_permutation_rerun'] is True
          assert c['rules']['do_not_use_precision_principal_submatrix_as_marginal'] is True
          assert c['rules']['sha256_is_provenance_not_scientific_equivalence'] is True
          assert c['rules']['quantify_edge_precision_before_negative_identifiability'] is True
          print('CONTEXT_CONTINUITY_GATE=PASS')
          print('Q_IDENTITY_GATE=PASS')
          PY

      - name: Reuse frozen full-MF environment
        run: bash q019_setup_v3.sh

      - name: Download authoritative Q022 stage1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q022_RUN_ID }}
          pattern: q022-v2-stage1-m*-s*
          merge-multiple: true
          path: q022_inputs/stage1

      - name: Download authoritative Q022 refinement
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q022_RUN_ID }}
          pattern: q022-v2-refine-m*-s*
          merge-multiple: true
          path: q022_inputs/refinement

      - name: Download authoritative Q022 final
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q022_RUN_ID }}
          name: q022-final-v2
          path: q022_inputs/final

      - name: Download exact Q021 primordial lineages
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q021_RAW_RUN_ID }}
          pattern: q021-full_mf-m*-r*
          merge-multiple: true
          path: q021_inputs

      - name: Download Q025 V2 parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q025_RUN_ID }}
          name: q025-final-v2
          path: q025_parent

      - name: Download Q026 parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q026_RUN_ID }}
          name: q026-final-v1
          path: q026_parent

      - name: Resolve and download latest successful Q027 validated parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Q027_RUN_ID="$(gh run list \
            --workflow q027-residual-covariance-bridge-v1.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$Q027_RUN_ID"
          echo "Q027_RUN_ID=$Q027_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p q027_parent
          gh run download "$Q027_RUN_ID" -n q027-final-v1 -D q027_parent

      - name: Parent gates
        run: |
          python - <<'PY'
          import json
          p25=json.load(open('q025_parent/q025_final_v2.json',encoding='utf-8'))
          p26=json.load(open('q026_parent/q026_final_v1.json',encoding='utf-8'))
          p27=json.load(open('q027_parent/q027_final_v1.json',encoding='utf-8'))
          assert p25['result_id']=='R-Q025-EDE-FULLMF-BASIN-COMPONENT-ATTRIBUTION-002'
          assert p25['FINAL_RESULT_GATE']=='PASS'
          assert p26['result_id']=='R-Q026-EDE-FULLMF-MASK6-COUPLING-001'
          assert p26['FINAL_RESULT_GATE']=='PASS'
          assert p27['result_id']=='R-Q027-EDE-FULLMF-RESIDUAL-COVARIANCE-BRIDGE-001'
          assert p27['FINAL_RESULT_GATE']=='PASS'
          assert p27['cross_mask_summary']['spatial_localization']=='DISTRIBUTED_BEYOND_TT600_999_TRIAD'
          assert p27['cross_mask_summary']['within_mask_mechanism']=='RESIDUAL_CHANGE_UNDER_FIXED_INVERSE_COVARIANCE'
          print('PARENT_CHAIN_GATE=PASS')
          PY

      - name: Q028 V2 fixed-vector common-support counterfactual
        run: |
          python q028_common_support_counterfactual_v2.py \
            --config q028_common_support_counterfactual_v2_config.yml \
            --q021-dir q021_inputs \
            --q022-dir q022_inputs \
            --q025-result q025_parent/q025_final_v2.json \
            --q026-result q026_parent/q026_final_v1.json \
            --q027-result q027_parent/q027_final_v1.json \
            --output q028_merged_v2.json

      - name: Mandatory Q028 V2 result tests
        run: |
          python q028_tests_v2.py \
            --result q028_merged_v2.json \
            --output q028_tests_v2.json

      - name: Construct validated final result
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('q028_merged_v2.json',encoding='utf-8'))
          t=json.load(open('q028_tests_v2.json',encoding='utf-8'))
          r['tests_status']=t['tests_status']
          r['mandatory_test_gates']=t['gates']
          r['FINAL_RESULT_GATE']=t['FINAL_RESULT_GATE']
          r['github_q027_parent_run_id']=os.environ.get('Q027_RUN_ID')
          r['bubbleverse_execution_commit']=os.environ.get('GITHUB_SHA')
          r['github_actions_run_id']=os.environ.get('GITHUB_RUN_ID')
          r['github_runner_os']=os.environ.get('RUNNER_OS')
          r['github_runner_arch']=os.environ.get('RUNNER_ARCH')
          r['status']='PASS' if t['FINAL_RESULT_GATE']=='PASS' else 'FAIL'
          json.dump(r,open('q028_final_v2.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          open('q028_final_v2.json','a',encoding='utf-8').write('\n')
          if t['FINAL_RESULT_GATE']!='PASS':
              raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q028-final-v2
          path: |
            q028_merged_v2.json
            q028_tests_v2.json
            q028_final_v2.json
          if-no-files-found: warn
