project:
  id: Q-005-HPC-V14
  title: Bubbleverse Q-005 common-backend EDE differential gate
  q: Q-005
  scientific_status: "PROGRAM GENERATED \u2014 RESULTS NOT YET COMPUTED"
  execution_mode: GITHUB_MATRIX_COMMON_BACKEND
  claim: 'Apples-to-apples common-backend differential test. This is not an exact paper-native reproduction of K-036
    or K-038 until their executable provenance is separately frozen.

    '
q_memory:
  q_id: Q-005
  original_question: "Hvilke af de resterende systematiske og kosmologiske forklaringsklasser kan kvantitativt reducere\
    \ den robuste H0-sp\xE6nding, samtidig med at de forbliver forenelige med H0DN, CMB-SPA, DESI DR2 + BBN, den interne\
    \ late-Universe calibration structure og de fysisk alternative H0-routes?\n"
  unresolved_core: 'Determine whether the K-036 versus K-038 EDE discrepancy is driven by potential/parameterization,
    likelihood construction, priors/statistical treatment, or backend implementation.

    '
sources:
  K-024:
    short: H0 Distance Network
    H0: 73.5
    sigma_H0: 0.81
  K-029:
    short: DESI DR2 Results II
    arxiv: '2503.14738'
    benchmark_H0_LCDM_BBN: 68.51
    benchmark_sigma_H0_LCDM_BBN: 0.58
  K-030:
    short: CMB-SPA / SPT-3G D1 provenance
    arxiv: '2506.20707'
  K-036:
    short: Poulin et al. ACT DR6 + DESI DR2 EDE profile likelihood
    arxiv: '2505.08051'
    reference:
      n: 3
      fEDE: 0.09
      sigma_fEDE: 0.03
      H0: 71.0
      sigma_H0: 1.1
  K-038:
    short: Toda & Seto EDE and varying electron mass
    arxiv: '2508.09025'
    doi: 10.1088/1475-7516/2026/02/019
    reference_ede:
      n: 2
      H0: 69.17
      fEDE_upper: 0.014
    reference_me:
