technical_memory:
  V14_FIX1:
    date: '2026-08-28'
    failure_class: ENVIRONMENT / SOFTWARE COMPATIBILITY
    observed_error: 'classy.pyx:35:9: ''int_t'' is not a type identifier'
    cause: legacy class_ede Cython wrapper uses numpy np.int_t; NumPy 2.x removed/incompatibly changed the legacy
      alias surface
    fix:
    - pin NumPy 1.26.4
    - pin Cython 0.29.37 for legacy wrapper compatibility
    - build C core targets before controlled Python extension build
    scientific_effect: "NONE \u2014 build environment only; model, data, priors and likelihood definitions unchanged"
  V14_FIX3:
    date: '2026-08-28'
    failure_class: DEPENDENCY RESOLUTION / NUMPY ABI MUTATION
    observed_run: 33164445603
    observed_failure: ACT editable install selected SACC 2.4 and upgraded NumPy 1.26.4 to 2.2.6; classy then failed
      with numpy.dtype size changed
    fix:
    - pin sacc 1.0.2, satisfying ACT requirement sacc>=0.12.0 while remaining on NumPy 1.26.4
    - install frozen ACT repository editable with --no-deps
    - verify NumPy 1.26.4 and classy import immediately after ACT install
    scientific_effect: "NONE \u2014 dependency/ABI control only; science model, priors, data and likelihood definitions\
      \ unchanged"
