name: Bubbleverse Q005 HPC V1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight | smoke | lcdm | ede | ede_local | all"
        required: true
        default: "preflight"

jobs:
  q005:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
      BUBBLEVERSE_EXECUTION_MODE: "SERIAL_NO_MPI"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: q005_hpc_v8_requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v8_requirements.txt
          python - <<'PY'
          import importlib.metadata
          import pybobyqa
          version = importlib.metadata.version("Py-BOBYQA")
          print("Py-BOBYQA distribution:", version)
          print("pybobyqa module:", pybobyqa.__file__)
          assert version == "1.5.0"
          PY
          python - <<'PY'
          import importlib.util
          print("mpi4py installed:", importlib.util.find_spec("mpi4py") is not None)
          print("Bubbleverse execution mode: SERIAL_NO_MPI")
          PY

      - name: Checkout frozen mAxiCLASS
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external
          if [ ! -d external/mAxiCLASS/.git ]; then
            git clone https://github.com/marcobeIIa/mAxiCLASS.git external/mAxiCLASS
          fi
          git -C external/mAxiCLASS fetch --all --tags
          git -C external/mAxiCLASS checkout --detach b5a3af9818d04d2fe696e54972545e8c6805f4ea
          test "$(git -C external/mAxiCLASS rev-parse HEAD)" = "b5a3af9818d04d2fe696e54972545e8c6805f4ea"

      - name: Build frozen mAxiCLASS Python module
        shell: bash
        run: |
          set -euxo pipefail
          cd external/mAxiCLASS
          make -j2
          python - <<'PY'
          import Cython
          print("Cython:", Cython.__version__, Cython.__file__)
          PY
          python -m pip install --no-build-isolation -e ./python
          cd ../..
          export PYTHONPATH="$PWD/external/mAxiCLASS:$PWD/external/mAxiCLASS/python:${PYTHONPATH:-}"
          python - <<'PY'
          import classy
          print(classy.__file__)
          assert "external/mAxiCLASS" in classy.__file__.replace("\\", "/")
          PY

      - name: Checkout frozen ACT DR6-lite
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -d external/DR6-ACT-lite/.git ]; then
            git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git external/DR6-ACT-lite
          fi
          git -C external/DR6-ACT-lite fetch --all --tags
          git -C external/DR6-ACT-lite checkout --detach 0e0cd2c703c62a0e980470b572602233b27750e1
          test "$(git -C external/DR6-ACT-lite rev-parse HEAD)" = "0e0cd2c703c62a0e980470b572602233b27750e1"
          python -m pip install -e external/DR6-ACT-lite

      - name: Install ACT DR6 scientific likelihood data robustly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$COBAYA_PACKAGES_PATH"
          TARGET="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0/dr6_data_cmbonly.fits"
          mkdir -p "$(dirname "$TARGET")"

          install_ok=0

          echo "[INFO] Attempt 1: normal Cobaya installer"
          if cobaya-install act_dr6_cmbonly.ACTDR6CMBonly -p "$COBAYA_PACKAGES_PATH"; then
            if [ -s "$TARGET" ]; then
              echo "[INFO] Normal ACT installer succeeded and target data file exists"
              install_ok=1
            else
              echo "[WARNING] Cobaya installer returned success but target ACT file is missing"
            fi
          else
            echo "[WARNING] Normal ACT installer returned non-zero"
          fi

          if [ "$install_ok" -ne 1 ]; then
            echo "[INFO] Attempt 2: Cobaya installer with --debug"
            if cobaya-install act_dr6_cmbonly.ACTDR6CMBonly -p "$COBAYA_PACKAGES_PATH" --debug; then
              if [ -s "$TARGET" ]; then
                echo "[INFO] Debug ACT installer succeeded and target data file exists"
                install_ok=1
              else
                echo "[WARNING] Debug installer returned success but target ACT file is still missing"
              fi
            else
              echo "[WARNING] Debug ACT installer returned non-zero"
            fi
          fi

          if [ "$install_ok" -ne 1 ]; then
            echo "[WARNING] Cobaya did not materialize the required scientific ACT file."
            echo "[INFO] Searching packages path for any downloaded dr6_data_cmbonly.fits before network fallback."
            find "$COBAYA_PACKAGES_PATH" -type f -name 'dr6_data_cmbonly.fits' -print || true

            FOUND_EXISTING="$(find "$COBAYA_PACKAGES_PATH" -type f -name 'dr6_data_cmbonly.fits' -print -quit)"
            if [ -n "$FOUND_EXISTING" ] && [ -s "$FOUND_EXISTING" ]; then
              echo "[INFO] Found a Cobaya-installed ACT data file at: $FOUND_EXISTING"
              mkdir -p "$(dirname "$TARGET")"
              if [ "$FOUND_EXISTING" != "$TARGET" ]; then
                cp "$FOUND_EXISTING" "$TARGET"
              fi
              install_ok=1
            fi
          fi

          if [ "$install_ok" -ne 1 ]; then
            echo "[WARNING] Cobaya did not materialize ACT data; using official mirrors"
            TMPDIR_ACT="$(mktemp -d)"
            trap 'rm -rf "$TMPDIR_ACT"' EXIT
            ARCHIVE="$TMPDIR_ACT/dr6_data_cmbonly.tar.gz"
            export ARCHIVE

            python - <<'PY'
          import os, time, urllib.request
          out = os.environ["ARCHIVE"]
          urls = [
              "https://lambda.gsfc.nasa.gov/data/act/pspipe/sacc_files/dr6_data_cmbonly.tar.gz",
              "https://portal.nersc.gov/project/act/dr6_data/dr6_data_cmbonly.tar.gz",
          ]
          last = None
          ok = False
          for url in urls:
              for attempt in range(1, 4):
                  try:
                      print(f"[INFO] ACT download attempt {attempt} from {url}", flush=True)
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Bubbleverse-Q005-HPC-V8"},
                      )
                      with urllib.request.urlopen(req, timeout=180) as r, open(out, "wb") as f:
                          while True:
                              chunk = r.read(1024 * 1024)
                              if not chunk:
                                  break
                              f.write(chunk)
                      size = os.path.getsize(out)
                      print("[INFO] Downloaded bytes:", size, flush=True)
                      if size <= 0:
                          raise RuntimeError("Downloaded ACT archive is empty")
                      ok = True
                      break
                  except Exception as e:
                      last = e
                      print(f"[WARNING] {url} attempt {attempt} failed: {e!r}", flush=True)
                      if attempt < 3:
                          time.sleep(10 * attempt)
              if ok:
                  break
          if not ok:
              raise SystemExit(f"All official ACT mirrors failed: {last!r}")
          PY

            echo "[INFO] Archive listing:"
            tar -tzf "$ARCHIVE" | head -100
            tar -xzf "$ARCHIVE" -C "$TMPDIR_ACT"

            FOUND="$(find "$TMPDIR_ACT" -type f -name dr6_data_cmbonly.fits -print -quit)"
            if [ -z "$FOUND" ]; then
              echo "[ERROR] Official ACT archive did not contain dr6_data_cmbonly.fits" >&2
              exit 41
            fi
            cp "$FOUND" "$TARGET"
            install_ok=1
          fi

          if [ "$install_ok" -ne 1 ] || [ ! -s "$TARGET" ]; then
            echo "[ERROR] ACT DR6 scientific data installation failed final validation" >&2
            exit 42
          fi

          test -s "$TARGET"
          export TARGET
          python - <<'PY'
          import hashlib, os
          path = os.environ["TARGET"]
          h = hashlib.sha256()
          with open(path, "rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                  h.update(chunk)
          print("[VALIDATION] ACT_DR6_FILE =", path)
          print("[VALIDATION] ACT_DR6_BYTES =", os.path.getsize(path))
          print("[VALIDATION] ACT_DR6_SHA256 =", h.hexdigest())
          with open(path, "rb") as f:
              head = f.read(80)
          if not head.startswith(b"SIMPLE"):
              raise SystemExit("ACT DR6 file does not look like a FITS file (missing SIMPLE header)")
          print("[VALIDATION] ACT_DR6_FITS_HEADER = PASS")
          PY

      - name: Install remaining likelihood data
        shell: bash
        run: |
          set -euxo pipefail
          cobaya-install planck_2018_lowl.EE_sroll2 -p "$COBAYA_PACKAGES_PATH"
          cobaya-install bao.desi_dr2 -p "$COBAYA_PACKAGES_PATH"

      - name: Preflight
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="$PWD/external/mAxiCLASS:$PWD/external/mAxiCLASS/python:${PYTHONPATH:-}"
          python q005_hpc_v8.py preflight

      - name: Validate frozen ACT likelihood interface
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'class ACTDR6CMBonly' external/DR6-ACT-lite/act_dr6_cmbonly/act_dr6_cmbonly.py
          grep -q 'A_act' external/DR6-ACT-lite/yamls/likelihoods/act_lite.yaml
          grep -q 'P_act' external/DR6-ACT-lite/yamls/likelihoods/act_lite.yaml
          grep -q 'logA' external/DR6-ACT-lite/yamls/parameters/cosmology.yaml

      - name: Execute selected mode
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="$PWD/external/mAxiCLASS:$PWD/external/mAxiCLASS/python:${PYTHONPATH:-}"
          MODE="${{ inputs.mode }}"
          case "$MODE" in
            preflight)
              ;;
            smoke)
              if ! python q005_hpc_v8.py smoke --model all; then
                echo "[ERROR] Smoke run failed; dumping all smoke logs"
                for f in q005_logs/*smoke*.log; do
                  [ -f "$f" ] || continue
                  echo "===== $f ====="
                  cat "$f"
                done
                exit 1
              fi
              ;;
            lcdm|ede|ede_local)
              python q005_hpc_v8.py run --model "$MODE"
              ;;
            all)
              python q005_hpc_v8.py all
              python q005_validate_v8.py
              ;;
            *)
              echo "Unknown mode: $MODE" >&2
              exit 64
              ;;
          esac

      - name: Collect partial results
        if: always()
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$PWD/external/mAxiCLASS:$PWD/external/mAxiCLASS/python:${PYTHONPATH:-}"
          python q005_hpc_v8.py collect
          python q005_validate_v8.py
          find q005_results q005_logs q005_rendered -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q005-hpc-v8-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            q005_results/
            q005_logs/
            q005_rendered/
          if-no-files-found: warn
          retention-days: 30
