    masks: [3, 6, 7]
    seed_restarts: [0, 1, 2]
  source_semantics: >-
    Q022 mask/restart labels are provenance labels for mapped starts only.
    They are NOT asserted to be HiLLiPoP mask equivalents.
  mapped_start_parameters:
    [omega_b, omega_cdm, tau_reio, n_s, logA, fEDE, log10z_c, thetai_scf, H0, A_planck]
  unmapped_native_nuisance_start: HILLIPOP_NATIVE_REFERENCE
  stage1:
    max_evals: 200000
    rhoend: 1.0e-4
  refinement:
    max_evals: 300000
    rhoend: 1.0e-5

pre_registered_geometry:
  scale_lock_source: Q022_AUTHORITATIVE_ENDPOINTS_ONLY_PRE_DECISIVE
  q022_style_scale_floor_fraction: 1.0e-8
  collapse_objective_tolerance: 0.50
  collapse_common_endpoint_rms: 0.10
  stable_basin_minimum_supporting_starts: 2
  refine_unless_single_cluster_covers_all_starts: true
  representative_pair_rule: >-
    Among stable basin representatives, choose the pair with maximum locked
    common-parameter normalized RMS; break ties by lower summed objective,
    then lexicographic source labels.
  near_degenerate_objective_tolerance: 0.50
  compensation_common_rms_threshold: 0.10
  compensation_native_nuisance_rms_threshold: 0.10

primordial_test:
  coordinates: [n_s, logA, tau_reio]
  vertices: 8
  restarts_per_vertex: 3
  restart_semantics: [REPRESENTATIVE_A, REPRESENTATIVE_B, MIDPOINT]
  max_evals: 200000
  rhoend: 1.0e-4
  restart_objective_spread_max: 0.50
  dominant_abs_mobius_fraction_threshold: 0.50
  closure_abs_tolerance: 1.0e-8
  required_structure_for_portability: DISTRIBUTED
  n_s_single_localization_forbidden: true

direction_test:
  minimum_stable_basins_for_test: 3
  sign_invariant: true
  pairwise_abs_cosine_floor: 0.60
  minimum_pairwise_passes: 2
  median_abs_cosine_threshold: 0.70
  universal_direction_required_for_failure: true
  interpretation: >-
    If fewer than three stable independent basins exist, this criterion is
    NOT_TESTABLE rather than automatically passed or failed.

coupling_test:
  coordinates: [omega_cdm, A_planck]
  vertices: 4
  restarts_per_vertex: 3
  restart_objective_spread_max: 0.50
  closure_abs_tolerance: 1.0e-8
  inherited_numerical_resolution_floor: 2.0e-4
  gate_role: SUPPORTING_NOT_CORE
  causal_interpretation_forbidden: true

residual_covariance_support_test:
  component: planck_2020_hillipop.TTTEEE
  exact_pair_target: [143x217, 217x217]
  multipole_target: [1500, 2000]
  legacy_lowell_check_band: [600, 999]
  exact_pair_preserving_algebra: true
  causal_partition_forbidden: true
  gate_role: SUPPORTING_NOT_CORE

execution:
  python: '3.11'
  optimizer: cobaya_minimize_bobyqa
  github_runner: ubuntu-24.04
  github_job_timeout_minutes: 330
  soft_stop_minutes: 300
  max_parallel: 6
  checkpointing: false
  reason_no_checkpointing: >-
    Each optimizer restart is an atomic independent work unit. Failed work units
    are rerun individually; no stateful chain is split mid-optimizer.
  merge_required: true

