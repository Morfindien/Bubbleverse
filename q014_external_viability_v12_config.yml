execution_notes:
- 'V5: candl 2.0.3 is distributed on PyPI as candl-like; Python import module remains candl.'
repair_notes:
- 'V5: V4 reached SPT likelihood initialization but Cobaya rejected the model because SPTlite requires chain-native Ecal (and
  Tcal). V5 adds official Tcal/Ecal bounds from the pinned SPT3G_D1_TnE lite Cobaya YAML, retains the official Gaussian Tcal
  constraint N(1,0.0036^2), leaves Ecal without an extra Gaussian constraint, and profiles both calibration parameters in
  every SPT mode.'
- 'V8: V6 completed all 27 jobs but mandatory validation correctly failed. Audit showed the cross-mode objective was not comparable:
  2*minuslogpost contains a normalized flat H0-prior constant in free-H0 mode that disappears when H0 is fixed. V8 reports
  scalar total likelihood chi2 plus normalization-free Gaussian calibration constraint shapes, and cross-seeds deterministic
  refinements from the V6 best free/fixed minima.'
- 'V8: V7 failed before any parent download or scientific compute because q014_setup_v7.sh was absent from the repository
  root while the prepare gate explicitly required it. The three frozen V5 SHA256 values in the V7 workflow were correct and
  the V5 scientific surface did not drift. V8 restores the required versioned setup wrapper, upgrades the freeze gate to authoritative
  Git blob identity (HEAD:path plus worktree git hash-object) with explicit expected/repository/worktree diagnostics, and
  suppresses the aggregate job when prepare itself fails so one precompute failure does not generate a second artifact-not-found
