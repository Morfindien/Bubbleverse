    expanded_expected_optimizer_jobs: 39
    runtime_basis: V11 completed 30/30 jobs; V12 adds only corrected fixed-parent H0 embedding and same-run fixed replication.
    expected_single_optimizer_minutes:
    - 120
    - 255
    runtime_uncertainty: HIGH
    strategy: V11_PARENT_PHASE1_REFINEMENT_PLUS_CORRECTED_SAME_RUN_FIXED_TO_FREE_AND_FIXED_REPLICATION_PHASE2
    checkpointing: false
    checkpoint_reason: Cobaya/Py-BOBYQA state is not reliably serializable in the frozen stack. Each start is an atomic optimizer
      task. The workflow uses an internal soft cutoff, preserves any finite minimum written before interruption, and reruns
      only the failed independent task. This is harvest/retry, not fake optimizer resume.
  v10_seed_policy:
    reference_free_h0:
    - V8 free best
    - bounded jitter around V8 free best
    - V8 fixed best with H0 released
    - bounded jitter around released V8 fixed best
    fixed_h0_71p5:
    - V8 fixed best
    - bounded jitter around V8 fixed best
    - V8 free best projected to H0=71.5
    - bounded jitter around projected V8 free best
    reference_is_scalar: true
    best_evaluated_seed_is_preserved: true
    seed_objective_tolerance: 0.05
    jitter_semantics: Small deterministic bounded perturbations of start points only; priors, likelihoods, objective and parameter
      bounds are unchanged.
    multistart_threshold_unchanged: 1.0
    legacy_start_family_compatibility_repair: Delegate non-V8 continuation start families unchanged to frozen V5 start_vector;
      required because inherited V5 smoke uses start_family=external.
  phase1_start_families:
    reference_free_h0: *id001
    fixed_h0_71p5: *id002
    q011_shared_physics: *id003
  phase2_start_families:
    reference_free_h0:
    - p1_free_best
    - p1_free_jitter
    - p1_fixed_best
    - p1_fixed_jitter
    fixed_h0_71p5:
    - p1_fixed_best
    - p1_fixed_jitter
    - p1_free_best
    q011_shared_physics: []
  phase2_minimizer:
    max_evals: 1600
    rhoend: 0.001
  v12_same_run_policy:
    phase1: '18 jobs: per chain 2 free continuations + 3 fixed continuations + 1 Q011-shared profile, all seeded from V11
      best minima.'
    phase2: '21 jobs: per chain 4 free-H0 certifications from same-run Phase1 free/fixed minima plus 3 fixed-H0 replications
      from same-run Phase1 fixed/free minima.'
    fixed_parent_h0_override: UNCONDITIONAL_H0_EQUALS_71P5_BEFORE_ANY_FIXED_PARENT_EMBEDDING_OR_JITTER
    embedding_reference: Compare Phase2 p1_fixed_best seed objective to the exact Phase1 fixed source objective, not a later
