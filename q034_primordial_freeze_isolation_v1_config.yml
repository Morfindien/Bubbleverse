stop_condition: >-
  Stop Q034 when the Q032 sampled control has passed identity reuse gates, all required frozen-arm jobs
  are complete, the unchanged basin classifier has been applied, the result is classified as either
  PRIMORDIAL_FREEZE_SUFFICIENT_WITHIN_MATCHED_Q034 or PRIMORDIAL_FREEZE_ALONE_NOT_SUFFICIENT, final
