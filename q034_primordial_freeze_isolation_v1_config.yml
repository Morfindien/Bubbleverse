scientific_decisions:
  sufficient:
    condition: SAMPLED_CONTROL_NONSTABLE_AND_FROZEN_ARM_STABLE
    classification: PRIMORDIAL_FREEZE_SUFFICIENT_WITHIN_MATCHED_Q034
    interpretation: >-
      Frozen versus sampled status of n_s/logA/tau_reio is sufficient to reproduce the central
      stable-versus-non-stable classification difference within the matched Q034 protocol. This does
      not require identical endpoint coordinates or identical full internal basin geometry to Q022.
  not_sufficient:
    condition: SAMPLED_CONTROL_NONSTABLE_AND_FROZEN_ARM_NONSTABLE
    classification: PRIMORDIAL_FREEZE_ALONE_NOT_SUFFICIENT
    interpretation: >-
      D-Q033-REMAINING-001 is falsified as a full explanation. The next Motor 14 may register only the
      next smallest documented implementation difference; no open-ended implementation sweep is allowed.

rules:
  reuse_q032_sampled_control_if_identity_passes: true
  full_native_only: true
  scalar_refs_only: true
  freeze_only_primordial_block: true
  no_new_seed_family: true
  no_threshold_change: true
  no_q032_sector_rerun: true
