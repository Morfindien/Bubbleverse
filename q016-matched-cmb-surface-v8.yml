name: Bubbleverse Q016 Matched CMB Surface V8

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: q016-matched-cmb-surface-v8-${{ github.ref }}
  cancel-in-progress: false

env:
  CURRENT_Q: Q016
  RUN_ID: Q016-MATCHED-CMB-SURFACE-V8
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v8
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - name: Git-blob reuse gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:q014_external_viability_v10.py)" = "9085bdea8e5732b5e4c7095068d284918157948d"
          test "$(git hash-object q014_external_viability_v10.py)" = "9085bdea8e5732b5e4c7095068d284918157948d"
          test "$(git rev-parse HEAD:q014_external_viability_v12.py)" = "d2c8ba19aed63d8e1b17a0ef4e18e2dd6981a599"
          test "$(git hash-object q014_external_viability_v12.py)" = "d2c8ba19aed63d8e1b17a0ef4e18e2dd6981a599"
          echo "Q016_V8_Q014_REUSE_BLOB_GATE=PASS"
      - name: Static V8 tests
        run: |
          set -euo pipefail
          bash -n q016_setup_v8.sh
          bash -n q016_act_asset_v8.sh
          python -m py_compile q016_objective_reprofile_v8.py q016_aggregate_v8.py q016_tests_v8.py
          python q016_tests_v8.py static --output q016_static_tests_v8.json
      - name: Cobaya exact-objective runtime toy test
        run: python q016_tests_v8.py runtime --output q016_runtime_objective_test_v8.json
      - name: Verify V6 parent artifact and seed lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33732688762" > /tmp/q016_v6_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33732688762/artifacts?per_page=100" > /tmp/q016_v6_artifacts.json
          mkdir -p q016_parent_v6
          gh run download "33732688762" --name q016-primary-merged-v6 --dir q016_parent_v6
          python - <<'PY'
          import json,math
          run=json.load(open('/tmp/q016_v6_run.json'))
          assert run['head_sha']=='d14880138ebb537173e49417b537a68454d53602'
          arts=json.load(open('/tmp/q016_v6_artifacts.json'))['artifacts']
          a=[x for x in arts if x['name']=='q016-primary-merged-v6']
          assert len(a)==1 and int(a[0]['id'])==9888806606
          assert a[0]['digest']=='sha256:6fb8ff7693c955516bf3a1a0e0c066876aa39c1f377d720b8b7bf6ed8a0f6aab'
          p='q016_parent_v6/q016_primary_merged_v6.json'
          d=json.load(open(p)); lock=json.load(open('q016_v6_objective_seed_lock_v8.json'))
          assert d['q']=='Q016' and d['run_id']=='Q016-MATCHED-CMB-SURFACE-V6'
          def obj(branch,row):
              x=float(row['chi2'])+((float(row['tau_reio'])-.051)/.006)**2
              if branch=='planck':
                  x+=((float(row['A_planck'])-1)/.0025)**2
                  x+=((float(row['calTE'])-1)/.01)**2
                  x+=((float(row['calEE'])-1)/.01)**2
              if branch=='spt':x+=((float(row['Tcal'])-1)/.0036)**2
              return x
          for b in ('planck','spt','act'):
              for m in ('reference_free_h0','fixed_h0_71p5'):
                  vals=[(obj(b,r['minimum']),r) for r in d['branches'][b]['profiles'][m]['all']]
                  vals.sort(key=lambda z:z[0])
                  L=lock['profiles'][b][m]
                  assert abs(vals[0][0]-float(L['objective_best_from_v6_history']))<1e-9
                  assert vals[0][1]['run_id']==L['source_run_id']
                  assert int(vals[0][1]['restart'])==int(L['source_restart'])
          print('Q016_V8_V6_PARENT_SEED_LOCK_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: q016-v8-prepare
          path: |
            q016_static_tests_v8.json
            q016_runtime_objective_test_v8.json
            q016_parent_v6/q016_primary_merged_v6.json
            q016_v6_objective_seed_lock_v8.json
          retention-days: 30

  act_assets:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: bash q016_act_asset_v8.sh q016_act_asset_v8
      - uses: actions/upload-artifact@v5
        with:
          name: q016-v8-act-dr6-data
          path: q016_act_asset_v8
          if-no-files-found: error
          retention-days: 30

  phase1:
    needs: [prepare, act_assets]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {branch: planck, family: parent_fixed_best, restart: 0}
          - {branch: planck, family: parent_fixed_jitter_plus, restart: 1}
          - {branch: planck, family: parent_fixed_jitter_minus, restart: 2}
          - {branch: planck, family: parent_free_projected, restart: 3}
          - {branch: spt, family: parent_fixed_best, restart: 0}
          - {branch: spt, family: parent_fixed_jitter_plus, restart: 1}
          - {branch: spt, family: parent_fixed_jitter_minus, restart: 2}
          - {branch: spt, family: parent_free_projected, restart: 3}
          - {branch: act, family: parent_fixed_best, restart: 0}
          - {branch: act, family: parent_fixed_jitter_plus, restart: 1}
          - {branch: act, family: parent_fixed_jitter_minus, restart: 2}
          - {branch: act, family: parent_free_projected, restart: 3}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v8
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - uses: actions/download-artifact@v5
        if: ${{ matrix.branch == 'act' }}
        with:
          name: q016-v8-act-dr6-data
          path: q016_act_asset_download
      - name: Preseed ACT data
        if: ${{ matrix.branch == 'act' }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find q016_act_asset_download -type f -name dr6_data_cmbonly.fits -print -quit)"
          test -n "$SRC"
          DST="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0/dr6_data_cmbonly.fits"
          mkdir -p "$(dirname "$DST")"; cp "$SRC" "$DST"
      - name: Build branch environment
        run: bash q016_setup_v8.sh "${{ matrix.branch }}"
      - name: Run exact-objective fixed profile
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q016_v8_phase1
          OUT="q016_v8_phase1/${{ matrix.branch }}_fixed_h0_71p5_${{ matrix.family }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 315m python q016_objective_reprofile_v8.py \
            --branch "${{ matrix.branch }}" --mode fixed_h0_71p5 \
            --start-family "${{ matrix.family }}" --restart "${{ matrix.restart }}" --output "$OUT"
          RC=$?
          set -e
          exit "$RC"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-v8-p1-${{ matrix.branch }}-${{ matrix.family }}
          path: |
            q016_v8_phase1/*.json
            q016_v8_source_runtime/*.json
          if-no-files-found: warn
          retention-days: 30

  phase1_summary:
    needs: phase1
    if: ${{ always() && needs.phase1.result != 'skipped' && needs.phase1.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v8
        with: {python-version: "3.10"}
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: q016-v8-p1-*
          path: q016_v8_phase1_all
          merge-multiple: true
      - name: Aggregate fixed profiles
        run: |
          python q016_aggregate_v8.py fixed-summary \
            --input-dir q016_v8_phase1_all \
            --output q016_phase1_fixed_summary_v8.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-v8-phase1-fixed-summary
          path: q016_phase1_fixed_summary_v8.json
          if-no-files-found: warn
          retention-days: 30

  phase2:
    needs: [phase1_summary, act_assets]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {branch: planck, family: phase1_fixed_embed, restart: 10}
          - {branch: planck, family: phase1_fixed_embed_jitter_plus, restart: 11}
          - {branch: planck, family: phase1_fixed_embed_jitter_minus, restart: 12}
          - {branch: planck, family: parent_free_best, restart: 13}
          - {branch: spt, family: phase1_fixed_embed, restart: 10}
          - {branch: spt, family: phase1_fixed_embed_jitter_plus, restart: 11}
          - {branch: spt, family: phase1_fixed_embed_jitter_minus, restart: 12}
          - {branch: spt, family: parent_free_best, restart: 13}
          - {branch: act, family: phase1_fixed_embed, restart: 10}
          - {branch: act, family: phase1_fixed_embed_jitter_plus, restart: 11}
          - {branch: act, family: phase1_fixed_embed_jitter_minus, restart: 12}
          - {branch: act, family: parent_free_best, restart: 13}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v8
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: q016-v8-phase1-fixed-summary
          path: q016_phase1_context
      - uses: actions/download-artifact@v5
        if: ${{ matrix.branch == 'act' }}
        with:
          name: q016-v8-act-dr6-data
          path: q016_act_asset_download
      - name: Preseed ACT data
        if: ${{ matrix.branch == 'act' }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find q016_act_asset_download -type f -name dr6_data_cmbonly.fits -print -quit)"
          test -n "$SRC"
          DST="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0/dr6_data_cmbonly.fits"
          mkdir -p "$(dirname "$DST")"; cp "$SRC" "$DST"
      - name: Build branch environment
        run: bash q016_setup_v8.sh "${{ matrix.branch }}"
      - name: Run exact-objective free profile
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p q016_v8_phase2
          OUT="q016_v8_phase2/${{ matrix.branch }}_reference_free_h0_${{ matrix.family }}.json"
          set +e
          timeout --signal=INT --kill-after=10m 315m python q016_objective_reprofile_v8.py \
            --branch "${{ matrix.branch }}" --mode reference_free_h0 \
            --start-family "${{ matrix.family }}" --restart "${{ matrix.restart }}" \
            --phase1-summary q016_phase1_context/q016_phase1_fixed_summary_v8.json \
            --output "$OUT"
          RC=$?
          set -e
          exit "$RC"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-v8-p2-${{ matrix.branch }}-${{ matrix.family }}
          path: |
            q016_v8_phase2/*.json
            q016_v8_source_runtime/*.json
          if-no-files-found: warn
          retention-days: 30

  merge_primary:
    needs: [phase1_summary, phase2]
    if: ${{ always() && needs.phase1_summary.result == 'success' && needs.phase2.result != 'skipped' && needs.phase2.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v8
        with: {python-version: "3.10"}
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v5
        with:
          name: q016-v8-phase1-fixed-summary
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: q016-v8-p2-*
          path: q016_v8_phase2_all
          merge-multiple: true
      - name: Final exact-objective endpoint certification
        run: |
          python q016_aggregate_v8.py final \
            --input-dir q016_v8_phase2_all \
            --phase1-summary q016_phase1_fixed_summary_v8.json \
            --output q016_primary_merged_v8.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-primary-merged-v8
          path: q016_primary_merged_v8.json
          if-no-files-found: warn
          retention-days: 30

  primary_endpoint_gates:
    needs: merge_primary
    if: ${{ needs.merge_primary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v8
        with: {python-version: "3.10"}
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: q016-primary-merged-v8
      - name: Validate V8 primary result
        run: |
          test -f q016_primary_merged_v8.json
          python q016_tests_v8.py final \
            --result q016_primary_merged_v8.json \
            --output q016_primary_result_tests_v8.json
          cat q016_primary_result_tests_v8.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: q016-primary-gates-v8
          path: q016_primary_result_tests_v8.json
          if-no-files-found: warn
          retention-days: 30
