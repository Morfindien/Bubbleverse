name: Bubbleverse Q027 residual/covariance bridge V1

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CURRENT_Q: Q027
  RUN_ID: Q027-FULLMF-RESIDUAL-COVARIANCE-BRIDGE-V1
  RESULT_ID: R-Q027-EDE-FULLMF-RESIDUAL-COVARIANCE-BRIDGE-001
  Q021_RAW_RUN_ID: '33882434170'
  Q022_RUN_ID: '33902262660'
  Q025_RUN_ID: '33918779905'
  Q026_RUN_ID: '33921255497'

jobs:
  q027:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cobaya
            external
          key: q027-v1-${{ runner.os }}-${{ hashFiles('q019_setup_v3.sh','q025_fullmf_component_attribution_v2.py','q017_planck_direction_localization_v1.py','q015_cmb_attribution_v2.py') }}

      - name: Static continuity gates
        run: |
          python -m pip install --disable-pip-version-check PyYAML numpy
          python -m py_compile q027_residual_covariance_bridge_v1.py q027_tests_v1.py
          python - <<'PY'
          import yaml
          c=yaml.safe_load(open('q027_residual_covariance_bridge_v1_config.yml',encoding='utf-8'))
          assert c['project']['q']=='Q027'
          assert c['model']['backend_commit']=='5a131c91d657dd9a7c6364cc45b038710f8d0d97'
          assert c['likelihood']['full_mf']=='planck_NPIPE_highl_CamSpec.TTTEEE'
          assert c['execution']['total_expected_likelihood_evaluations']==36
          assert c['rules']['no_optimization'] is True
          assert c['rules']['no_q024_permutation_rerun'] is True
          print('CONTEXT_CONTINUITY_GATE=PASS')
          print('Q_IDENTITY_GATE=PASS')
          PY

      - name: Reuse frozen full-MF environment
        run: bash q019_setup_v3.sh

      - name: Download authoritative Q022 stage1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q022_RUN_ID }}
          pattern: q022-v2-stage1-m*-s*
          merge-multiple: true
          path: q022_inputs/stage1

      - name: Download authoritative Q022 refinement
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q022_RUN_ID }}
          pattern: q022-v2-refine-m*-s*
          merge-multiple: true
          path: q022_inputs/refinement

      - name: Download authoritative Q022 final decision package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q022_RUN_ID }}
          name: q022-final-v2
          path: q022_inputs/final

      - name: Download exact Q021 primordial lineages
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q021_RAW_RUN_ID }}
          pattern: q021-full_mf-m*-r*
          merge-multiple: true
          path: q021_inputs

      - name: Download validated Q025 final parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q025_RUN_ID }}
          name: q025-final-v2
          path: q025_parent

      - name: Download validated Q026 final parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q026_RUN_ID }}
          name: q026-final-v1
          path: q026_parent

      - name: Parent gates
        run: |
          python - <<'PY'
          import json
          p25=json.load(open('q025_parent/q025_final_v2.json',encoding='utf-8'))
          p26=json.load(open('q026_parent/q026_final_v1.json',encoding='utf-8'))
          assert p25['q']=='Q025'
          assert p25['result_id']=='R-Q025-EDE-FULLMF-BASIN-COMPONENT-ATTRIBUTION-002'
          assert p25['FINAL_RESULT_GATE']=='PASS'
          assert p26['q']=='Q026'
          assert p26['result_id']=='R-Q026-EDE-FULLMF-MASK6-COUPLING-001'
          assert p26['FINAL_RESULT_GATE']=='PASS'
          print('Q025_PARENT_GATE=PASS')
          print('Q026_PARENT_GATE=PASS')
          PY

      - name: Q027 fixed-vector residual/covariance bridge
        run: |
          python q027_residual_covariance_bridge_v1.py \
            --config q027_residual_covariance_bridge_v1_config.yml \
            --q021-dir q021_inputs \
            --q022-dir q022_inputs \
            --q025-result q025_parent/q025_final_v2.json \
            --q026-result q026_parent/q026_final_v1.json \
            --output q027_merged_v1.json

      - name: Mandatory Q027 result tests
        run: |
          python q027_tests_v1.py \
            --result q027_merged_v1.json \
            --output q027_tests_v1.json

      - name: Construct validated final result
        run: |
          python - <<'PY'
          import json
          r=json.load(open('q027_merged_v1.json',encoding='utf-8'))
          t=json.load(open('q027_tests_v1.json',encoding='utf-8'))
          r['tests_status']=t['tests_status']
          r['mandatory_test_gates']=t['gates']
          r['FINAL_RESULT_GATE']=t['FINAL_RESULT_GATE']
          r['status']='PASS' if t['FINAL_RESULT_GATE']=='PASS' else 'FAIL'
          json.dump(r,open('q027_final_v1.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          open('q027_final_v1.json','a',encoding='utf-8').write('\n')
          if t['FINAL_RESULT_GATE']!='PASS':
              raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q027-final-v1
          path: |
            q027_merged_v1.json
            q027_tests_v1.json
            q027_final_v1.json
          if-no-files-found: warn
