name: Bubbleverse Q009 ACT Corrected Minima Attribution V6

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: q009-act-corrected-minima-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-parents:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Acquire Q006 preserved Q005 baseline vector
        id: q006
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --workflow q006-likelihood-attribution-v1.yml \
            --status completed \
            --limit 30 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")] | first | .databaseId')"
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          mkdir -p q009_v6_parent/q006
          gh run download "$RUN_ID" \
            --name q006-likelihood-attribution-v1-final \
            --dir q009_v6_parent/q006
          test -f q009_v6_parent/q006/q006_likelihood_attribution_v1_result.json

          python - <<'PY'
          import json, math
          p="q009_v6_parent/q006/q006_likelihood_attribution_v1_result.json"
          d=json.load(open(p))
          assert d.get("q")=="Q-006", "Q006_PARENT_IDENTITY_GATE=FAIL"
          profiles=d.get("models",{}).get("ede_n3",{}).get("profiles",[])
          matches=[]
          for r in profiles:
              if not isinstance(r,dict):
                  continue
              h=r.get("target_h0")
              c=r.get("chi2_total",r.get("chi2_scientific_total"))
              if isinstance(h,(int,float)) and isinstance(c,(int,float)):
                  if math.isclose(float(h),70.853292,rel_tol=0,abs_tol=1e-6) and \
                     math.isclose(float(c),548.010401,rel_tol=0,abs_tol=1e-3) and \
                     isinstance(r.get("bestfit"),dict):
                      matches.append(r)
          assert len(matches)==1, f"Q006_PRESERVED_Q005_BASELINE_GATE=FAIL matches={len(matches)}"
          print("Q006_PRESERVED_Q005_BASELINE_GATE=PASS")
          PY

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Acquire latest successful Q007 V2 final result
        id: q007
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --workflow q007-act-observable-attribution-v2.yml \
            --status completed \
            --limit 30 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")] | first | .databaseId')"
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          mkdir -p q009_v6_parent/q007
          gh run download "$RUN_ID" \
            --name q007-act-observable-attribution-v1-final \
            --dir q009_v6_parent/q007
          test -f q009_v6_parent/q007/q007_act_observable_attribution_v1_result.json
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Acquire latest successful Q008 final result
        id: q008
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --workflow q008-globality-validation-v1.yml \
            --status completed \
            --limit 30 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")] | first | .databaseId')"
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          mkdir -p q009_v6_parent/q008
          gh run download "$RUN_ID" \
            --name q008-globality-validation-v1-final \
            --dir q009_v6_parent/q008
          test -f q009_v6_parent/q008/q008_globality_validation_v1_result.json
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Parent identity and schema gates
        run: |
          python - <<'PY'
          import json
          q6=json.load(open("q009_v6_parent/q006/q006_likelihood_attribution_v1_result.json"))
          q7=json.load(open("q009_v6_parent/q007/q007_act_observable_attribution_v1_result.json"))
          q8=json.load(open("q009_v6_parent/q008/q008_globality_validation_v1_result.json"))
          assert q6.get("q")=="Q-006", "Q006_PARENT_IDENTITY_GATE=FAIL"
          assert q7.get("q")=="Q-007", "Q007_PARENT_IDENTITY_GATE=FAIL"
          assert q8.get("q")=="Q-008", "Q008_PARENT_IDENTITY_GATE=FAIL"
          assert isinstance(q6.get("models",{}).get("ede_n3",{}).get("profiles"), list), "Q006_SCHEMA_GATE=FAIL"
          assert isinstance(q7.get("models",{}).get("ede_n3",{}).get("profiles"), list), "Q007_SCHEMA_GATE=FAIL"
          assert isinstance(q8.get("profile_targets"), dict), "Q008_SCHEMA_GATE=FAIL"
          print("Q009_V2_PARENT_GATES=PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: q009-v6-parent-results
          path: q009_v6_parent
          retention-days: 30

  point:
    needs: acquire-parents
    strategy:
      fail-fast: false
      matrix:
        include:
          - {h0: 71.5, tag: 71p5}
          - {h0: 72.5, tag: 72p5}
          - {h0: 73.5, tag: 73p5}

    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/external/cobaya_packages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: q005_hpc_v14_requirements.txt

      - name: Install frozen Q005 V14 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r q005_hpc_v14_requirements.txt

      - name: Build frozen Q005 V14 common backend
        run: bash q005_setup_v14.sh

      - uses: actions/download-artifact@v4
        with:
          name: q009-v6-parent-results
          path: q009_v6_parent

      - name: Q009 context and source preflight
        run: |
          python q009_act_corrected_minima_attribution_v6.py preflight \
            --q006 q009_v6_parent/q006/q006_likelihood_attribution_v1_result.json \
            --q008 q009_v6_parent/q008/q008_globality_validation_v1_result.json \
            --q007 q009_v6_parent/q007/q007_act_observable_attribution_v1_result.json

      - name: Fixed corrected-minimum ACT attribution
        run: |
          mkdir -p q009_v6_results
          python q009_act_corrected_minima_attribution_v6.py run \
            --q006 q009_v6_parent/q006/q006_likelihood_attribution_v1_result.json \
            --q008 q009_v6_parent/q008/q008_globality_validation_v1_result.json \
            --q007 q009_v6_parent/q007/q007_act_observable_attribution_v1_result.json \
            --target-h0 "${{ matrix.h0 }}" \
            --output "q009_v6_results/q009_v2_point_${{ matrix.tag }}.json"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: q009-v6-point-${{ matrix.tag }}
          path: q009_v6_results/q009_v2_point_${{ matrix.tag }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: ${{ always() }}
    needs: [acquire-parents, point]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: python -m pip install PyYAML==6.0.2 numpy==1.26.4

      - uses: actions/download-artifact@v4
        with:
          pattern: q009-v6-point-*
          path: q009_v6_aggregate/input

      - name: Aggregate Q009
        run: |
          python q009_act_corrected_minima_attribution_v6.py aggregate \
            --input q009_v6_aggregate/input \
            --output q009_v6_aggregate/q009_act_corrected_minima_attribution_v6_result.json

      - name: Final Q identity gate
        run: |
          python - <<'PY'
          import json
          p="q009_v6_aggregate/q009_act_corrected_minima_attribution_v6_result.json"
          d=json.load(open(p))
          assert d.get("q")=="Q-009", "Q_IDENTITY_GATE=FAIL"
          print("Q009_FINAL_RECORD_GATE", d.get("gates",{}).get("FINAL_RESULT_GATE"))
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: q009-act-corrected-minima-attribution-v6-final
          path: q009_v6_aggregate/q009_act_corrected_minima_attribution_v6_result.json
          retention-days: 90
