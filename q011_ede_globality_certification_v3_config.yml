# Bubbleverse Q011 V3 technical-gate semantics patch.
# All unspecified scientific content is inherited byte-for-meaning from V1.
v3_patch:
  inherits_config: q011_ede_globality_certification_v1_config.yml
  patch_scope:
    - fixed-H0 seed extraction
    - Stage-2 fixed-H0 endpoint extraction
    - q005_hpc_v14.cobaya_run interface
    - MAXFUN-aware deterministic pre-matrix technical gate
    - V3 paths, identities, and workflow provenance
  scientific_changes: NONE

project:
  q: Q011
  run_id: Q011-EDE-GLOBALITY-CERTIFICATION-V3
  result_id: R-Q011-EDE-GLOBALITY-CERTIFICATION-003
  title: Bubbleverse Q011 n=3 EDE fixed-H0 basin/globality certification V3

sources:
  - K-029
  - K-036
  - K-038
  - INTERNAL-Q005
  - INTERNAL-Q007
  - INTERNAL-Q008
  - INTERNAL-Q009
  - INTERNAL-Q010-V3
  - INTERNAL-Q011-V1

paths:
  results: q011_v3_results
  rendered: q011_v3_rendered
  aggregate: q011_v3_aggregate

technical_gate:
  target_h0: 71.5
  recovery_family: run21_best
  profile_index: 0
  max_evals: 24
  accept_q005_native_maxfun_after_objective_evaluation: true
  purpose: >-
    Technical fail-fast only. It must construct one Q008-best seed, construct one
    Q005 recovery seed, round-trip the rendered YAML, and invoke the frozen Q005 V14 Cobaya path through cobaya_run(path, cfg) before any
    128-job matrix launch. Exit 0 passes. A non-zero exit passes only when the
    Q005-native parser classifies it as OPTIMIZER_MAXFUN_EXHAUSTED and records
    at least one actual objective evaluation. It is not a scientific Q011 result.

runtime:
  check_date: 2026-08-30
  runner: ubuntu-24.04
  github_hosted_hard_limit_minutes: 360
  safe_job_target_minutes: 240
  optimizer_job_timeout_minutes: 240
  expected_stage1_jobs: 64
  expected_stage2_jobs: 64
  expected_total_optimizer_jobs: 128
  matrix_limit: 256
  strategy: PREMATRIX_TECHNICAL_GATE_THEN_TWO_STAGE_PARALLEL_EXPANDED_BASIN_SEARCH
  checkpointing: false
  reason_no_checkpoint: >-
    Each optimizer restart remains an atomic independent job. Stage 2 remains a
    new refinement from the exact Stage-1 endpoint and is not represented as a resume.
