project:
  q: Q-009
  run_id: Q009-ACT-CORRECTED-MINIMA-ATTRIBUTION-V1
  title: Bubbleverse Q-009 ACT DR6 attribution at corrected n=3 EDE minima
  scientific_question: >-
    At the corrected best-observed n=3 EDE fixed-H0 minima, which ACT DR6
    TT/TE/EE observables and multipole regions dominate residual likelihood
    cost, and does Q-007's TE/intermediate-ell attribution persist?
  execution_mode: MOTOR_PLUS_HPC_TARGETED_ATTRIBUTION

parent:
  repository: Morfindien/Bubbleverse
  repo_inspection_commit: a8d11cc9687e5df757f4794224d83ed34df03846
  base_q: Q-005
  base_engine: q005_hpc_v14.py
  base_config: q005_hpc_v14_config.yml
  setup: q005_setup_v14.sh
  requirements: q005_hpc_v14_requirements.txt
  q007_q: Q-007
  q007_engine: q007_act_observable_attribution_v2.py
  q007_workflow: q007-act-observable-attribution-v2.yml
  q007_final_artifact: q007-act-observable-attribution-v1-final
  q007_final_filename: q007_act_observable_attribution_v1_result.json
  q008_q: Q-008
  q008_workflow: q008-globality-validation-v1.yml
  q008_final_artifact: q008-globality-validation-v1-final
  q008_final_filename: q008_globality_validation_v1_result.json
  act_dr6_lite_commit: 0e0cd2c703c62a0e980470b572602233b27750e1

sources:
  - K-029
  - K-036
  - K-037
  - K-038
  - K-045
  - INTERNAL-Q005
  - INTERNAL-Q006
  - INTERNAL-Q007
  - INTERNAL-Q008

historical_baseline:
  h0: 70.853292
  q005_best_known_chi2: 548.010401
  q008_same_h0_chi2_do_not_promote: 548.321909

targets: [71.5, 72.5, 73.5]

bands:
  - {name: ACT_LOW,  ell_min: 600,  ell_max: 1499.999}
  - {name: ACT_MID,  ell_min: 1500, ell_max: 2999.999}
  - {name: ACT_HIGH, ell_min: 3000, ell_max: 8500}

topology_test:
  q007_expected_dominant_spectrum: TE
  q007_expected_dominant_band: ACT_MID
  interpretation: >-
    The Q-007 TE/intermediate-ell topology is treated as present at a corrected
    point only when the largest positive covariance-aware spectrum-band cell is
    TE x ACT_MID. Per-target raw component values and deltas are always emitted
    so this discrete topology label never replaces the numerical evidence.

execution:
  reoptimize: false
  derivatives: false
  point_parallelism: 3
  checkpointing: false
  reason_no_checkpoint: >-
    Each target is one deterministic fixed-parameter likelihood evaluation.
    No optimizer, sampler, or stateful chain is resumed.

gates:
  closure_tolerance: 1.0e-7
  mandatory:
    - Q_IDENTITY_GATE
    - Q008_EXACT_POINT_GATE
    - Q007_COMPARISON_GATE
    - BACKEND_Q_GATE
    - ACT_LIKELIHOOD_GATE
    - QUADRATIC_CLOSURE_GATE
    - JOB_COMPLETENESS_GATE
    - COVARIANCE_INTERPRETATION_GATE
    - SCIENTIFIC_INTERPRETATION_GATE
    - FINAL_RESULT_GATE

runtime:
  check_date: 2026-08-30
  github_hosted_default_job_timeout_minutes: 360
  point_job_timeout_minutes: 180
  aggregate_job_timeout_minutes: 20
  strategy: PARALLEL_FIXED_POINT_EVALUATIONS
  expected_point_jobs: 3
  single_job_risk_after_sharding: LOW
  note: >-
    GitHub's workflow syntax documents a default job timeout of 360 minutes.
    Q-009 is split into one independent job per corrected H0 target and does not
    rerun optimization or finite-difference derivatives.
