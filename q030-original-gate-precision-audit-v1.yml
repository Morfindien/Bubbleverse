name: Bubbleverse Q030 one-shot original-gate precision audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CURRENT_Q: Q030
  RUN_ID: Q030-ORIGINAL-GATE-PRECISION-AUDIT-V1
  RESULT_ID: R-Q030-ORIGINAL-GATE-PRECISION-AUDIT-001
  Q021_RUN_ID: '33882434170'
  Q022_RUN_ID: '33902262660'
  Q028_RUN_ID: '33957937309'
  Q030_V2_RUN_ID: '33961469874'

jobs:
  mask:
    name: Q030 original-gate audit mask ${{ matrix.mask }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mask: [3, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Static audit gates
        run: |
          python -m pip install --disable-pip-version-check PyYAML numpy
          python -m py_compile \
            q030_original_gate_precision_audit_v1.py \
            q030_original_gate_precision_audit_tests_v1.py \
            q030_interaction_preserving_decomposition_v2.py \
            q025_fullmf_component_attribution_v2.py
          python - <<'PY'
          import yaml
          c=yaml.safe_load(open('q030_original_gate_precision_audit_v1_config.yml'))
          assert c['project']['q']=='Q030'
          assert c['validation']['original_q029_identity_abs_tol']==1e-8
          assert c['validation']['original_aggregation_abs_tol']==1e-8
          assert c['validation']['delta_m_identity_abs_tol']==1e-11
          assert c['validation']['q028_parent_interaction_abs_tol']==2e-4
          assert c['validation']['tolerance_relaxation_forbidden'] is True
          assert c['execution']['new_likelihood_evaluations']==0
          assert c['audit']['stop_after_this_audit'] is True
          print('Q030_ORIGINAL_GATE_AUDIT_STATIC_GATE=PASS')
          PY

      - name: Reuse frozen full-MF environment
        run: bash q019_setup_v3.sh

      - name: Download authoritative Q022 stage1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q022_RUN_ID }}
          pattern: q022-v2-stage1-m*-s*
          merge-multiple: true
          path: q022_inputs/stage1

      - name: Download authoritative Q022 refinement
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q022_RUN_ID }}
          pattern: q022-v2-refine-m*-s*
          merge-multiple: true
          path: q022_inputs/refinement

      - name: Download authoritative Q022 final
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q022_RUN_ID }}
          name: q022-final-v2
          path: q022_inputs/final

      - name: Download exact Q021 primordial lineages
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q021_RUN_ID }}
          pattern: q021-full_mf-m*-r*
          merge-multiple: true
          path: q021_inputs

      - name: Download Q028 V8 family checkpoints
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q028_RUN_ID }}
          pattern: q028-v8-family-m${{ matrix.mask }}-*
          merge-multiple: true
          path: q028_family_inputs

      - name: Download exact Q028 V8 common support
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q028_RUN_ID }}
          name: q028-v8-common-support
          path: q028_support

      - name: Download successful Q030 V2 parent mask shard
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q030_V2_RUN_ID }}
          name: q030-v2-mask-m${{ matrix.mask }}
          path: q030_v2_parent

      - name: Run one-shot stable precision audit
        run: |
          mkdir -p out
          python q030_original_gate_precision_audit_v1.py \
            --config q030_original_gate_precision_audit_v1_config.yml \
            mask \
            --mask "${{ matrix.mask }}" \
            --q021-dir q021_inputs \
            --q022-dir q022_inputs \
            --family-dir q028_family_inputs \
            --support-result q028_support/q028_v8_support.json \
            --v2-mask-result "q030_v2_parent/q030_v2_mask_m${{ matrix.mask }}.json" \
            --output "out/q030_precision_audit_m${{ matrix.mask }}.json"

      - name: Upload precision audit mask result
        uses: actions/upload-artifact@v4
        with:
          name: q030-original-gate-audit-m${{ matrix.mask }}
          path: out/q030_precision_audit_m${{ matrix.mask }}.json
          if-no-files-found: error
          retention-days: 90

  final:
    name: Q030 original-gate audit merge and finite tests
    needs: mask
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: |
          python -m pip install --disable-pip-version-check PyYAML numpy
          python -m py_compile \
            q030_original_gate_precision_audit_v1.py \
            q030_original_gate_precision_audit_tests_v1.py

      - name: Download all audit mask results
        uses: actions/download-artifact@v4
        with:
          pattern: q030-original-gate-audit-m*
          merge-multiple: true
          path: audit_masks

      - name: Download authoritative Q028 V8 final
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.Q028_RUN_ID }}
          name: q028-final-v8
          path: q028_parent

      - name: Merge one-shot audit
        run: |
          python q030_original_gate_precision_audit_v1.py \
            --config q030_original_gate_precision_audit_v1_config.yml \
            merge \
            --mask-dir audit_masks \
            --q028-final q028_parent/q028_final_v8.json \
            --output q030_original_gate_precision_audit_merged_v1.json

      - name: Mandatory audit-integrity tests
        run: |
          python q030_original_gate_precision_audit_tests_v1.py \
            --config q030_original_gate_precision_audit_v1_config.yml \
            --result q030_original_gate_precision_audit_merged_v1.json \
            --output q030_original_gate_precision_audit_tests_v1.json

      - name: Construct final audit result
        run: |
          python - <<'PY'
          import json
          r=json.load(open('q030_original_gate_precision_audit_merged_v1.json'))
          t=json.load(open('q030_original_gate_precision_audit_tests_v1.json'))
          if t['AUDIT_EXECUTION_GATE'] != 'PASS':
              raise SystemExit('AUDIT_EXECUTION_GATE=FAIL')
          r['AUDIT_EXECUTION_GATE']='PASS'
          r['tests']=t
          with open('q030_original_gate_precision_audit_final_v1.json','w') as f:
              json.dump(r,f,indent=2,sort_keys=True)
              f.write('\n')
          print(
              'AUDIT_EXECUTION_GATE=PASS '
              'ORIGINAL_Q030_GATE='+str(r['ORIGINAL_Q030_GATE'])
          )
          PY

      - name: Upload final one-shot audit
        uses: actions/upload-artifact@v4
        with:
          name: q030-original-gate-precision-audit-final-v1
          path: |
            q030_original_gate_precision_audit_merged_v1.json
            q030_original_gate_precision_audit_tests_v1.json
            q030_original_gate_precision_audit_final_v1.json
          if-no-files-found: error
          retention-days: 90
