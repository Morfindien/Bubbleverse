project:
  q: Q016
  run_id: Q016-MATCHED-CMB-SURFACE-V6
  result_id: R-Q016-EDE-MATCHED-CMB-SURFACE-006
  title: Bubbleverse Q016 matched CMB surface
  status: V6_TARGETED_BASIN_REPLICATION_GENERATED_NOT_YET_EXECUTED
  case_id: NOT DOCUMENTED
scientific_question: 'Når Planck NPIPE, SPT-3G D1 og ACT DR6 undersøges på en bevidst
  matchet n=3 EDE-overflade med sammenlignelige CMB-observables og overlappende multipolområder,
  kan forskellen i high-H0-response forklares af experiment-/likelihood-specifik struktur,
  eller overlever et fælles residualmønster?

  '
model:
  name: ede_n3
  n_scf: 3
  backend_repository: mwt5345/class_ede
  backend_commit: 5a131c91d657dd9a7c6364cc45b038710f8d0d97
  target_h0: 71.5
  q011_exact_vector_as_external_endpoint: false
  preserve_q005_v14_bounds: true
surface:
  primary:
    observables:
    - TT
    - TE
    - EE
    ell_min: 600
    ell_max: 2000
    low_z_data: []
    lensing: false
  secondary:
    observables:
    - TT
    - TE
    - EE
    ell_min: 1000
    ell_max: 2000
    purpose: multifrequency_mechanism_test
  tau:
    mean: 0.051
    sigma: 0.006
    shared_auxiliary_constraint: true
    never_count_as_independent_cross_experiment_evidence: true
branches:
  planck:
    label: CAMSPEC_NPIPE_LITE_MATCHED
    source_ids:
    - K-039
    - K-044
    - K-045
    likelihood_family: CamSpec-NPIPE-lite
    repository: HTJense/camspec_npipe-lite
    pin_policy: IMMUTABLE_COMMIT_PINNED
    likelihood_adapter: planck_lite
    chain_native_nuisance:
    - A_planck
    - calTE
    - calEE
    commit: e387852d2ae8863735814449c682b089c3059318
  spt:
    label: SPT3G_D1_TNE_LITE_MATCHED
    source_ids:
    - K-040
    - K-041
    - K-042
    likelihood_family: candl
    candl_version: 2.0.3
    data_repository: SouthPoleTelescope/spt_candl_data
    data_release: v0
    dataset_shortcut: spt_candl_data.SPT3G_D1_TnE_lite
    likelihood_adapter: candl
    chain_native_nuisance:
    - Tcal
    - Ecal
    Tcal_constraint:
      mean: 1.0
      sigma: 0.0036
    data_commit: 2cec6e762a8c540484dd5acafc529f0035856350
    candl_distribution: candl-like
  act:
    label: ACT_DR6_CMBONLY_MATCHED
    source_ids:
    - K-036
    - K-043
    likelihood_family: ACT DR6 CMB-only
    repository: ACTCollaboration/DR6-ACT-lite
    release: v1.0.0
    likelihood_adapter: act_dr6_cmbonly
    chain_native_nuisance:
    - A_act
    - P_act
    repository_commit: 0e0cd2c703c62a0e980470b572602233b27750e1
    native_parameter_priors:
      A_act:
        min: 0.5
        max: 1.5
        ref: 1.0
        proposal: 0.003
      P_act:
        min: 0.9
        max: 1.1
        ref: 1.0
        proposal: 0.01
    data_transport_v5:
      mode: SINGLE_FETCH_SHARED_ARTIFACT_WITH_BOUNDED_FALLBACK
      target_relative_to_packages_path: data/ACTDR6CMBonly/v1.0/dr6_data_cmbonly.fits
      urls:
      - https://lambda.gsfc.nasa.gov/data/act/pspipe/sacc_files/dr6_data_cmbonly.tar.gz
      - https://portal.nersc.gov/project/act/dr6_data/dr6_data_cmbonly.tar.gz
      connect_timeout_seconds: 30
      per_url_max_seconds: 300
      fits_header_gate: SIMPLE
execution:
  modes:
  - reference_free_h0
  - fixed_h0_71p5
  restart_families:
  - base
  - high_h0
  - low_h0
  - ede_alt
  - rescue_c
  - rescue_d
  - basin_replicate_a
  - basin_replicate_b
  - basin_replicate_c
  max_parallel: 6
  github_job_timeout_minutes: 330
  soft_stop_minutes: 315
  optimizer:
    method: cobaya_minimize_bobyqa
    max_evals: 200000
    rhoend: 0.0001
  multistart_stability_delta_chi2_max: 1.0
  continuation:
    v4_parent_github_run_id: 33693382859
    v4_parent_head_sha: 596ee68677784deb4c28d1eb5992faf6dcd2c5b1
    v5_parent_github_run_id: 33720410690
    v5_parent_head_sha: 5148b8b3badbbe313d30e6f744d51d6fd42b584e
    v5_primary_merged_artifact_id: 9884213098
    reuse_v4_and_v5_complete_shards: true
    rerun_full_matrix: false
    targeted_profiles:
    - branch: planck
      mode: reference_free_h0
    - branch: spt
      mode: fixed_h0_71p5
    - branch: act
      mode: fixed_h0_71p5
    targeted_restart_ids:
    - 6
    - 7
    - 8
    minimum_distinct_complete_restarts: 4
    multistart_delta_chi2_max: 1.0
    minimum_replicates_within_delta_chi2: 2
  target_basin_lock_file: q016_target_basin_lock_v6.json
attribution:
  ell_bands:
  - - 600
    - 999
  - - 1000
    - 1499
  - - 1500
    - 2000
  definition: signed_covariance_allocation
  formula: c_i = d_i * (C^-1 d)_i
  independent_chi2_tests: false
rules:
  no_cross_chain_absolute_chi2_comparison: true
  no_cross_chain_chi2_sum: true
  no_shared_lowz_doublecount: true
  no_nuisance_transfer_between_experiments: true
  residual_shape_coherence_not_combined_significance: true
  q011_status: BEST-OBSERVED MINIMUM ONLY
  q015_status: FROZEN INPUT
parent_provenance:
  bubbleverse_repository: Morfindien/Bubbleverse
  inspected_main_tree_sha: 70c447a505acf0193a8604a23dc141faebfa026e
  reuse:
  - q005_hpc_v14.py
  - q005_hpc_v14_config.yml
  - q005_setup_v14.sh
  - q005_hpc_v14_requirements.txt
  reference_only:
  - q014_external_viability_v12.py
  - q014_external_viability_v12_config.yml
  - q014_external_viability_v12_source_lock.json
  - q014_tests_v12.py
  - q015_cmb_attribution_v3.py
  - q015_cmb_attribution_v3_config.yml
  - q015_cmb_attribution_v3_result.json
mandatory_gates:
- Q_IDENTITY_GATE
- CONTEXT_CONTINUITY_GATE
- MODEL_IDENTITY_GATE
- H0_TARGET_GATE
- ENDPOINT_REPROFILE_GATE
- Q011_NONPORTABILITY_GATE
- COMMON_MULTIPOLE_GATE
- COMMON_OBSERVABLE_GATE
- COMMON_TAU_GATE
- CHAIN_NATIVE_NUISANCE_GATE
- COVARIANCE_GATE
- NO_CROSS_CHAIN_CHI2_SUM_GATE
- NO_SHARED_LOWZ_DOUBLECOUNT_GATE
- FINITE_RESULT_GATE
- MULTISTART_STABILITY_GATE
- RESULT_PROVENANCE_GATE
- RESIDUAL_VECTOR_GATE
- FULL_VS_LITE_DIAGNOSTIC_GATE
- COMMON_RESIDUAL_DECISION_GATE
technical_revision:
  classification: SCIENTIFIC_NUMERICAL_BASIN_REPLICATION
  v5_exit_2_reason: MULTISTART_STABILITY_GATE failed for exactly three branch/mode
    profiles
  scientific_surface_changed: false
  scientific_gate_relaxed: false
  optimizer_start_strategy_changed: true
  changed_only: starting points for targeted minimizer basin replication
  primary_stage_success_semantics: workflow succeeds if primary endpoint gates pass;
    FINAL_RESULT_GATE remains PENDING_LATER_STAGES
